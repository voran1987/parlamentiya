name: Constitution Game API Smoke Test
on:
  push:
    paths:
      - 'constitution-game/**'
      - '.github/workflows/constitution-game-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Test Supabase room and game lifecycle
        run: python3 constitution-game/smoke_test.py
