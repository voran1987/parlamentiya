<title>Своя игра • Конституция Российской Федерации</title>
<style>
:root{--bg:#071529;--navy:#0e2341;--navy2:#163253;--edge:#2c4c6c;--text:#f2f7ff;--muted:#a9bfd2;--gold:#ffcc68;--cyan:#6cd8e7;--success:#5de0b2;--bad:#ff928f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{background:radial-gradient(circle at 70% -10%,#1c4369 0,transparent 40%),radial-gradient(circle at -12% 55%,#12325a 0,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.42}a{color:var(--cyan)}.wrap{max-width:1260px;margin:auto;padding:0 22px 54px}.host-space{padding-bottom:175px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:21px 0;border-bottom:1px solid var(--edge);margin-bottom:25px}.brand{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:52px;height:52px;border:1px solid #537d9f;background:#1f4169;color:var(--gold);font-family:Georgia,serif;font-size:32px;border-radius:12px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan)}.brandstrong{font-size:21px;font-weight:850;line-height:1.2}.muted{color:var(--muted)}.small{font-size:13px}.topright{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--edge);background:#142e4c;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.04em}.btn{background:#244564;border:1px solid #4b7393;color:var(--text);padding:12px 18px;border-radius:11px;font-weight:700;transition:background .2s,transform .1s;text-align:center}.btn:not(:disabled):hover{background:#2e567b}.btn:not(:disabled):active{transform:translateY(1px)}.btn.primary{background:var(--gold);border-color:var(--gold);color:#16233a}.btn.primary:not(:disabled):hover{background:#ffe1a0}.btn.green{background:#1f715c;border-color:#379a7d}.btn.danger{background:#66353a;border-color:#a35a62}.btn.outline{background:transparent}.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hero{padding:25px 0 16px}.hero h1{font-family:Georgia,serif;max-width:880px;line-height:1.07;font-size:clamp(39px,6vw,77px);font-weight:700;letter-spacing:-.035em;margin:9px 0 18px}.hero h1 em{font-style:normal;color:var(--gold)}.lead{max-width:750px;color:#c7d9ed;font-size:17px;line-height:1.65}.card{border:1px solid var(--edge);background:linear-gradient(160deg,#122944,#0d213a);box-shadow:0 12px 45px #0002;border-radius:19px;padding:25px}.card h2{font-size:23px;margin:0 0 13px}.card h3{margin:10px 0}.card p{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px;margin:21px 0}.field{width:100%;border-radius:10px;border:1px solid #456887;background:#081a30;padding:13px;color:var(--text);outline:none}.field:focus{border-color:var(--cyan)}label{display:block;margin:16px 0 7px;font-size:14px;font-weight:650}.home-steps{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.step{border:1px solid #345e78;border-radius:9px;background:#102d49;color:#d8ebfa;padding:10px 13px;font-size:13px}.roomline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.roomcode{font-weight:900;letter-spacing:.18em;color:var(--gold);font-size:31px}.scoreboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:11px;margin:14px 0 22px}.score-tile{border:1px solid #345a7b;background:#102a46;border-radius:15px;padding:14px 12px;min-width:0}.score-tile .nm{font-size:13px;overflow-wrap:anywhere;color:#d5e4f4}.score-tile .pt{font-weight:900;font-size:30px;color:var(--gold);margin:2px 0}.score-tile .members{font-size:11px;color:var(--muted)}.score-tile.leader{border-color:#bd9552;background:#1c3048}.round-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 14px}.round-header h2{font-family:Georgia,serif;font-size:32px;margin:0}.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.category{display:flex;flex-direction:column;gap:11px;min-width:0}.cat-head{height:89px;border:1px solid #45749d;background:#20466f;border-radius:11px;display:grid;place-items:center;text-align:center;font-size:15px;line-height:1.3;font-weight:900;padding:10px}.price{display:grid;place-items:center;min-height:93px;border:1px solid #55789b;background:linear-gradient(140deg,#204a78,#163352);color:var(--gold);border-radius:11px;font-size:31px;font-weight:900;box-shadow:inset 0 1px 0 #ffffff1a}.price:not(:disabled):hover{background:#2a659b;border-color:var(--cyan);transform:translateY(-2px)}.price.done{background:#0c2238;color:#718aa1;font-size:22px}.super-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.super-card{min-height:150px;border-radius:14px;border:1px solid #b99052;background:#473a32;color:#ffe2ae;font-weight:850;font-size:20px;padding:18px}.question-card{max-width:1050px;margin:20px auto}.question-title{font-family:Georgia,serif;font-size:clamp(27px,4.4vw,46px);line-height:1.22;margin:20px 0 22px}.question-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.question-price{font-size:20px;font-weight:900;color:var(--gold)}.timer{font-size:19px;font-weight:900;padding:10px 16px;border-radius:12px;background:#20425e;border:1px solid #5986a8}.timer.low{color:#ffb1a6;border-color:#c66d67}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:20px 0}.option{min-height:85px;border:1px solid #4e759b;background:#163553;color:#fff;border-radius:13px;padding:15px;font-weight:700;text-align:left;line-height:1.45}.option:not(:disabled):hover{background:#25517b}.option.good{border:2px solid #70e4af;background:#174b44}.option.wrong{border:2px solid #ff8787;background:#572f3c}.option .letter{display:inline-grid;place-items:center;border-radius:7px;border:1px solid #66839f;color:var(--gold);width:29px;height:29px;margin-right:9px;font-weight:900}.answerbar{border-radius:10px;background:#123951;padding:13px 17px;border:1px solid #326e88;margin:13px 0}.explanation{border-left:4px solid var(--success);background:#153f3b;padding:14px 18px;border-radius:0 12px 12px 0;margin:18px 0;line-height:1.6}.teams-status{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:15px 0}.team-status{padding:10px 7px;border:1px solid #34516a;text-align:center;border-radius:8px;color:#adcad9;font-size:12px}.team-status.ok{color:#96eac0;background:#18473e;border-color:#377d68}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #2d506a;padding:12px 0}.row:last-child{border:0}.row input{max-width:230px}.notice{background:#253c56;padding:15px 18px;border-radius:11px;border:1px solid #466a88;line-height:1.6;margin:15px 0}.waiting{text-align:center;padding:40px 20px}.waiting h2{font-family:Georgia,serif;font-size:31px}.sectioncap{text-transform:uppercase;font-weight:900;font-size:11px;letter-spacing:.17em;color:var(--cyan);margin-bottom:10px}.winning{border-color:#cba15d;background:#3d342d}.conclusion{text-align:center;padding:25px}.conclusion h2{font-family:Georgia,serif;font-size:49px}.qr-dock{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:min(1200px,100%);display:flex;align-items:center;gap:17px;padding:9px 20px;background:#10273df5;backdrop-filter:blur(12px);box-shadow:0 -10px 40px #020812bb;border:1px solid #4c718e;border-bottom:0;border-radius:18px 18px 0 0}.qr-dock img{width:102px;height:102px;padding:5px;background:white;border-radius:8px;object-fit:contain}.qr-dock .desc{flex:1;min-width:0}.qr-dock strong{display:block;font-size:14px}.qr-dock .link{color:#bdd4e8;font-size:12px;overflow-wrap:anywhere;margin-top:4px}.qr-dock .big-code{font-size:27px;letter-spacing:.16em;color:var(--gold);font-weight:900;line-height:1.3}.hidden{display:none!important}.toast{position:fixed;z-index:70;right:18px;top:88px;background:#165345;color:#fff;border:1px solid #53ab92;border-radius:12px;padding:13px 17px;max-width:380px;box-shadow:0 9px 32px #0009}.toast.error{background:#69343b;border-color:#cc838a}.footer{padding:22px 0;color:#879fb6;font-size:12px;text-align:center}.key-help{font-size:12px;color:var(--muted);margin-top:8px}#app[aria-busy="true"]{opacity:.76}
@media(max-width:800px){.scoreboard{grid-template-columns:repeat(3,minmax(0,1fr))}.board{gap:7px}.cat-head{font-size:12px;height:85px}.price{font-size:23px;min-height:74px}.cards{grid-template-columns:1fr}.options{grid-template-columns:1fr}.teams-status{grid-template-columns:repeat(3,1fr)}}@media(max-width:540px){.wrap{padding-left:12px;padding-right:12px}.top{padding-top:12px}.brandstrong{font-size:16px}.logo{width:42px;height:42px}.topright .pill{font-size:10px}.scoreboard{grid-template-columns:repeat(2,minmax(0,1fr))}.board{gap:5px}.category{gap:5px}.cat-head{font-size:11px;height:81px;padding:5px}.price{font-size:20px;min-height:68px}.round-header h2{font-size:26px}.card{padding:16px}.question-title{font-size:25px}.super-choices{grid-template-columns:1fr}.qr-dock{gap:10px;padding:7px 9px;border-radius:12px 12px 0 0}.qr-dock img{width:81px;height:81px}.qr-dock .big-code{font-size:23px}.qr-dock .link{font-size:10px}.qr-dock strong{font-size:12px}.qr-dock .btn{padding:9px;font-size:12px}.host-space{padding-bottom:142px}.teams-status{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="page">
<header class="top"><div class="brand"><div class="logo">К</div><div><div class="eyebrow">МЭИ · Интерактивный семинар</div><div class="brandstrong">СВОЯ ИГРА <span style="color:var(--gold)">/ КОНСТИТУЦИЯ</span></div></div></div><div class="topright"><span id="statusPill" class="pill">ОЖИДАНИЕ</span><button id="homeBtn" type="button" class="btn outline" title="Выйти на главную страницу">Главная</button></div></header>
<main id="app"><section class="card"><h2>Загрузка игры…</h2></section></main>
<footer class="footer">Учебная игра по Конституции Российской Федерации · текст Конституции: <a href="https://www.minjust.gov.ru/ru/documents/8011/" target="_blank" rel="noopener">Минюст России</a></footer>
</div>
<aside class="qr-dock hidden" id="qrDock" aria-label="Постоянный QR-код для подключения студентов"><img id="qrImg" alt="QR-код для входа студентов в игру"><div class="desc"><strong>Студенты подключаются по QR-коду · без пароля</strong><div class="big-code" id="dockCode"></div><div class="link" id="dockUrl"></div></div><button type="button" class="btn outline" id="copyJoinBtn">Ссылка</button></aside>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(function(){
"use strict";
const API="https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/constitution-game-api";
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const phaseNames={lobby:"Подключение",round1:"Тур I",round2:"Тур II",super:"Суперигра",finished:"Игра завершена"};
let code="",hostSecret="",playerToken="",role="",state=null,lastSignature="",stakeChoice=300,loading=false,serverTimestamp=0,serverRemaining=45,renderPaused=false;
const qs=new URLSearchParams(location.search);
function toast(msg,bad){const el=$("toast");el.textContent=msg;el.classList.toggle("error",!!bad);el.classList.remove("hidden");clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>el.classList.add("hidden"),4500)}
function linkJoin(){const u=new URL(location.href);u.search="?room="+encodeURIComponent(code)+"&join=1";u.hash="";return u.toString()}
function linkHost(){const u=new URL(location.href);u.search="?room="+encodeURIComponent(code)+"&host="+encodeURIComponent(hostSecret);u.hash="";return u.toString()}
function copy(s){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(()=>toast("Ссылка скопирована")).catch(()=>fallbackCopy(s))}else fallbackCopy(s)}
function fallbackCopy(s){const el=document.createElement("textarea");el.value=s;document.body.appendChild(el);el.select();document.execCommand("copy");el.remove();toast("Ссылка скопирована")}
function setSession(r,h,p){code=r;hostSecret=h||"";playerToken=p||"";role=hostSecret?"host":playerToken?"player":"guest";lastSignature="";if(role==="host")localStorage.setItem("con_host_"+code,hostSecret);if(role==="player")localStorage.setItem("con_player_"+code,playerToken);history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(code));updateDock()}
function updateDock(){const host=role==="host"&&code;const el=$("qrDock");el.classList.toggle("hidden",!host);$("page").classList.toggle("host-space",!!host);if(!host)return;const u=linkJoin();$("dockCode").textContent=code;$("dockUrl").textContent=u;$("qrImg").onerror=function(){if(!this.dataset.fallback){this.dataset.fallback="1";this.src="https://quickchart.io/qr?size=230&text="+encodeURIComponent(u)}};$("qrImg").dataset.fallback="";$("qrImg").src="https://api.qrserver.com/v1/create-qr-code/?size=230x230&margin=8&data="+encodeURIComponent(u)}
async function api(action,params){const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({action,room:code,hostSecret:hostSecret||undefined,playerToken:playerToken||undefined},params||{}))});const data=await res.json().catch(()=>({error:"Сервер вернул некорректный ответ"}));if(!res.ok||data.error)throw Error(data.error||"Ошибка соединения");return data}
async function act(action,params){if(loading)return;loading=true;try{const out=await api(action,params);if(action==="create"){setSession(out.room,out.hostSecret,"");toast("Комната создана")}if(action==="join"){setSession(code,"",out.playerToken);toast("Вы подключены к команде")}await refresh(true)}catch(e){toast(e.message,true)}finally{loading=false}}
function signature(d){return JSON.stringify([d.phase,d.host,d.player?.team,d.revealed,d.question?.id,d.usedCount,d.answeredTeams,d.myChoice,d.myWager,d.teams.map(t=>[t.score,t.members,t.team_name])])}
async function refresh(force){if(!code)return;try{const s=await api("state");state=s;serverRemaining=s.remaining;serverTimestamp=Date.now();if(!force&&document.activeElement&&["INPUT","SELECT"].includes(document.activeElement.tagName)&&!s.question?.id)return;let sig=signature(s);if(force||sig!==lastSignature){lastSignature=sig;render(s)}updateTimer()}catch(e){if(force)toast(e.message,true)}}
function setTitle(txt){$("statusPill").textContent=txt}
function home(){code="";role="";hostSecret="";playerToken="";state=null;lastSignature="";history.replaceState(null,"",location.pathname);updateDock();setTitle("ОЖИДАНИЕ");renderHome()}
function renderHome(){const u=new URLSearchParams(location.search);const join=u.get("room");$("app").innerHTML='<section class="hero"><div class="eyebrow">Интерактивный командный турнир</div><h1>Кто знает <em>Конституцию?</em></h1><p class="lead">Два тура с выбором темы и стоимости вопроса, затем суперигра со ставками. Ответы принимаются с телефонов: один вариант от всей команды. Ведущий управляет игрой с общего экрана.</p><div class="home-steps"><span class="step">I ТУР · 12 вопросов</span><span class="step">II ТУР · 12 вопросов</span><span class="step">СУПЕРИГРА · ставка и финал</span></div></section><div class="cards"><section class="card"><div class="sectioncap">Кабинет ведущего</div><h2>Начать новую игру</h2><p class="muted">Создайте комнату, покажите QR-код аудитории и управляйте всеми турами. У ведущего — отдельная секретная ссылка.</p><button id="create" type="button" class="btn primary">Создать игровую комнату</button></section><section class="card"><div class="sectioncap">Студентам</div><h2>Присоединиться к команде</h2><p class="muted">Отсканируйте QR-код на экране ведущего или введите код комнаты.</p><label for="roomInput">Код комнаты</label><input class="field" id="roomInput" placeholder="ABC234" maxlength="6" value="'+esc(join||"")+'"><div class="buttons" style="margin-top:15px"><button id="goRoom" type="button" class="btn">Продолжить</button></div></section></div><div class="notice"><strong>Правила:</strong> правильный ответ прибавляет стоимость вопроса, неправильный — вычитает половину стоимости. В суперигре команда выбирает ставку (кратную 100): при правильном ответе сумма добавляется, при неправильном — вычитается. Команды, не отправившие ответ, очков не теряют.</div>';$("create").onclick=()=>act("create");$("goRoom").onclick=()=>{let c=$("roomInput").value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(c))return toast("Введите шестисимвольный код комнаты",true);code=c;role="guest";history.replaceState(null,"",location.pathname+"?room="+c);refresh(true)}}
function scoreboard(d){const teams=[...d.teams].sort((a,b)=>b.score-a.score||a.team_num-b.team_num);const top=teams[0]?.score;return '<div class="scoreboard">'+teams.map(t=>'<div class="score-tile '+(t.score===top&&t.members?'leader':'')+'"><div class="nm">'+esc(t.team_name)+'</div><div class="pt">'+t.score+'</div><div class="members">'+t.members+' участн. · ответ от команды</div></div>').join("")+'</div>'}
function board(d){const round=d.phase==="round1"?1:2;const entries=round===1?d.round1:d.round2;const cats=[...new Set(entries.map(e=>e.cat))];return '<div class="round-header"><div><div class="sectioncap">'+(round===1?"Первый тур":"Второй тур")+'</div><h2>Выберите тему и стоимость</h2></div><span class="pill">Сыграно '+entries.filter(v=>v.used).length+' из '+entries.length+'</span></div><div class="board">'+cats.map(cat=>'<div class="category"><div class="cat-head">'+esc(cat)+'</div>'+entries.filter(x=>x.cat===cat).map(q=>d.host?'<button class="price '+(q.used?'done':'')+'" data-key="'+esc(q.id)+'" '+(q.used?'disabled':'')+'>'+(q.used?'✓':q.value)+'</button>':'<div class="price '+(q.used?'done':'')+'">'+(q.used?'✓':q.value)+'</div>').join("")+'</div>').join("")+'</div>'}
function playersStatus(d){const answered=new Set((d.answers||[]).map(x=>x.team));if(!d.revealed)return '<div class="notice">Команд отправили ответы: <strong>'+d.answeredTeams+' из 5</strong>. Ответ от команды принимается только один раз.</div>';return '<div class="teams-status">'+d.teams.map(t=>'<div class="team-status '+(answered.has(t.team_num)?'ok':'')+'">'+esc(t.team_name)+' · '+(answered.has(t.team_num)?'ответил':'нет ответа')+'</div>').join("")+'</div>'}
function question(d){const q=d.question;let html='<section class="card question-card"><div class="question-top"><div><div class="sectioncap">'+(q.round===3?"Суперигра":q.round===1?"Первый тур":"Второй тур")+' · '+esc(q.cat)+'</div><span class="question-price">'+(q.round===3?"Ставка команды":q.value+" очков")+'</span></div><div class="timer" id="timer">00:45</div></div><h2 class="question-title">'+esc(q.text)+'</h2>';
const chosen=d.myChoice;
html+='<div class="options">'+q.options.map((v,i)=>{const isCorrect=d.revealed&&i===q.correct;const isWrong=d.revealed&&chosen===i&&i!==q.correct;const selection=chosen===i?' · ваш выбор':'';let cls=isCorrect?' good':isWrong?' wrong':'';let disabled=d.host||d.revealed||chosen!==null;return '<button type="button" class="option'+cls+'" data-choice="'+i+'" '+(disabled?'disabled':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+esc(v)+selection+'</button>'}).join("")+'</div>';
if(d.host){html+=playersStatus(d);if(!d.revealed){html+='<div class="buttons"><button type="button" class="btn primary" id="revealBtn">Показать правильный ответ и начислить баллы</button></div><p class="key-help">Проверка ответов и изменение командного счёта происходят на сервере при раскрытии вопроса.</p>'}else{html+=explanation(q);html+='<div class="buttons"><button type="button" class="btn primary" id="closeBtn">Вернуться к полю</button>'+(q.round===3?'<button type="button" class="btn green" id="finishBtn">Подвести итоги игры</button>':'')+'</div>'}}
else if(d.player){if(chosen===null&&!d.revealed){if(q.round===3){const team=d.teams.find(t=>t.team_num===d.player.team);const max=Math.max(300,team?.score||0);const vals=[];for(let n=0;n<=max;n+=100)vals.push(n);if(stakeChoice>max)stakeChoice=max-max%100;html+='<label for="stake">Ставка команды (0–'+max+' баллов)</label><select id="stake" class="field" style="max-width:250px">'+vals.map(n=>'<option value="'+n+'" '+(n===stakeChoice?'selected':'')+'>'+n+' баллов</option>').join("")+'</select><p class="small muted">Один вариант ответа и одна ставка на всю команду.</p>'}html+='<div class="answerbar">Обсудите вопрос и нажмите один вариант ответа. Повторная отправка от команды невозможна.</div>'}else if(chosen!==null&&!d.revealed){html+='<div class="answerbar">✓ Ответ команды принят'+(q.round===3?' · ставка '+d.myWager:'')+'. Ожидайте решения ведущего.</div>'}else if(d.revealed){html+=explanation(q)}}
else{html+='<div class="notice">Подключитесь к команде, чтобы отвечать на вопросы.</div>';if(d.revealed)html+=explanation(q)}
return html+'</section>'}
function explanation(q){return '<div class="explanation"><strong>Правильный ответ: '+String.fromCharCode(65+q.correct)+'.</strong> '+esc(q.explanation)+'<div class="small" style="margin-top:8px;color:#b6e7d0">Конституция РФ · '+esc(q.article)+'</div></div>'}
function superBoard(d){return '<section class="card"><div class="sectioncap">Финальный раунд</div><h2>Суперигра</h2><p class="muted">Ведущий выбирает одну из трёх тем. После появления вопроса каждая команда делает ставку и отправляет один ответ. Ставка добавляется при верном решении и вычитается при неверном.</p><div class="super-choices">'+d.superBoard.map(q=>d.host?'<button class="super-card" data-key="'+esc(q.id)+'" '+(q.used?'disabled':'')+'>'+esc(q.cat)+'</button>':'<div class="super-card">'+esc(q.cat)+'</div>').join("")+'</div></section>'}
function joinView(d){return '<div class="cards"><section class="card"><div class="sectioncap">Подключение к комнате '+esc(code)+'</div><h2>Выберите свою команду</h2><label for="name">Ваше имя</label><input id="name" class="field" maxlength="40" placeholder="Имя или псевдоним"><label for="team">Команда</label><select id="team" class="field">'+d.teams.map(t=>'<option value="'+t.team_num+'">'+esc(t.team_name)+' · '+t.members+' участн.</option>').join("")+'</select><button id="join" type="button" class="btn primary" style="margin-top:17px">Войти в игру</button></section><section class="card"><h2>Правила командного ответа</h2><p>Все участники видят вопрос на смартфонах. Команда обсуждает решение, затем <strong>один из участников</strong> отправляет вариант. Система принимает только первый ответ команды.</p><p class="muted">После этого ждите раскрытия правильного ответа ведущим. Личный рейтинг не ведётся.</p></section></div>'}
function lobbyView(d){if(d.host)return '<div class="cards"><section class="card"><div class="sectioncap">Кабинет ведущего</div><h2>Комната <span style="color:var(--gold)">'+esc(code)+'</span></h2><p class="muted">Покажите студентам QR-код внизу экрана. Каждый выбирает команду и входит без пароля.</p><div class="buttons"><button id="copyJoinTop" class="btn" type="button">Скопировать вход студентов</button><button id="copyHostTop" class="btn outline" type="button">Секретная ссылка ведущего</button></div><p class="small muted">Не показывайте секретную ссылку ведущего студентам — она даёт управление игрой.</p><button type="button" class="btn primary" id="startGame" style="margin-top:14px">Начать первый тур</button></section><section class="card"><h2>Пять команд</h2><p class="small muted">Названия можно изменить до начала игры. Количество участников обновляется автоматически.</p>'+d.teams.map(t=>'<div class="row"><span><strong>'+esc(t.team_name)+'</strong><br><small class="muted">'+t.members+' участн.</small></span><button class="btn outline" type="button" data-rename="'+t.team_num+'">Переименовать</button></div>').join("")+'</section></div>';
 if(d.player)return '<section class="card waiting"><div class="sectioncap">Вы подключены</div><h2>'+esc(d.player.name)+', добро пожаловать!</h2><p>Ваша команда: <strong>'+esc(d.teams.find(t=>t.team_num===d.player.team)?.team_name)+'</strong></p><p class="muted">Ожидайте начала первого тура. Ответы будут появляться на этом экране.</p></section>';
 return joinView(d)}
function finished(d){const t=[...d.teams].sort((a,b)=>b.score-a.score||a.team_num-b.team_num);return '<section class="card conclusion winning"><div class="sectioncap">Турнир завершён</div><h2>Итоги игры</h2><p class="lead" style="margin:auto">Победитель: <strong style="color:var(--gold)">'+esc(t[0]?.team_name||"—")+'</strong></p><div style="max-width:750px;margin:28px auto">'+t.map((v,i)=>'<div class="row"><span>'+(i+1)+'. '+esc(v.team_name)+'</span><strong style="font-size:24px;color:var(--gold)">'+v.score+'</strong></div>').join("")+'</div>'+(d.host?'<div class="buttons" style="justify-content:center"><button id="resetBtn" class="btn">Сыграть ещё раз</button><button id="csvBtn" class="btn primary">Скачать итоговый CSV</button></div>':'')+'</section>'}
function render(d){setTitle((d.host?"ВЕДУЩИЙ · ":d.player?"ИГРОК · ":"")+(phaseNames[d.phase]||"Игра"));let out='';if(d.player||d.host)out+=scoreboard(d);
 if(d.phase==="lobby")out+=lobbyView(d);
 else if(d.phase==="finished")out+=finished(d);
 else if(d.question){out+=question(d);if(d.host&&d.phase!=="super"&&d.revealed)out+='<div class="notice">После закрытия вопроса выберите следующую ячейку или перейдите к следующему туру.</div>'}
 else if(d.phase==="super"){out+=superBoard(d);if(d.host)out+='<div class="buttons" style="margin-top:16px"><button id="resetBtn" class="btn danger">Сброс игры</button></div>'}
 else if(d.phase==="round1"||d.phase==="round2"){out+=board(d);if(d.host)out+='<div class="buttons" style="margin-top:20px"><button id="advance" type="button" class="btn primary">'+(d.phase==="round1"?"Перейти ко второму туру":"Перейти к суперигре")+'</button><button id="resetBtn" class="btn danger">Сброс игры</button></div>';else if(d.player)out+='<div class="notice">Ведущий выбирает следующий вопрос. Приготовьтесь обсуждать ответ в команде.</div>'}
 if(d.phase!=="lobby"&&!d.host&&!d.player)out+=joinView(d);
 $("app").innerHTML=out;bind(d);updateTimer()}
function bind(d){$("join")?.addEventListener("click",()=>{const name=$("name").value.trim();const team=Number($("team").value);act("join",{name,team})});
 $("startGame")?.addEventListener("click",()=>act("start"));
 $("copyJoinTop")?.addEventListener("click",()=>copy(linkJoin()));
 $("copyHostTop")?.addEventListener("click",()=>copy(linkHost()));
 document.querySelectorAll("[data-rename]").forEach(el=>el.addEventListener("click",async()=>{const n=Number(el.dataset.rename),prev=d.teams.find(t=>t.team_num===n)?.team_name;const name=prompt("Новое название команды:",prev);if(name&&name.trim()!==prev)act("rename",{team:n,name:name.trim()})}));
 document.querySelectorAll("[data-key]").forEach(el=>el.addEventListener("click",()=>act("open",{key:el.dataset.key})));
 document.querySelectorAll("[data-choice]").forEach(el=>el.addEventListener("click",()=>{if(!d.player||d.myChoice!==null||d.revealed)return;let wager=0;if(d.question?.round===3)wager=Number($("stake")?.value||0);act("answer",{choice:Number(el.dataset.choice),wager})}));
 $("stake")?.addEventListener("change",e=>{stakeChoice=Number(e.target.value)});
 $("revealBtn")?.addEventListener("click",()=>act("reveal"));
 $("closeBtn")?.addEventListener("click",()=>act("close"));
 $("finishBtn")?.addEventListener("click",()=>act("advance"));
 $("advance")?.addEventListener("click",()=>{if(confirm("Завершить текущий тур и перейти к следующему? Неоткрытые вопросы текущего тура станут недоступны."))act("advance")});
 $("resetBtn")?.addEventListener("click",()=>{if(confirm("Сбросить все ответы и баллы? Участники сохранят подключение."))act("reset",{dropPlayers:false})});
 $("csvBtn")?.addEventListener("click",()=>{const rows=[["Место","Команда","Баллы","Участников"],...[...d.teams].sort((a,b)=>b.score-a.score).map((t,i)=>[i+1,t.team_name,t.score,t.members])];const text="\ufeff"+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");const url=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="constitution-game-"+code+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)})}
function updateTimer(){const t=$("timer");if(!t||!state?.question)return;const rest=Math.max(0,serverRemaining-Math.floor((Date.now()-serverTimestamp)/1000));const v=state.revealed?0:rest;t.textContent="00:"+String(v).padStart(2,"0");t.classList.toggle("low",v<=10)}
$("homeBtn").onclick=()=>home();$("copyJoinBtn").onclick=()=>copy(linkJoin());
(function boot(){
const c=(qs.get("room")||"").toUpperCase();
const secret=qs.get("host")||"";
if(c&&/^[A-Z2-9]{6}$/.test(c)){
 code=c;hostSecret=secret||localStorage.getItem("con_host_"+c)||"";playerToken=hostSecret?"":localStorage.getItem("con_player_"+c)||"";role=hostSecret?"host":playerToken?"player":"guest";
 if(secret)localStorage.setItem("con_host_"+c,secret);
 history.replaceState(null,"",location.pathname+"?room="+c);
 updateDock();refresh(true);
}else renderHome();
setInterval(()=>refresh(false),2600);setInterval(updateTimer,350);
})();
})();
</script>
</body>
