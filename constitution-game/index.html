<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6F5F1"><title>Своя игра — Конституция Российской Федерации</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F5F1;--surf:#FFFFFF;--surf2:#EAE8E0;--fg:#1B1B18;--mute:#66665D;--line:#D9D6CB;--acc:#8A3B2A;--accfg:#FFFFFF;--good:#2F6B3F;--bad:#A02A2A;--c0:#8A3B2A;--c1:#5E6B5A;--c2:#5F7482;--c3:#9A7228;--c4:#4A4A44;--used:#E4E2DA;--usedfg:#A9A79C;--serif:"Literata",Georgia,"Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",Arial,sans-serif;color-scheme:light}
:root[data-theme="dark"]{--bg:#171715;--surf:#22221F;--surf2:#2D2D29;--fg:#EEEBE2;--mute:#A3A196;--line:#3A3934;--acc:#D07A62;--accfg:#171715;--good:#7CC48E;--bad:#E78A8A;--c0:#A9503B;--c1:#6C7C67;--c2:#6E8594;--c3:#B1893A;--c4:#5A5A52;--used:#242421;--usedfg:#5A5950;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;margin:0;min-height:100vh;padding:16px max(16px,env(safe-area-inset-right,0px)) 28px max(16px,env(safe-area-inset-left,0px))}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--fg);padding:9px 14px;font-weight:600}
button:hover:not(:disabled){border-color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button.good{background:var(--good);color:#fff;border-color:var(--good)}
button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
a{color:var(--acc)}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-family:var(--serif);font-size:clamp(22px,3.4vw,32px);margin:0;text-wrap:balance}
h2{font-family:var(--serif);line-height:1.2;margin:2px 0 13px}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.roundtabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--mute)}
.hint{font-size:14px;color:var(--mute);line-height:1.5}
.box{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:18px}
.home{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:block;width:100%;font:inherit;background:var(--surf);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
textarea.field{resize:vertical;line-height:1.45;min-height:105px}
label{display:block;margin:11px 0 5px;font-size:14px;font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:13px 0}
.pill{display:inline-block;border:1px solid var(--line);border-radius:100px;padding:6px 10px;font-size:12px;font-weight:700}
.boardwrap{overflow-x:auto}
.board{display:grid;grid-template-columns:repeat(5,minmax(104px,1fr));gap:8px;min-width:630px}
.cat{border-radius:8px;color:#fff;font-family:var(--serif);font-weight:700;text-align:center;padding:12px 6px;font-size:clamp(13px,1.5vw,17px);display:flex;align-items:center;justify-content:center;min-height:64px;text-wrap:balance;overflow-wrap:anywhere}
.cell{border-radius:8px;border:2px solid;background:var(--surf);font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.6vw,38px);height:clamp(62px,8vw,91px);display:flex;align-items:center;justify-content:center;padding:0}
.cell:hover:not(:disabled){background:var(--surf2)}
.cell.used{background:var(--used);border-color:var(--used)!important;color:var(--usedfg)!important;font-size:0}
.cell.used:after{content:"✓";font-size:22px}
.cell:disabled:not(.used){opacity:1}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.team{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.team .name{font-weight:700;overflow-wrap:anywhere}
.team input{font:inherit;font-weight:600;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--fg);padding:2px 0;width:100%}
.score{font-family:var(--serif);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.score.neg{color:var(--bad)}
.team.lead{outline:2px solid var(--good)}
.team .members{color:var(--mute);font-size:12px}
.adj{display:flex;gap:6px;flex-wrap:wrap}
.adj button{padding:3px 9px;font-size:13px}
.panel{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 20px}
.pin{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-height:100%}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.plabel{font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.pval{font-family:var(--serif);font-size:30px;font-weight:700}
.ctx{background:var(--surf2);border-radius:12px;padding:16px 18px;font-size:clamp(16px,2vw,20px);line-height:1.5}
.ctx b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.qq{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.7vw,38px);line-height:1.25;text-wrap:balance;margin:5px 0}
.ans{border-radius:12px;padding:16px 20px;color:#fff;background:var(--good);font-family:var(--serif);font-weight:700;font-size:clamp(19px,2.7vw,30px);line-height:1.4}
.pbot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.award{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.aw{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.aw .nm{font-weight:700;overflow-wrap:anywhere}
.aw .sc{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px}
.aw .response{overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.4;font-size:14px;flex:1}
.aw .graded{font-size:13px;font-weight:700}
.gradeactions{display:flex;gap:6px}
.gradeactions button{flex:1;padding:8px 4px}
.gradeactions .on{outline:2px solid var(--good);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.status{background:var(--surf2);padding:10px 14px;border-radius:8px;font-weight:600}
.status.error{color:var(--bad)}
.wager{width:160px;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--fg)}
.suplinks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.suplinks button{min-height:125px;font-family:var(--serif);font-size:20px;background:var(--surf);color:var(--fg)}
.qrdock{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(1180px,100%);z-index:30;background:var(--surf);border:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 32px #0002;padding:8px 15px;display:flex;align-items:center;gap:15px}
.qrdock img{width:95px;height:95px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:7px}
.qrdock .docktxt{flex:1;min-width:0}
.qrdock .code{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--acc);letter-spacing:.12em}
.qrdock .url{overflow-wrap:anywhere;font-size:12px;color:var(--mute)}
.qrdock .docklabel{font-size:13px;font-weight:700}
.hostbody .wrap{padding-bottom:165px}
.hostbody .panel{padding-bottom:145px}
.hidden{display:none!important}
.toast{position:fixed;right:12px;top:14px;background:var(--good);color:#fff;border-radius:8px;padding:11px 15px;z-index:60;max-width:350px}
.toast.error{background:var(--bad)}
footer{color:var(--mute);font-size:12px;margin:15px 0;text-align:center}
.timer{display:inline-block;border:1px solid var(--line);padding:7px 10px;border-radius:8px;font-weight:700;font-size:17px}
.timer.low{color:var(--bad);border-color:var(--bad)}
.miniresponse{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);margin-bottom:6px;line-height:1.4}
.resultlist{display:flex;flex-direction:column;gap:6px;max-width:750px}
.resultlist .result{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line)}
@media(max-width:740px){.home{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.suplinks{grid-template-columns:1fr}.board{gap:5px}.cat{font-size:12px}.cell{font-size:25px;height:70px}}
@media(max-width:500px){body{padding:10px}.wrap{gap:12px}.board{min-width:590px}.qrdock{gap:9px;padding:6px 9px}.qrdock img{width:76px;height:76px}.qrdock .code{font-size:21px}.qrdock .url{font-size:10px}.qrdock .docklabel{font-size:11px}.qrdock button{padding:7px 8px;font-size:12px}.hostbody .panel{padding-bottom:125px}}
.buzzer{width:100%;min-height:155px;border:3px solid #862821;border-radius:20px;background:linear-gradient(160deg,#b94f3a,#8A3B2A);color:white;font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,54px);box-shadow:0 8px 0 #5d2319,0 15px 25px #0002;margin:19px 0;touch-action:manipulation;user-select:none}.buzzer small{font:600 15px var(--sans);display:block;margin-top:8px}.buzzer:active:not(:disabled){transform:translateY(5px);box-shadow:0 3px 0 #5d2319}.buzzer:disabled{background:var(--used);border-color:var(--line);color:var(--mute);box-shadow:none;opacity:0.72}.buzzer-winner{background:var(--surf2);border:2px solid var(--acc);border-radius:15px;padding:20px;margin:15px 0;text-align:center}.buzzer-winner .winner-name{font:700 clamp(25px,4vw,43px) var(--serif);color:var(--acc);margin:8px 0}.buzzer-winner p{font-size:17px}.you-won{border-color:var(--good);background:color-mix(in srgb,var(--good) 9%,var(--surf))}.you-won .winner-name{color:var(--good)}.buzz-ready-label{text-align:center;font-size:18px;font-weight:700;margin-top:20px}.aw.active-team{outline:3px solid var(--acc);outline-offset:1px}.buzz-ready{border:2px solid var(--good)}.buzz-locked{text-align:center}.final-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:11px;margin:18px 0}.final-card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}.final-answer{font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;background:var(--surf2);border-radius:9px;padding:12px;margin-top:8px}.final-grid .gradeactions{display:flex;flex-wrap:wrap;gap:6px}.final-grid .gradeactions button{flex:1 1 105px;font-size:13px;padding:8px 6px}.final-card .nm{font-weight:700}</style></head><body>
<main class="wrap" id="app"><section class="box"><h2>Загрузка игры…</h2></section></main>
<aside class="qrdock hidden" id="qrDock"><img id="qrImage" alt="QR-код подключения к игре"><div class="docktxt"><div class="docklabel">Подключение студентов по QR-коду · без пароля</div><div class="code" id="dockCode"></div><div class="url" id="dockUrl"></div></div><button id="copyJoin">Ссылка</button></aside>
<div class="toast hidden" id="toast" aria-live="polite"></div>
<script>(function(){
"use strict";
const API="https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/constitution-game-api";
const $=id=>document.getElementById(id);
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cols=["--c0","--c1","--c2","--c3","--c4"];
const phases={lobby:"Подключение",round1:"Первый тур",round2:"Второй тур",super:"Суперигра",finished:"Финал"};
let code="",hostSecret="",playerToken="",role="",state=null,lastSignature="",remaining=90,lastSync=0,active=false,wager=0,busy=false;
function show(msg,bad=false){const el=$("toast");el.textContent=msg;el.className="toast"+(bad?" error":"");clearTimeout(show.t);show.t=setTimeout(()=>el.classList.add("hidden"),5000)}
function joinLink(){let u=new URL("student.html",location.href);u.search="?room="+encodeURIComponent(code);return u.toString()}
function hostLink(){let u=new URL(location.href);u.search="?room="+encodeURIComponent(code)+"&host="+encodeURIComponent(hostSecret);return u.toString()}
function copy(text){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>show("Ссылка скопирована")).catch(()=>fallback(text));else fallback(text)}
function fallback(text){const el=document.createElement("textarea");el.value=text;document.body.appendChild(el);el.select();document.execCommand("copy");el.remove();show("Ссылка скопирована")}
function dock(){const on=role==="host"&&!!code;$("qrDock").classList.toggle("hidden",!on);document.body.classList.toggle("hostbody",on);if(!on)return;const link=joinLink();$("dockCode").textContent=code;$("dockUrl").textContent=link;$("qrImage").onerror=function(){if(!this.dataset.fallback){this.dataset.fallback="1";this.src="https://quickchart.io/qr?size=240&text="+encodeURIComponent(link)}};$("qrImage").dataset.fallback="";$("qrImage").src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&margin=8&data="+encodeURIComponent(link)}
function setSession(room,secret,token){code=room;hostSecret=secret||"";playerToken=token||"";role=hostSecret?"host":playerToken?"player":"guest";state=null;lastSignature="";if(hostSecret)localStorage.setItem("constitution_host_"+room,hostSecret);if(playerToken)localStorage.setItem("constitution_player_"+room,playerToken);history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room)+(role==="player"?"&join=1":""));dock()}
async function api(action,extra={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,room:code,hostSecret:hostSecret||undefined,playerToken:playerToken||undefined,...extra})});let x;try{x=await r.json()}catch{x={error:"Не удалось получить ответ сервера"}}if(!r.ok||x.error)throw Error(x.error||"Ошибка сервера");return x}
async function act(action,params={}){if(busy)return;busy=true;try{const x=await api(action,params);if(action==="create"){setSession(x.room,x.hostSecret,"");show("Комната создана")}else if(action==="join"){setSession(code,"",x.playerToken);show("Вы присоединились к команде")}else if(action==="grade"){show(x.delta>0?"Баллы начислены":x.delta<0?"Баллы списаны":"Ответ оценён")}await refresh(true)}catch(e){show(e.message,true)}finally{busy=false}}
function sign(d){return JSON.stringify([d.phase,d.question?.id,d.revealed,d.usedCount,d.host,d.player?.team,d.myBuzz,d.myGrade,d.myFinal?.text,d.finalLocked,d.buzzOpen,d.buzzActiveTeam,d.attemptedTeams,d.answeredTeams,d.answers?.map(x=>[x.team,x.grade,x.wager,x.text]),d.teams.map(t=>[t.team_name,t.score,t.members])])}
async function refresh(force=false){if(!code)return;try{const d=await api("state");remaining=d.remaining;lastSync=Date.now();const s=sign(d);const editing=!force&&document.activeElement?.id==="finalText"&&state?.question?.id===d.question?.id&&d.phase==="super"&&!d.finalLocked&&!d.myFinal;state=d;if(force||(!editing&&s!==lastSignature)){lastSignature=s;render(d)}updateClock()}catch(e){if(force)show(e.message,true)}}
function timerText(seconds){return Math.floor(seconds/60)+":"+String(seconds%60).padStart(2,"0")}
function updateClock(){const t=$("clock");if(t&&state?.question){const current=Math.max(0,remaining-Math.floor((Date.now()-lastSync)/1000));t.textContent=timerText(state.revealed?0:current);t.classList.toggle("low",current<=15)}}
function home(){code="";hostSecret="";playerToken="";role="";state=null;lastSignature="";history.replaceState(null,"",location.pathname);dock();renderHome()}
function renderHome(){const p=new URLSearchParams(location.search);$("app").innerHTML='<header><div><h1>Своя игра: Конституция России</h1><div class="sub">Основы российской государственности · два тура и суперигра</div></div><div class="tools"><button id="theme" title="Сменить тему">Сменить тему</button></div></header><div class="pills"><span class="pill">I тур · 25 вопросов</span><span class="pill">II тур · 25 вопросов</span><span class="pill">III тур · письменный ответ</span><span class="pill">До 5 команд</span></div><p class="hint">Открытые вопросы без вариантов. Кто первым нажмёт «Ответить» на смартфоне, тот получает право устного ответа. Ведущий отмечает результат. При ошибке право переходит другим командам.</p><div class="home"><section class="box"><div class="label">Кабинет преподавателя</div><h2>Новая игровая комната</h2><p>Ведущий выбирает вопросы на общем табло и оценивает ответы. Студенты подключаются по QR-коду.</p><button class="pri" id="create">Создать игру</button></section><section class="box"><div class="label">Для участников</div><h2>Вход в команду</h2><p>Сканируйте QR-код ведущего или введите код комнаты:</p><label for="roomInput">Код комнаты</label><input id="roomInput" class="field" placeholder="ABC234" maxlength="6" value="'+esc(p.get("room")||"")+'"><p><button id="goRoom">Войти</button></p></section></div><p class="hint">Верный устный ответ: +стоимость вопроса, неверный: −половина стоимости. После ошибки кнопки других команд снова доступны. В третьем туре один сложный вопрос: каждая команда делает ставку и отправляет письменный ответ.</p>';
 $("create").onclick=()=>act("create");$("goRoom").onclick=()=>{const c=$("roomInput").value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(c))return show("Введите шестизначный код",true);code=c;role="guest";history.replaceState(null,"",location.pathname+"?room="+c);refresh(true)};$("theme").onclick=toggleTheme}
function toggleTheme(){const root=document.documentElement;const v=root.dataset.theme==="dark"?"light":"dark";root.dataset.theme=v;localStorage.setItem("constitution_theme",v)}
function header(d){return '<header><div><h1>Своя игра: Конституция России</h1><div class="sub">Основы российской государственности · '+(d.host?"режим ведущего":d.player?"команда "+esc(d.teams.find(t=>t.team_num===d.player.team)?.team_name):"экран подключения")+' · '+esc(phases[d.phase]||"Игра")+'</div></div><div class="tools"><span class="pill">'+esc(code)+'</span><button id="theme">Тема</button><button id="home">Главная</button></div></header>'}
function scores(d){const high=Math.max(...d.teams.map(t=>t.score));return '<div class="teams">'+d.teams.map(t=>'<div class="team '+(t.score===high&&high>0?"lead":"")+'"><div class="name">'+esc(t.team_name)+'</div><div class="score '+(t.score<0?"neg":"")+'">'+t.score+'</div><div class="members">'+t.members+' участн.</div>'+(d.host?'<div class="adj"><button data-adjust="-100" data-team="'+t.team_num+'">−100</button><button data-adjust="100" data-team="'+t.team_num+'">+100</button></div>':'')+'</div>').join("")+'</div>'}
function board(d){const entries=d.phase==="round1"?d.round1:d.round2,cats=[...new Set(entries.map(x=>x.cat))];let out='<div class="row"><div class="label">'+esc(phases[d.phase])+' · '+entries.filter(x=>x.used).length+' / 25</div>'+(d.host?'<button id="advance" class="pri">'+(d.phase==="round1"?"Во второй тур":"К суперигре")+'</button>':'<span class="hint">Ведущий выбирает следующий вопрос</span>')+'</div><div class="boardwrap"><div class="board">';
 for(let i=0;i<5;i++)out+='<div class="cat" style="background:var('+cols[i]+')">'+esc(cats[i])+'</div>';
 for(let row=0;row<5;row++)for(let col=0;col<5;col++){const q=entries.find(v=>v.cat===cats[col]&&v.value===(d.phase==="round1"?100:200)*(row+1));if(!q)continue;out+='<button class="cell '+(q.used?"used":"")+'" style="color:var('+cols[col]+');border-color:var('+cols[col]+')" '+(!d.host||q.used?"disabled":"")+' data-key="'+esc(q.id)+'">'+(q.used?"":q.value)+'</button>'}
 return out+'</div></div>'}
function lobby(d){if(d.host)return '<div class="home"><section class="box"><div class="label">Кабинет ведущего</div><h2>Комната '+esc(code)+'</h2><p>QR-код подключения всегда виден внизу экрана. Передайте студентам ссылку для входа, а ссылку ведущего оставьте у себя.</p><div class="tools"><button id="joinCopy">Ссылка студентов</button><button id="hostCopy">Секретная ссылка ведущего</button></div><p><button class="pri" id="start">Начать первый тур</button></p></section><section class="box"><h2>Команды</h2>'+d.teams.map(t=>'<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span><b>'+esc(t.team_name)+'</b> · '+t.members+' участников</span><button data-rename="'+t.team_num+'">Переименовать</button></div>').join("")+'</section></div>';
 if(d.player)return '<section class="box" style="text-align:center;padding:35px"><h2>Вы в игре!</h2><p>'+esc(d.player.name)+', вы в команде <b>'+esc(d.teams.find(t=>t.team_num===d.player.team)?.team_name)+'</b>.</p><p class="hint">Ожидайте начала первого тура. Ответы команды принимаются только один раз на каждый вопрос.</p></section>';

function joinForm(d){return '<div class="home"><section class="box"><div class="label">Вход без пароля</div><h2>Присоединиться к команде</h2><label for="name">Имя участника</label><input id="name" class="field" placeholder="Ваше имя или псевдоним" maxlength="40"><label for="team">Команда</label><select id="team" class="field">'+d.teams.map(t=>'<option value="'+t.team_num+'">'+esc(t.team_name)+' · '+t.members+' участников</option>').join("")+'</select><p><button id="join" class="pri">Войти в игру</button></p></section><section class="box"><h2>Правила</h2><p>Все видят вопрос и нажимают «Ответить» на скорость. Первая команда получает право отвечать вслух. Если ответ неверный, другие команды вновь могут нажать кнопку. Повторная попытка той же команды на этот вопрос не допускается.</p><p class="hint">В первом и втором турах отвечают вслух. В третьем туре команды отправляют письменные ответы со ставками.</p></section></div>'}
function superBoard(d){
 const q=d.superBoard[0];if(!q)return '<div class="box">Финальный вопрос недоступен.</div>';
 return '<div class="box"><div class="label">Третий тур</div><h2>Решающий вопрос</h2><p>Один сложный конституционный кейс для всех команд. Участники выбирают ставку и отправляют текстовые ответы независимо друг от друга. Ответы не передаются соперникам.</p>'+(d.host?'<button class="pri" data-key="'+esc(q.id)+'">Открыть финальный вопрос</button>':'<p class="hint">Ожидайте, пока ведущий откроет вопрос.</p>')+'</div>';
}
function finalPanel(d){
 const q=d.question,submitted=d.answers||[],n=submitted.length,graded=submitted.filter(a=>a.grade!==null).length;
 let out='<section class="panel" role="dialog" aria-label="Третий тур"><div class="pin"><div class="ptop"><span class="plabel" style="color:var(--c0)">ТУР III · РЕШАЮЩИЙ ВОПРОС</span><span class="pval" style="color:var(--acc)">★ ФИНАЛ</span></div><div class="ctx"><b>Конституционный кейс</b>Все команды отвечают письменно. Каждая выбирает ставку, затем отправляет свой ответ один раз.</div><h2 class="qq">'+esc(q.text)+'</h2>';
 if(d.host){
  out+='<div class="status"><b>Отправили ответ: '+n+' из 5 команд.</b> '+(d.finalLocked?'Приём завершён. Проверьте ответы и оцените каждый.':"Приём идёт. Ответы скрыты от общего экрана до его завершения.")+'</div>';
  out+=(d.revealed?'<div class="ans">'+esc(q.answer)+'</div><p class="hint">'+esc(q.explanation)+' · '+esc(q.article)+'</p>':'<details class="box"><summary style="cursor:pointer;font-weight:700">Эталон ответа для ведущего (не показывать командам до проверки)</summary><div class="final-answer">'+esc(q.answer)+'</div><p>'+esc(q.explanation)+' · '+esc(q.article)+'</p></details>');
  out+='<div class="final-grid">'+d.teams.map(t=>{
    const a=submitted.find(x=>x.team===t.team_num),g=a?.grade;
    return '<div class="final-card"><div class="nm">'+esc(t.team_name)+'</div><div class="sc">Счёт: '+t.score+'</div>'
      +(a?'<div class="status">Ответ отправлен'+(d.finalLocked?' · ставка: '+a.wager:'')+'</div>':'<div class="hint">Пока не отправили ответ</div>')
      +(a&&d.finalLocked?'<div class="final-answer">'+esc(a.text)+'</div>'
      +(g===null?'<div class="gradeactions"><button class="good" data-grade="1" data-team="'+t.team_num+'">✓ Верно · +'+a.wager+'</button><button class="bad" data-grade="-1" data-team="'+t.team_num+'">✕ Неверно · −'+a.wager+'</button><button data-grade="0" data-team="'+t.team_num+'">Частично · 0</button></div>':'<div class="status">Оценка: '+(g===1?'верно (+ставка)':g===-1?'неверно (−ставка)':'частично (0)')+'</div>'):'')+'</div>'
   }).join('')+'</div>';
  out+='<div class="pbot"><div class="row">'+(!d.finalLocked?'<button id="lockFinal" class="pri">Завершить приём ответов</button>':'<span class="hint">Получено: '+n+' · оценено: '+graded+'</span>')+'<div class="tools"><button id="reveal" class="pri" '+(!d.finalLocked||graded<n||d.revealed?'disabled':'')+'>Показать эталон всем</button><button id="finish" class="pri" '+(d.revealed?'':'disabled')+'>Подвести итоги</button></div></div><p class="hint">После завершения приёма новые ответы не принимаются. Верный ответ: +ставка, неверный: −ставка, частично правильный: 0. Неотправленный ответ — без изменений счёта.</p></div>';
 }else if(d.player){
  if(d.myFinal){
    out+='<div class="status"><b>Ответ вашей команды отправлен.</b> Ставка: '+d.myFinal.wager+' баллов.</div><div class="final-answer">'+esc(d.myFinal.text)+'</div>';
  }else if(d.finalLocked){
    out+='<div class="status">Приём письменных ответов завершён. Ответ вашей команды не поступил.</div>';
  }else{
    out+='<div class="box"><label for="wager">Ставка команды</label>'+wagerSelect(d)
       +'<label for="finalText">Развёрнутый ответ команды</label><textarea id="finalText" class="field" rows="6" maxlength="1500" placeholder="Укажите нарушенные принципы и объясните каждый пункт"></textarea>'
       +'<p><button id="submitFinal" class="pri">Отправить ставку и ответ</button></p><div class="hint">От команды принимается один вариант. После отправки изменить его нельзя.</div></div>';
  }
  if(d.revealed)out+='<div class="ans">Эталон: '+esc(q.answer)+'</div><p>'+esc(q.explanation)+'</p>';
 }else{
  out+='<div class="hint">Подключитесь к команде, чтобы отправить ставку и письменный ответ.</div>';
 }
 return out+'</div></section>';
}
function panel(d){
 if(d.question?.round===3)return finalPanel(d);
 const q=d.question,entries=q.round===3?d.superBoard:q.round===1?d.round1:d.round2,cats=[...new Set(entries.map(x=>x.cat))];
 const col=cols[Math.max(0,cats.indexOf(q.cat))]||cols[0];
 const activeTeam=d.teams.find(t=>t.team_num===d.buzzActiveTeam);
 const attempts=d.attemptedTeams||[];
 let out='<section class="panel" role="dialog" aria-label="Открытый вопрос"><div class="pin"><div class="ptop"><span class="plabel" style="color:var('+col+')">'+esc(q.cat)+' · '+esc(q.round===1?"I ТУР":q.round===2?"II ТУР":"СУПЕРИГРА")+'</span><div class="row"><span class="timer" aria-label="Приоритет по скорости нажатия">⚡ На скорость</span>'+(q.round===3?'':'<span class="pval" style="color:var('+col+')">'+q.value+'</span>')+'</div></div><div class="ctx"><b style="color:var('+col+')">Конституция Российской Федерации</b>Первое нажатие определяет команду, отвечающую вслух</div><h2 class="qq">'+esc(q.text)+'</h2>';
 if(d.host){
  if(activeTeam)out+='<div class="buzzer-winner" role="status"><div class="label">Первой нажала кнопка</div><div class="winner-name">'+esc(activeTeam.team_name)+'</div><p>Команда отвечает вслух. Выслушайте ответ и оцените его.</p></div>';
  else if(d.buzzOpen)out+='<div class="status buzz-ready">Кнопки ответа активны. Ожидаем первое нажатие команды.</div>';

  else out+='<div class="status">Правильный ответ раскрыт всем командам.</div>';
  out+=(d.revealed?'<div class="ans">Ответ: '+esc(q.answer)+'</div><p class="hint">'+esc(q.explanation)+' · '+esc(q.article)+'</p>':'<details class="box"><summary style="cursor:pointer;font-weight:700">Показать ответ только преподавателю</summary><div class="ans" style="margin-top:12px">Ответ: '+esc(q.answer)+'</div><p class="hint">'+esc(q.explanation)+' · '+esc(q.article)+'</p></details>');
  out+='<div class="award">'+d.teams.map(t=>{
   const a=(d.answers||[]).find(x=>x.team===t.team_num),isActive=t.team_num===d.buzzActiveTeam,grade=a?.grade;
   return '<div class="aw '+(isActive?'active-team':'')+'"><div class="nm">'+esc(t.team_name)+'</div><div class="sc">Счёт '+t.score+'</div>'
   +(a?(isActive?'<div class="response">Нажала первой — отвечает вслух</div>':'<div class="response">'+(grade===1?'Ответ правильный':grade===-1?'Ответ неверный':'Попытка завершена')+'</div>')
   +(q.round===3?'<div class="hint">Ставка: '+a.wager+'</div>':'')
   +(isActive&&grade===null?'<div class="gradeactions"><button class="good" data-grade="1" data-team="'+t.team_num+'">✓ Верно</button><button class="bad" data-grade="-1" data-team="'+t.team_num+'">✕ Неверно</button><button data-grade="0" data-team="'+t.team_num+'">0 баллов</button></div>':'<div class="graded" style="color:var('+(grade===1?'--good':grade===-1?'--bad':'--mute')+')">'+(grade===null?'Ожидание оценки':grade===1?'Баллы начислены':grade===-1?'Баллы списаны':'Без баллов')+'</div>')
   :'<div class="hint">Не нажимала</div>')+'</div>';
  }).join('')+'</div>';
  out+='<div class="pbot"><div class="row"><button id="reveal" class="pri" '+(d.revealed||!!activeTeam?'disabled':'')+'>'+(d.revealed?'Ответ раскрыт':'Показать правильный ответ всем')+'</button><div class="tools">'+(q.round===3?'<button class="pri" id="finish" '+(d.revealed?'':'disabled')+'>Завершить игру</button>':'<button id="close" '+(d.revealed?'':'disabled')+'>Закрыть вопрос и вернуться к табло</button>')+'</div></div><p class="hint">Неверно или 0 баллов → остальные команды снова могут нажать «Ответить». Каждая команда имеет одну попытку на вопрос. При правильном ответе кнопки блокируются.</p></div>';
 }else if(d.player){
   const myTeam=d.teams.find(t=>t.team_num===d.player.team);
   if(d.revealed){
     out+='<div class="ans">Правильный ответ: '+esc(q.answer)+'</div><p>'+esc(q.explanation)+' · '+esc(q.article)+'</p>';

     if(d.buzzActiveTeam===d.player.team)out+='<div class="buzzer-winner you-won" role="status"><div class="label">Ваша команда первая!</div><div class="winner-name">'+esc(myTeam?.team_name)+'</div><p>Отвечайте вслух. Ведущий проверит ответ.</p></div>';
     else out+='<div class="status buzz-locked" role="status">Первой нажала команда <strong>'+esc(activeTeam.team_name)+'</strong>. Ожидайте её устного ответа.</div>';
     out+='<button class="buzzer" disabled>ОТВЕТИТЬ</button>';
   }else if(d.myBuzz){
     out+='<div class="status" role="status">'+(d.myGrade===1?'Ваша команда ответила верно!':d.myGrade===-1?'Ответ неверный. У команды больше нет попыток на этот вопрос.':'Попытка вашей команды завершена.')+'</div><button class="buzzer" disabled>ОТВЕТИТЬ</button>';
   }else if(d.buzzOpen){

 }else{

 }
 return out+'</div></section>';

function wagerSelect(d){const score=d.teams.find(t=>t.team_num===d.player.team)?.score||0,max=Math.max(300,score),values=[];for(let n=0;n<=max;n+=100)values.push(n);if(wager>max)wager=max-max%100;return '<select id="wager" class="wager">'+values.map(n=>'<option value="'+n+'" '+(n===wager?'selected':'')+'>'+n+' баллов</option>').join("")+'</select>'}
function finale(d){const sorted=[...d.teams].sort((a,b)=>b.score-a.score||a.team_num-b.team_num);return '<div class="box" style="padding:30px 25px"><div class="label">Итоговый рейтинг</div><h2>Победитель: '+esc(sorted[0].team_name)+'</h2><div class="resultlist">'+sorted.map((t,i)=>'<div class="result"><span>'+(i+1)+'. '+esc(t.team_name)+'</span><b class="score">'+t.score+'</b></div>').join("")+'</div>'+(d.host?'<p class="tools"><button id="csv">Скачать результаты CSV</button><button id="reset" class="pri">Сыграть ещё раз</button></p>':'')+'</div>'}
function render(d){let out=header(d);const guest=!d.host&&!d.player;
 if(d.phase==="lobby")out+=lobby(d);
 else if(guest)out+=joinForm(d);
 else if(d.phase==="finished")out+=finale(d);
 else if(!d.question&&d.phase==="super")out+=superBoard(d);
 else if(!d.question)out+=board(d);
 if(!guest&&d.phase!=="lobby"&&d.phase!=="finished")out+=scores(d);
 if(d.host&&["round1","round2","super"].includes(d.phase)&&!d.question)out+='<p class="tools"><button id="reset">Сбросить игру</button><button id="joinCopy">Ссылка студентов</button><button id="hostCopy">Секретная ссылка ведущего</button></p>';
 if(d.question&&!guest)out+=panel(d);
 $("app").innerHTML=out+'<footer>Учебная игра НИУ «МЭИ» · <a href="https://www.minjust.gov.ru/ru/documents/8011/" rel="noopener" target="_blank">Конституция Российской Федерации</a></footer>';
 bind(d);updateClock()}
function bind(d){$("theme")?.addEventListener("click",toggleTheme);$("home")?.addEventListener("click",home);$("join")?.addEventListener("click",()=>act("join",{name:$("name").value.trim(),team:Number($("team").value)}));$("start")?.addEventListener("click",()=>act("start"));$("joinCopy")?.addEventListener("click",()=>copy(joinLink()));$("hostCopy")?.addEventListener("click",()=>copy(hostLink()));
 document.querySelectorAll("[data-key]").forEach(b=>b.addEventListener("click",()=>act("open",{key:b.dataset.key})));
 document.querySelectorAll("[data-rename]").forEach(b=>b.addEventListener("click",()=>{const team=Number(b.dataset.rename),old=d.teams.find(x=>x.team_num===team)?.team_name;const name=prompt("Название команды",old);if(name&&name.trim()!==old)act("rename",{team,name:name.trim()})}));
 document.querySelectorAll("[data-grade]").forEach(b=>b.addEventListener("click",()=>act("grade",{team:Number(b.dataset.team),grade:Number(b.dataset.grade)})));
 document.querySelectorAll("[data-adjust]").forEach(b=>b.addEventListener("click",()=>act("adjust",{team:Number(b.dataset.team),delta:Number(b.dataset.adjust)})));
 $("buzz")?.addEventListener("click",()=>act("buzz",{wager:d.question?.round===3?Number($("wager")?.value||0):0}));
 $("wager")?.addEventListener("change",e=>{wager=Number(e.target.value)});
 $("lockFinal")?.addEventListener("click",()=>act("lock_final"));
 $("submitFinal")?.addEventListener("click",()=>{const text=$("finalText")?.value?.trim()||"";if(text.length<8)return show("Ответ слишком короткий",true);act("submit_final",{text,wager:Number($("wager")?.value||0)})});
 $("reveal")?.addEventListener("click",()=>act("reveal"));
 $("close")?.addEventListener("click",()=>act("close"));

 $("advance")?.addEventListener("click",()=>act("advance"));
 $("reset")?.addEventListener("click",()=>{if(confirm("Сбросить ответы, баллы и сыгранные вопросы? Подключения участников сохранятся."))act("reset",{dropPlayers:false})});
 $("csv")?.addEventListener("click",()=>{const rows=[["Команда","Баллы","Участников"],...[...d.teams].sort((a,b)=>b.score-a.score).map(t=>[t.team_name,t.score,t.members])];const csv="\ufeff"+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n");const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="konstituciya-"+code+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)})}
$("copyJoin").onclick=()=>copy(joinLink());
const params=new URLSearchParams(location.search);
if(localStorage.getItem("constitution_theme")==="dark")document.documentElement.dataset.theme="dark";
const c=(params.get("room")||"").toUpperCase(),secret=params.get("host")||"";
if(/^[A-Z2-9]{6}$/.test(c)){code=c;const studentEntry=params.has("join");hostSecret=studentEntry?"":secret||localStorage.getItem("constitution_host_"+code)||"";playerToken=hostSecret?"":localStorage.getItem("constitution_player_"+code)||"";role=hostSecret?"host":playerToken?"player":"guest";if(secret&&!studentEntry)localStorage.setItem("constitution_host_"+code,secret);history.replaceState(null,"",location.pathname+"?room="+code+(studentEntry?"&join=1":""));dock();refresh(true)}else renderHome();
setInterval(()=>refresh(false),2800);setInterval(updateClock,350);
})();</script></body></html>
