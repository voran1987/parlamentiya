<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Экологический саммит — учебный симулятор</title>
<style>
:root{--navy:#133047;--teal:#147a7b;--gold:#d69c52;--bg:#f4f7f8;--ink:#1a303a;--muted:#657783;--line:#d8e3e7;--red:#b94c45;--green:#21836a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial;color:var(--ink)}button,input,select,textarea{font:inherit}
header{background:#fff;border-bottom:4px solid var(--teal);padding:13px max(18px,calc((100vw - 1180px)/2));position:sticky;top:0;z-index:4;box-shadow:0 4px 18px #12323a12}
.brand{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand strong{color:var(--navy);font-size:19px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--teal);font-weight:800}
.wrap{max-width:1180px;margin:22px auto 110px;padding:0 17px}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:17px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:17px;box-shadow:0 5px 22px #0c263709}
h1,h2,h3{line-height:1.2;margin:0 0 13px;color:var(--navy)}h1{font-size:30px}h2{font-size:20px}h3{font-size:16px}.sub{color:var(--muted);font-size:14px;margin-top:-6px;margin-bottom:15px}
.btn{border:0;border-radius:10px;background:var(--teal);color:white;padding:10px 15px;font-weight:700;cursor:pointer;transition:filter .1s}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e7f1f1;color:#145f65}.btn.danger{background:#a94d4a}.btn.gold{background:#ab743a}.btn.ghost{background:white;color:var(--navy);border:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:9px}.pill{display:inline-block;padding:5px 10px;border-radius:100px;background:#eaf4f2;color:#176e61;font-weight:700;font-size:12px}.pill.bad{background:#fbe9e7;color:#ab3e37}
input,textarea,select{border:1px solid #bdd0d5;border-radius:10px;padding:10px;background:white;width:100%;color:var(--ink)}textarea{min-height:110px;resize:vertical}
.metric-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric{background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:12px}.metric .n{font-size:23px;font-weight:900}.metric .lbl{font-size:12px;color:var(--muted);min-height:34px}.bar{height:9px;background:#dce8ed;border-radius:6px;overflow:hidden;margin-top:7px}.fill{height:100%;border-radius:6px;background:#2f8b91}.fill.red{background:#bb554e}.tip{font-size:11px;color:var(--muted);margin-top:5px}
.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.team{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fcfdfd}.team.selected{border:2px solid var(--teal);background:#eef9f5}.team .flag{font-size:24px}.team .nm{font-weight:800;color:var(--navy)}.team .summary{font-size:12px;color:var(--muted)}.team button{margin-top:8px;width:100%}
.opt{padding:13px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:#fcfdfd}.opt b{color:var(--navy)}.opt p{margin:5px 0 8px;color:var(--muted);font-size:14px}.deltas{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}.delta{background:#e9f1f3;padding:3px 7px;border-radius:6px;font-size:12px}.delta.negative{background:#fceae9;color:#9d403a}.delta.positive{background:#e8f5eb;color:#277b4c}
.feed{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#f8fbfc;padding:10px}.entry{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}.entry:last-child{border:0}.entry small{display:block;color:var(--muted)}.muted{color:var(--muted);font-size:14px}
.callout{padding:14px;background:#edf6f3;border-left:4px solid var(--teal);border-radius:8px;margin:11px 0}.warning{background:#fff4e7;border-left-color:#d89d42}.critical{background:#fbe9e7;border-left-color:#bd4943}.score{font-size:28px;font-weight:900;color:var(--teal)}
#timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:22px;color:var(--navy)}
.qr{position:fixed;right:18px;bottom:14px;background:white;border:1px solid #c8dadc;box-shadow:0 6px 30px #08272b28;border-radius:14px;padding:11px;z-index:5;text-align:center;width:170px}.qr img{width:125px;height:125px;display:block;margin:4px auto}.qr small{display:block;font-size:11px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:17px 0}
@media(max-width:860px){.cols{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}.team-grid{grid-template-columns:repeat(2,1fr)}.qr{width:120px;padding:5px;right:8px;bottom:8px}.qr img{width:88px;height:88px}.qr small{font-size:9px}.brand strong{font-size:16px}.wrap{padding:0 11px;margin-top:13px}.panel{padding:14px}.actions{gap:7px}}
@media(max-width:420px){.team-grid{grid-template-columns:1fr 1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}}
.host-guide summary{cursor:pointer;color:var(--navy);font-size:19px;font-weight:800;list-style-position:inside}
.host-guide .guide-line{border-left:3px solid #c8dfe0;margin:10px 0;padding:9px 12px;background:rgba(249,252,252,.97);border-radius:0 9px 9px 0}
.host-guide .guide-line.current{border-left-color:#c17d37;background:#fff7e9}
.host-guide .guide-line p{margin:3px 0;color:var(--muted);font-size:13px}
.host-guide .guide-line b{color:var(--navy)}
.host-guide .guide-line .meta{font-size:12px;color:#286f73;font-weight:800}
body.with-game-bg{background-attachment:fixed;background-size:cover;background-position:center center;background-repeat:no-repeat}
body.with-game-bg .panel,body.with-game-bg .team,body.with-game-bg .metric,body.with-game-bg header,body.with-game-bg .qr{background-color:rgba(255,255,255,.90)}
body.with-game-bg .host-guide .guide-line{background-color:rgba(249,252,252,.97)}
@media(max-width:860px){body.with-game-bg{background-attachment:scroll;background-size:cover} }

.photo-hero{display:none}
body.with-game-bg .photo-hero{display:flex;min-height:230px;align-items:flex-end;background-image:linear-gradient(180deg,rgba(9,30,42,.08),rgba(9,30,42,.82)),var(--game-photo);background-size:cover;background-position:center 45%;border-bottom:5px solid #147a7b}
.photo-hero .hero-inside{max-width:1180px;margin:0 auto;padding:32px 25px;width:100%;color:white;text-shadow:0 2px 10px #10232c}
.photo-hero .hero-inside h1{font-size:32px;color:white;margin-bottom:4px}
.photo-hero .hero-inside p{margin:0;color:#eaf5f6}
@media(max-width:680px){body.with-game-bg .photo-hero{min-height:145px}.photo-hero .hero-inside{padding:18px}.photo-hero .hero-inside h1{font-size:23px}}
</style></head><body>
<header><div class="brand"><div><div class="kicker">ГУУ · Международные отношения</div><strong>ЭКОЛОГИЧЕСКИЙ САММИТ · МИР НА ГРАНИ</strong></div><div id="headinfo" class="pill">Учебный веб-симулятор</div></div></header>
<div id="photoHero" class="photo-hero"><div class="hero-inside"><h1>Экологический саммит: мир на грани</h1><p>Международный климатический кризис · 2035 год</p></div></div>
<main class="wrap" id="app"><div class="panel"><h2>Загрузка симулятора…</h2></div></main><div id="qrslot"></div>
<script>
(function(){
'use strict';
var PAGE=location.origin+location.pathname.replace(/\/$/,'');var BASE='https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/ecology-summit';var qp=new URLSearchParams(location.search);
var room=(qp.get('room')||'').trim().toUpperCase();var hash=(location.hash.match(/host=([^&]+)/)||[])[1]||'';
var token=hash?decodeURIComponent(hash):sessionStorage.getItem('eco_token_'+room)||localStorage.getItem('eco_token_'+room)||'';
var state=null, refreshBusy=false, apiBusy=false, lastError='', tick=0;
var N=['Выбросы','Экориски','Энергобезопасность','Доверие','Фонд адаптации'];
var STAGES=['Подключение делегаций','Открытие саммита: национальные позиции','Международные переговоры','Экологический кризис и переговоры','Реакция на кризис','Итоговый саммит','Итоги игры'];
var s=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var clip=async t=>{try{await navigator.clipboard.writeText(t);toast('Ссылка скопирована')}catch(e){prompt('Скопируйте ссылку',t)}};
var toast=m=>{var o=document.getElementById('toast');if(!o){o=document.createElement('div');o.id='toast';o.style='position:fixed;left:14px;bottom:14px;z-index:10;background:#183b49;color:white;padding:13px;border-radius:10px;max-width:75vw';document.body.appendChild(o)}o.textContent=m;setTimeout(()=>{o.remove()},3300)};
async function api(action,data){var r=await fetch(BASE+'/api/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({room:room,token:token},data||{}))});var j=await r.json().catch(()=>({error:'Неверный ответ сервера'}));if(!r.ok||j.error)throw Error(j.error||'Ошибка соединения');return j}
async function reload(force){if(refreshBusy)return;refreshBusy=true;try{state=await api('state');if(state.role?.type==='visitor'&&token&&!hash){localStorage.removeItem('eco_token_'+room);sessionStorage.removeItem('eco_token_'+room);token='';}applyBackground();if(force||!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))render();}catch(e){if(!state)document.getElementById('app').innerHTML='<div class="panel"><h2>Не удалось загрузить игру</h2><p>'+s(e.message)+'</p><button class="btn" data-act="reload">Повторить</button></div>';lastError=e.message}finally{refreshBusy=false}}
function bar(m,i){var v=Number(m||0),bad=(i===0?v>=105:i===1?v>=75:i===2?v<=36:i===3?v<=30:v<=18),lim=[105,75,36,30,18][i];return '<div class="metric"><div class="lbl">'+N[i]+'</div><div class="n">'+v+' '+(bad?'⚠':'')+'</div><div class="bar"><div class="fill '+(bad?'red':'')+'" style="width:'+Math.min(100,v/120*100)+'%"></div></div><div class="tip">'+(i<=1?'Красная зона от ':'Красная зона до ')+lim+'</div></div>'}
function delta(e){return '<div class="deltas">'+e.map((x,i)=>x?'<span class="delta '+((i<=1?x>0:x<0)?'negative':'positive')+'">'+N[i]+' '+(x>0?'+':'')+x+'</span>':'').join('')+'</div>'}
function userTeam(){return state?.role?.team}
function teamSelect(){return (state?.teams||[]).map((t,i)=>'<option value="'+i+'">'+s(t.name)+'</option>').join('')}
function timeFormat(){if(!state||!state.room||state.room.stage===0||state.room.stage===6)return '';if(state.room.paused)return '⏸ Пауза';var ms=Math.max(0,Date.parse(state.room.deadline||0)-Date.now());return String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor((ms%60000)/1000)).padStart(2,'0')}
function metrics(){return '<section class="panel"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">Состояние мировой системы</h2><span class="pill '+(state.critical.length?'bad':'')+'">'+(state.critical.length?'Критические зоны: '+state.critical.length:'Система под контролем')+'</span></div><p class="sub">Показатели условные; решения команд изменяют их в реальном времени</p><div class="metric-grid">'+state.metrics.map(bar).join('')+'</div>'+(state.critical.length?'<div class="callout critical">⚠ '+state.critical.map(s).join('; ')+'</div>':'')+'</section>'}
function teams(){return '<section class="panel"><h2>Делегации и их положение</h2><div class="team-grid">'+state.teams.map((t,i)=>{var count=state.counts[i]||0, answer=(state.decisions||[]).find(x=>x.team===i&&x.turn===(state.room.stage>=4?2:1));var show=state.role.type==='host'||i===userTeam()||state.room.stage>=2&&answer?.turn===1;return '<div class="team '+(userTeam()===i?'selected':'')+'"><div class="flag">'+t.icon+'</div><div class="nm">'+s(t.name)+'</div><div class="summary">'+count+' участн. · '+(answer?'решение принято':'решения нет')+'</div>'+(answer&&show?'<div class="muted">'+s(state.choices[i][answer.turn-1][answer.option_id].name)+'</div>':'')+'</div>'}).join('')+'</div></section>'}
function lobby(){return '<div class="panel"><h1>Подключение к саммиту</h1><p>Выберите делегацию, впишите имя и присоединяйтесь. Код доступа не нужен; решение от делегации будет одно.</p><div class="team-grid">'+state.teams.map((t,i)=>'<div class="team"><div class="flag">'+t.icon+'</div><div class="nm">'+s(t.name)+'</div><p class="summary">'+s(t.goal)+'</p><button class="btn secondary" data-act="pick" data-team="'+i+'">Выбрать</button></div>').join('')+'</div><hr><div class="actions"><input id="nickname" maxlength="40" placeholder="Ваше имя" style="max-width:260px"><select id="jointeam" style="max-width:240px">'+teamSelect()+'</select><button class="btn" data-act="join">Подключиться</button></div></div>'}
function own(){var t=state.teams[userTeam()];return '<div class="panel"><span class="pill">Ваша делегация</span><h2>'+t.icon+' '+s(t.name)+'</h2><p>'+s(t.goal)+'</p><div class="callout">Решение делегации коллективное: отправить или изменить его может любой участник до окончания этапа. После подачи оно сразу видно вашей команде и ведущему.</div></div>'}
function agenda(){return '<section class="panel"><span class="pill">Повестка заседания · 2035</span><h2 style="margin-top:10px">Глобальная экологическая политика до 2040 года</h2><p class="muted">Цель: представить национальные позиции, определить линии разногласий и подготовить основу для переговоров следующего раунда.</p><div class="team-grid" style="margin-bottom:12px"><div class="team"><b>1. Ответственность</b><div class="summary">Кто должен сокращать выбросы быстрее?</div></div><div class="team"><b>2. Экономика</b><div class="summary">Как обеспечить развитие и энергетическую безопасность?</div></div><div class="team"><b>3. Финансирование</b><div class="summary">Кто оплачивает переход и адаптацию?</div></div><div class="team"><b>4. Обязательства</b><div class="summary">Какие условия приемлемы, а какие нет?</div></div></div><h3>Порядок работы · 15 минут</h3><div class="callout">4 мин — подготовка национальной позиции. 3 мин — одно коллективное решение через смартфон. 6 мин — выступления шести делегаций, до 1 минуты каждой. 2 мин — выводы ведущего.</div><p class="muted"><b>В первом раунде:</b> не договариваться с другими командами и не заключать союзы. Нужно выбрать стратегию и подготовить официальное заявление. <b>Переговоры начнутся во втором раунде.</b></p></section>'}
function statementForm(){var mine=(state.statements||[]).find(x=>x.team===userTeam());var decided=state.decisions.some(d=>d.team===userTeam()&&d.turn===1);return '<section class="panel"><h2>Официальное заявление делегации</h2><p class="muted">Подготовьте выступление до 1 минуты: <b>главное требование</b>, <b>принципиальная позиция</b> и <b>условие возможного компромисса</b>. Любой участник команды может отправить общий текст.</p>'+(decided?'<textarea id="statement" maxlength="900" rows="5" placeholder="Наша делегация считает... Наше главное требование... Мы не согласимся на... Ради общего соглашения готовы...">'+s(mine?.statement||'')+'</textarea><div class="actions" style="margin-top:10px"><button class="btn" data-act="statement" '+(state.expired||state.room.paused?'disabled':'')+'>'+(mine?'Обновить заявление':'Отправить заявление')+'</button><span class="pill">'+(mine?'✓ Заявление сохранено':'Ожидается заявление')+'</span></div>':'<div class="callout warning">Сначала выберите национальную стратегию выше, затем сформулируйте официальное заявление.</div>')+'</section>'}
function statementsPanel(){var st=state.statements||[];return '<section class="panel"><h2>Вступительные позиции делегаций</h2><p class="sub">Подготовлено заявлений: '+st.length+' из 6. Ведущий видит все тексты; другим командам они открываются после первого раунда.</p>'+state.teams.map((t,i)=>{var x=st.find(y=>y.team===i);return '<div class="entry"><b>'+t.icon+' '+s(t.name)+'</b><div>'+(x?s(x.statement):'<span class="muted">Заявление ещё не представлено</span>')+'</div></div>'}).join('')+'</section>'}
function decision(){var turn=state.room.stage===4?2:1;var ownAnswer=(state.decisions||[]).find(x=>x.team===userTeam()&&x.turn===turn);var choices=state.choices[userTeam()][turn-1];return '<div class="panel"><h2>'+(turn===1?'Национальное решение':'Ответ на кризис')+'</h2><p class="sub">Выберите один вариант. Команда увидит последствия до отправки.</p>'+choices.map((o,i)=>'<div class="opt"><b>'+s(o.name)+'</b><p>'+s(o.desc)+'</p>'+delta(o.effect)+'<button class="btn '+(ownAnswer?.option_id===i?'secondary':'')+'" data-act="decision" data-option="'+i+'" '+(state.expired||state.room.paused?'disabled':'')+'>'+(ownAnswer?.option_id===i?'✓ Выбрано командой':'Принять решение')+'</button></div>').join('')+'</div>'}
function alliances(){var me=userTeam();var a=state.alliances||[];return '<div class="panel"><h2>Союзы и специальные возможности</h2><p class="sub">Подтвердить договор может любой участник делегации. После подтверждения обе команды и общий уровень доверия получают эффект.</p><div class="team-grid">'+state.teams.map((t,i)=>{if(i===me)return '';var pair=a.find(x=>x.low_team===Math.min(i,me)&&x.high_team===Math.max(i,me));var status=pair?.status;var canConfirm=status==='pending'&&pair.proposed_by_team!==me;return '<div class="team"><div class="nm">'+t.icon+' '+s(t.short)+'</div><div class="summary">'+(status==='accepted'?'✓ Союз подтверждён':status==='pending'?'Предложение ожидает согласования':'Союза нет')+'</div><button class="btn secondary" data-act="'+(canConfirm?'accept':'ally')+'" data-team="'+i+'" '+(status==='accepted'||(status==='pending'&&!canConfirm)||state.room.paused||state.expired?'disabled':'')+'>'+(canConfirm?'Подтвердить союз':'Предложить союз')+'</button></div>'}).join('')+'</div><hr><h3>'+s(state.teams[me].ability.name)+'</h3><p class="muted">'+s(state.teams[me].ability.desc)+'</p>'+delta(state.teams[me].ability.effect)+'<button class="btn gold" data-act="ability" '+(state.abilities.includes(me)||state.room.paused||state.expired?'disabled':'')+'>'+(state.abilities.includes(me)?'Возможность использована':'Применить спецвозможность')+'</button></div>'}
function chats(){var me=userTeam();return '<div class="panel"><h2>Единый переговорный канал</h2><div class="feed">'+(state.messages||[]).map(m=>'<div class="entry"><b>'+s(state.teams[m.sender_team]?.short||'?')+' · '+s(m.nickname)+'</b> '+(m.target_team>=0?'<span class="pill">→ '+s(state.teams[m.target_team]?.short||'?')+'</span>':'<span class="pill">Общий канал</span>')+'<div>'+s(m.message)+'</div><small>'+new Date(m.created_at).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</small></div>').join('')+'</div>'+(state.role.type==='student'&&!state.expired&&!state.room.paused?'<div class="actions" style="margin-top:10px"><select id="target" style="max-width:190px"><option value="-1">Всем делегациям</option>'+state.teams.map((t,i)=>i===me?'':'<option value="'+i+'">'+s(t.short)+'</option>').join('')+'</select><input id="message" maxlength="650" placeholder="Ваше предложение…"><button class="btn" data-act="chat">Отправить</button></div>':'')+'</div>'}
function vote(){var v=(state.votes||[]).find(x=>x.team===userTeam());return '<div class="panel"><h2>Голосование по декларации</h2><div class="callout" style="white-space:pre-line">'+s(state.room.declaration)+'</div><p class="sub">Каждая делегация подаёт один голос. Решение можно изменить до окончания голосования.</p><div class="actions">'+[['yes','За'],['no','Против'],['abstain','Воздержаться']].map(([x,n])=>'<button class="btn '+(v?.vote===x?'secondary':'')+'" data-act="vote" data-vote="'+x+'" '+(state.expired||state.room.paused?'disabled':'')+'>'+(v?.vote===x?'✓ ':'')+n+'</button>').join('')+'</div></div>'}
function results(){return '<section class="panel"><h2>Итоги саммита</h2><div class="callout '+(state.globalSuccess?'':'critical')+'"><b>'+(state.globalSuccess?'Международная система сохранила устойчивость':'Общее соглашение не сняло основных рисков')+'</b><p>Голосов за декларацию: '+state.votes.filter(v=>v.vote==='yes').length+' из 6. Решения изменили состояние всей системы.</p></div><div class="team-grid">'+state.scores.map((v,i)=>'<div class="team"><div class="nm">'+state.teams[i].icon+' '+s(state.teams[i].short)+'</div><div class="score">'+v+'</div><div class="summary">Национальные баллы</div></div>').join('')+'</div><p class="muted">Итоговые баллы включают решения, союзы, специальные возможности и голосование. Успех команды не гарантирует успех мировой системы.</p></section>'}

function hostGuide(){
 var blocks=[
 {n:0,title:'Подключение участников',time:'5 минут',who:'Ведущий: показать QR, проверить численность команд и объяснить правила. Делегации: выбрать роль, войти без пароля.',out:'Результат: шесть делегаций подключены. Дальше — открытие саммита.'},
 {n:1,title:'Раунд 1. Национальные позиции',time:'15 минут',who:'4 мин — подготовка; 3 мин — один выбор стратегии на команду; 6 мин — шесть устных выступлений (по 1 мин); 2 мин — фиксация противоречий. Ведущий модерирует выступления и видит официальные заявления.',out:'Результат: выбранная стратегия и вступительное заявление каждой делегации. Союзы и чат пока закрыты.'},
 {n:2,title:'Раунд 2. Международные переговоры',time:'20 минут',who:'2 мин — объявление задач; 12 мин — открытые переговоры, обмен предложениями; 4 мин — подтверждение союзов любой стороной; 2 мин — фиксация договорённостей. Ведущий следит за сообщениями и действиями.',out:'Результат: подтверждённые союзы, использованные спецвозможности и изменение глобальных показателей.'},
 {n:3,title:'Раунд 3. Международный экологический кризис',time:'15 минут',who:'3 мин — оглашение кризиса; 8 мин — экстренные переговоры и поиск партнёров; 4 мин — выступления о мерах. Переговоры включаются автоматически, союзы продолжают действовать.',out:'Результат: предложения о совместных мерах, реакция на красные зоны и критические показатели.'},
 {n:4,title:'Раунд 4. Национальный ответ на кризис',time:'15 минут',who:'5 мин — обсуждение внутри делегаций; 5 мин — принятие нового коллективного решения; 5 мин — разбор итоговых эффектов. Ведущий сравнивает состояние системы до и после ответов.',out:'Результат: второй набор национальных решений и обновлённые глобальные показатели.'},
 {n:5,title:'Раунд 5. Заключительный саммит',time:'15 минут',who:'4 мин — подготовка текста декларации ведущим; 6 мин — согласование формулировок; 3 мин — голосование делегаций; 2 мин — объявление результата. Ведущий может корректировать шесть пунктов документа.',out:'Результат: голосование «за / против / воздержался». Для принятия нужно не менее четырёх голосов «за».'},
 {n:6,title:'Подведение итогов',time:'5 минут',who:'Обсудить, кому удалось защитить национальные интересы, почему показатели системы улучшились или ухудшились и какие обязательства оказались неэффективными.',out:'Результат: сопоставление национальной победы и устойчивости мировой системы.'}
 ];
return '<section class="panel host-guide"><details open><summary>Повестка саммита и сценарий ведущего · 90 минут</summary>'+
 '<p class="muted" style="margin-top:12px">Главный вопрос: как распределить ответственность за сокращение выбросов, обеспечить развитие, финансирование адаптации и контроль обязательств?</p>'+
 '<div class="callout"><b>Общая повестка (2035–2040):</b> ① ответственность за выбросы; ② экономика и энергетическая безопасность; ③ финансирование и технологии; ④ национальные обязательства, контроль и климатическая справедливость.</div>'+
 blocks.map(function(b){return '<div class="guide-line '+(state.room.stage===b.n?'current':'')+'"><b>'+(state.room.stage===b.n?'▶ ':'')+b.title+'</b> <span class="meta"> · '+b.time+'</span><p>'+b.who+'</p><p><b>Итог:</b> '+b.out+'</p></div>'}).join('')+
 '<div class="callout warning"><b>Важное для ведущего:</b> QR-подключение остаётся на экране. Если все команды ответили раньше, можно переходить далее вручную. Для паузы и продления этапа используйте кнопки управления. Национальные заявления видны ведущему сразу, участникам других делегаций — со второго раунда.</div>'+
 '</details></section>'
}
function backgroundTools(){
return '<section class="panel"><h2>Оформление игры · фоновое изображение</h2><p class="sub">Выберите изображение с компьютера. Оно появится на фоне всех экранов этой сессии, текст останется на светлых подложках.</p><div class="actions"><label style="flex:1;min-width:220px"><span class="muted">Загрузить фото или картинку</span><input type="file" id="bgpicker" accept="image/png,image/jpeg,image/webp"></label><button class="btn ghost" data-act="removeBg" '+(state.room.backgroundUrl?'':'disabled')+'>Убрать фон</button></div><p class="muted" style="margin-bottom:0">'+(state.room.backgroundUrl?'Фон подключён к текущей сессии и виден всем участникам.':'Фон пока не загружен. Выберите прикреплённую картинку здесь.')+'</p></section>'
}
async function uploadBackground(file){
 if(!file)return;
 if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('Выберите PNG, JPEG или WebP');
 if(file.size>12000000)throw Error('Изображение больше 12 МБ');
 let bitmap=await createImageBitmap(file);
 let scale=Math.min(1,1920/bitmap.width,1300/bitmap.height);
 let c=document.createElement('canvas');c.width=Math.max(1,Math.floor(bitmap.width*scale));c.height=Math.max(1,Math.floor(bitmap.height*scale));
 let ctx=c.getContext('2d');if(!ctx)throw Error('Не удалось обработать изображение');
 ctx.drawImage(bitmap,0,0,c.width,c.height);
 if(bitmap.close)bitmap.close();
 let url=c.toDataURL('image/webp',0.78);
 let base64=url.split(',')[1];
 if(!base64||base64.length>4700000)throw Error('Не удалось сжать фон, выберите изображение меньше');
 await api('background',{base64:base64,mime:'image/webp'});
}
function applyBackground(){
 let url=state?.room?.backgroundUrl;
 if(url){
 document.body.classList.add('with-game-bg');
 document.documentElement.style.setProperty('--game-photo','url("'+url.replace(/"/g,'')+'")');document.body.style.backgroundImage='linear-gradient(rgba(10,31,40,.32),rgba(10,31,40,.48)),url("'+url.replace(/"/g,'')+'")';
 }else{document.body.classList.remove('with-game-bg');document.body.style.backgroundImage='';document.documentElement.style.removeProperty('--game-photo');}
}
function hostRoster(){
 var people=state.members||[];
 return '<section class="panel" id="participants"><div class="actions" style="justify-content:space-between"><h2 style="margin:0">Участники · '+people.length+'</h2><button class="btn danger" data-act="clearMembers" '+(people.length?'':'disabled')+'>Очистить всех участников</button></div>'+
 '<p class="sub" style="margin-top:10px">Удаление отключает выбранного студента и аннулирует его вход. Решения, баллы и фон при этом сохраняются. Чтобы начать новую игру с нуля, отдельно используйте «Сбросить сессию».</p>'+
 state.teams.map(function(t,i){
 var members=people.filter(m=>m.team===i);
 return '<div class="entry"><b>'+t.icon+' '+s(t.name)+'</b> <span class="pill">'+members.length+' чел.</span>'+
 (members.length?members.map(function(m){
 return '<div class="actions" style="margin:6px 0 2px 13px;justify-content:space-between;gap:10px"><span>'+s(m.nickname)+'</span><button class="btn ghost" style="padding:5px 10px;font-size:12px" data-act="kickMember" data-member="'+s(m.id)+'" data-nick="'+s(m.nickname)+'">Удалить</button></div>'
 }).join(''):'<div class="muted">Пока никого нет</div>')+'</div>'
 }).join('')+'</section>';
}
function hostTools(){return '<section class="panel"><h2>Кабинет ведущего</h2><div class="actions"><span class="pill">Раунд '+state.room.stage+' / 6</span><span id="timer">'+timeFormat()+'</span><button class="btn" data-act="next" '+(state.room.stage===6?'disabled':'')+'>'+(state.room.stage===0?'Начать игру':'Следующий этап')+'</button><button class="btn secondary" data-act="pause" '+(state.room.stage===0||state.room.stage===6?'disabled':'')+'>'+(state.room.paused?'Продолжить':'Пауза')+'</button><button class="btn ghost" data-act="copyJoin">Ссылка студентов</button><button class="btn ghost" data-act="copyHost">Ссылка ведущего</button><button class="btn danger" data-act="reset">Сбросить сессию</button></div><hr><div class="actions"><label>Длительность текущего этапа: <input id="mins" type="number" min="1" max="90" value="'+Math.max(1,Math.ceil(state.remainingSeconds/60))+'" style="width:95px;display:inline-block"> мин.</label><button class="btn secondary" data-act="settime">Обновить таймер</button></div>'+(state.room.stage===5?'<hr><h3>Текст итоговой декларации</h3><textarea id="declaration">'+s(state.room.declaration)+'</textarea><button class="btn secondary" data-act="declaration">Сохранить декларацию</button>':'')+'</section>'}
function hostActivity(){return '<section class="panel"><h2>Действия команд в реальном времени</h2><div class="feed">'+(state.activity||[]).map(x=>'<div class="entry"><b>'+s(x.actor)+'</b> — '+s(x.action)+'<small>'+new Date(x.created_at).toLocaleTimeString('ru-RU')+'</small></div>').join('')+'</div></section>'}
function hostDecisions(){return '<section class="panel"><h2>Принятые решения и голоса</h2><div>'+state.decisions.map(x=>'<div class="entry"><b>'+s(state.teams[x.team].short)+' · раунд '+x.turn+'</b>: '+s(state.choices[x.team][x.turn-1][x.option_id].name)+'</div>').join('')+'</div><hr><h3>Союзы</h3>'+(state.alliances.length?state.alliances.map(a=>'<div class="entry">'+s(state.teams[a.low_team].short)+' — '+s(state.teams[a.high_team].short)+': '+(a.status==='accepted'?'подтверждён':a.status==='pending'?'ожидает подтверждения':'отклонён')+'</div>').join(''):'<p class="muted">Пока нет</p>')+'<hr><h3>Голоса</h3>'+state.votes.map(v=>'<div class="entry">'+s(state.teams[v.team].short)+': '+({yes:'за',no:'против',abstain:'воздержались'}[v.vote])+'</div>').join('')+'</section>'}
function stageInfo(){var st=state.room.stage;var explanations=['Команды подключаются по QR-коду и знакомятся с ролью.','Открытие саммита: команды выбирают стратегию, пишут короткое заявление и выступают по одной минуте. Союзы и переговоры откроются во втором раунде.','Переговоры, союзы и специальные возможности открыты.','Вспыхнул кризис. Переговоры открылись автоматически. Союзы и спецвозможности доступны.','Делегации пересматривают решения с учётом кризиса.','Голосование по шести пунктам общей декларации.','Сравнение национальных и общесистемных результатов.'];return '<div class="panel"><div class="actions"><span class="pill">Этап '+st+'</span><strong id="timer">'+timeFormat()+'</strong></div><h1>'+STAGES[st]+'</h1><p>'+explanations[st]+'</p>'+(state.room.crisis_kind&&st>=3?'<div class="callout warning"><b>'+s(state.crisis.name)+'</b><p>'+s(state.crisis.desc)+'</p>'+delta(state.crisis.effect)+'</div>':'')+'</div>'}
function render(){if(!state)return;var role=state.role.type,st=state.room.stage;
document.getElementById('headinfo').textContent='Комната '+state.room.code+' · '+(role==='host'?'Ведущий':role==='student'?state.teams[userTeam()].short:'Подключение');
applyBackground();
var content='';
if(role==='visitor'){content=lobby()+metrics();}else{
content=stageInfo()+(st===1?agenda():'')+metrics();
if(role==='host'){content=hostTools()+hostRoster()+hostGuide()+backgroundTools()+content+'<div class="cols"><div>'+teams()+hostDecisions()+(st>=1?statementsPanel():'')+'</div><div>'+hostActivity()+((st===2||st===3)?chats():'')+'</div>'+(st===6?results():'');}
else{content+='<div class="cols"><div>'+own()+(st===1||st===4?decision():'')+(st===1?statementForm():'')+(st===2||st===3?alliances()+chats():'')+(st===5?vote():'')+(st===6?results():'')+'</div><div>'+teams()+(st>=2?statementsPanel():'')+'</div></div>';}
}
document.getElementById('app').innerHTML=content;
if(role==='host'){var url=state.joinUrl;document.getElementById('qrslot').innerHTML='<div class="qr"><b>Подключение</b><img src="'+BASE+'/qr?room='+encodeURIComponent(room)+'" alt="QR-код для студентов"><small>Сканируйте камерой<br>'+s(room)+'</small></div>';}else document.getElementById('qrslot').innerHTML='';
}
async function initial(){if(!room){document.getElementById('app').innerHTML='<div class="panel"><span class="pill">Учебная дипломатическая игра</span><h1>Экологический саммит: мир на грани</h1><p>Шесть делегаций защищают национальные интересы. Их решения изменяют глобальные показатели, кризисы и возможность международного компромисса.</p><div class="actions"><button class="btn" data-act="create">Создать игру для преподавателя</button></div><hr><h3>Присоединиться к существующей игре</h3><div class="actions"><input id="roomcode" maxlength="8" placeholder="Код комнаты" style="max-width:200px"><button class="btn secondary" data-act="openroom">Подключиться</button></div></div>';return;}await reload(true);}
document.addEventListener('change',async e=>{
 if(e.target?.id!=='bgpicker')return;
 let input=e.target;
 try{input.disabled=true;toast('Загружаю фон игры…');await uploadBackground(input.files[0]);await reload(true);toast('Фон установлен на всех экранах игры');}
 catch(ex){toast('Не удалось установить фон: '+ex.message)}
 finally{input.disabled=false}
});
document.addEventListener('click',async e=>{var b=e.target.closest('[data-act]');if(!b||apiBusy)return;var a=b.dataset.act;try{
if(a==='copyJoin')return clip(state.joinUrl);if(a==='copyHost')return clip(location.origin+location.pathname+'?room='+room+'#host='+token);
if(a==='openroom'){var x=document.getElementById('roomcode').value.trim().toUpperCase();if(!x)return toast('Введите код');location.href=PAGE+'?room='+encodeURIComponent(x);return;}
if(a==='pick'){document.getElementById('jointeam').value=b.dataset.team;document.getElementById('nickname').focus();return;}
if(a==='reload'){return reload(true)}
if(a==='reset'&&!confirm('Сбросить все решения, союзы и голоса текущей сессии? Участники останутся подключены.'))return;
if(a==='clearMembers'&&!confirm('Удалить ВСЕХ '+(state.members||[]).length+' участников из комнаты '+room+'? Они будут отключены, но результаты игры сохранятся.'))return;
if(a==='kickMember'&&!confirm('Удалить участника «'+b.dataset.nick+'» из комнаты?'))return;
apiBusy=true;b.disabled=true;
var data={};
if(a==='join'){data={nickname:document.getElementById('nickname').value.trim(),team:Number(document.getElementById('jointeam').value)};var ans=await api('join',data);token=ans.token;localStorage.setItem('eco_token_'+room,token);toast('Вы подключены');await reload(true);return;}
if(a==='create'){var x=await api('create');room=x.room;token=x.token;location.href=x.hostUrl;return;}
if(a==='removeBg')data={};
if(a==='kickMember')data={memberId:b.dataset.member};
if(a==='decision')data={option:Number(b.dataset.option)};
if(a==='statement')data={statement:document.getElementById('statement').value.trim()};
if(a==='ally'||a==='accept')data={otherTeam:Number(b.dataset.team),kind:a};
if(a==='chat'){data={message:document.getElementById('message').value.trim(),target:Number(document.getElementById('target').value)};if(!data.message)throw Error('Введите сообщение');}
if(a==='vote')data={vote:b.dataset.vote};
if(a==='settime')data={minutes:Number(document.getElementById('mins').value)};
if(a==='declaration')data={text:document.getElementById('declaration').value};
await api(a,data);toast('Действие выполнено');await reload(true);
}catch(ex){toast('Ошибка: '+ex.message)}finally{apiBusy=false;if(b?.isConnected)b.disabled=false}});
setInterval(()=>{var x=document.getElementById('timer');if(x&&state){x.textContent=timeFormat()}},1000);
setInterval(()=>{if(room&&state)reload(false)},4500);
initial();
})();
</script></body></html>
