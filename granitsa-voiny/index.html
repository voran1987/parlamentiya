/* Visual dossier design v3 */
:root{--navy:#253a55;--sand:#e5d9bf;--slate:#7b8fa5}
header{background:#faf9f6;border-bottom:1px solid #c9cfd4}
header .wrap{padding-top:19px;padding-bottom:19px}
header small{color:#b07842;font-size:11px}
header h1{font-size:28px;letter-spacing:-.055em}
body{background:#f1f0eb;background-image:linear-gradient(90deg,transparent 95%,#e5e4dd 95%);background-size:36px 36px}
main{padding-top:24px}
h2{font-size:29px;letter-spacing:-.035em}
h3{letter-spacing:-.02em}
.paper{box-shadow:0 6px 18px rgba(34,49,70,.035)}
.hero-board{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,1.05fr);gap:22px;align-items:stretch}
.hero-content{padding:28px 8px 24px 0}
.hero-content h2{font-size:clamp(32px,3.4vw,50px);line-height:1.08;max-width:640px;letter-spacing:-.055em}
.hero-content p{font-size:16px}
.hero-flag{display:inline-block;color:#9f6836;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid #c28649;padding-bottom:8px}
.feature-line{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:14px;color:#465468}
.feature-line:before{content:"";display:block;width:7px;height:7px;background:#c28649;transform:rotate(45deg);flex-shrink:0}
.scene{background:#e8ebe9;border:1px solid #ccd3d5;position:relative;overflow:hidden}
.scene-head{display:flex;align-items:center;justify-content:space-between;background:#e6e3d9;padding:11px 15px;gap:9px;border-bottom:1px solid #bfc8ce;font-size:11px;color:#536377;font-weight:750;letter-spacing:.10em;text-transform:uppercase}
.scene svg{width:100%;height:auto;display:block;background:#eef0ee}
.scene-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;background:#f7f7f3;border-top:1px solid #cad2d4}
.scene-note{font-size:12px;color:#637184}
.map-leg{display:flex;flex-wrap:wrap;gap:13px;font-size:11px;color:#596a76}
.map-leg span:before{content:"";display:inline-block;width:9px;height:9px;background:#c28649;margin-right:6px}
.map-leg span:first-child:before{background:#a6b7c1}
.map-leg span:last-child:before{background:#bb5a48}
.casebanner{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 15px;background:#253a55;color:#fff;margin-bottom:18px}
.casebanner .large{font-size:20px;color:#fff}
.casebanner small{font-size:11px;letter-spacing:.10em;color:#d4e2ed;text-transform:uppercase}
.casebanner strong{font-size:14px;letter-spacing:.03em}
.situation-layout{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.situation-layout .paper{margin:0}
.situation-layout .scene{align-self:stretch}
.situation-layout .scene svg{max-height:360px}
.event-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#cbd2d7;border:1px solid #cbd2d7;margin:17px 0}
.event-strip .event{padding:13px;background:#fff;min-height:86px}
.event-strip b{display:block;font-size:20px;line-height:1.1;color:#253a55;margin-bottom:5px}
.event-strip span{color:#68798a;font-size:12px}
.event-strip .alert b{color:#b65b45}
.doc{background:#fdfdfb;border:1px solid #cbd1d3;position:relative;padding:14px 12px 14px 52px;min-height:92px}
.doc:before{content:"§";position:absolute;left:12px;top:12px;color:#bd9466;font-size:23px;font-family:Georgia,serif;border:1px solid #dbc8af;width:29px;height:34px;text-align:center;line-height:33px}
.doc .doctag{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:#ab7a46}
.doc strong{font-family:Georgia,serif;font-size:17px;line-height:1.2}
.doc.known{border-left:4px solid var(--green);background:#f7faf7}
.doc button{font-size:12px;padding:6px 10px;justify-self:start}
.scene .pathstroke{stroke:#9cabb5;stroke-width:1.8;fill:none}
.case-hint{border:1px solid #d9c8af;background:#fbf8f1;padding:13px;margin:12px 0;font-size:14px;color:#586472}
.case-hint strong{color:#7f5d36}
.hero-badge{display:flex;gap:18px;margin-top:26px;padding-top:13px;border-top:1px solid #d7dde0}
.hero-badge div{min-width:110px}
.hero-badge b{display:block;font-size:27px;line-height:1;color:var(--ink)}
.hero-badge span{font-size:11px;letter-spacing:.08em;color:#778390}
.hosttools{display:flex;flex-wrap:wrap;gap:7px}
@media(max-width:1000px){.situation-layout,.hero-board{grid-template-columns:1fr}.hero-content{padding:6px 0 0}.scene svg{max-height:390px}}
@media(max-width:800px){body{background:#f1f0eb}.scene-head{padding:9px}.scene-foot{flex-direction:column;align-items:flex-start}.hero-content h2{font-size:32px}.hero-badge{gap:10px}.hero-badge div{min-width:auto;flex:1}.event-strip .event{padding:9px;min-height:80px}.event-strip b{font-size:17px}.event-strip span{font-size:10px}.scene svg{max-height:330px}}

/* SCAN VIEWER: accessible text laid onto textured A4 sheet, not an external photograph */
.scan-reader{position:fixed;z-index:999;inset:0;background:rgba(16,25,36,.84);display:none;overflow-y:auto;overscroll-behavior:contain;padding:25px 14px 45px}
.scan-reader.open{display:block}
.scan-outer{max-width:810px;margin:auto}
.scan-toolbar{display:flex;position:sticky;top:-25px;z-index:4;background:#1d3048;color:#e4e8ec;align-items:center;justify-content:space-between;gap:12px;padding:10px 13px;font-size:11px;letter-spacing:.09em;font-weight:700;border-bottom:3px solid #b18a65}
.scan-toolbar .rows{gap:6px}.scan-toolbar button{font-size:12px;border-color:#748393;background:#36495d;color:white;padding:6px 10px}
.scan-page{--scansize:15px;position:relative;isolation:isolate;width:100%;min-height:1000px;margin:20px auto 0;padding:76px 68px 56px;background:#eeeae1;border:1px solid #bbb7ae;box-shadow:0 0 0 6px rgba(226,222,213,.09),5px 14px 37px rgba(0,0,0,.45),inset 0 0 19px rgba(89,84,75,.18);transform:rotate(-.15deg);color:#24282c;font-family:Georgia,'Times New Roman',serif;font-size:var(--scansize);line-height:1.52;overflow:hidden}
.scan-page:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 9% 16%,rgba(110,100,81,.09) 0 .9px,transparent 1.2px),radial-gradient(circle at 79% 61%,rgba(60,60,54,.06) 0 .8px,transparent 1px),repeating-linear-gradient(0deg,transparent 0 17px,rgba(100,92,78,.025) 18px 19px),linear-gradient(90deg,rgba(79,68,52,.11),transparent 3%,transparent 96%,rgba(76,73,64,.11));background-size:18px 21px,32px 29px,auto,auto;opacity:.8}
.scan-page:after{content:"";position:absolute;inset:6px;border:1px solid rgba(91,83,75,.09);pointer-events:none}
.scan-page .scan-top{font-family:Arial,sans-serif;font-size:.72em;letter-spacing:.12em;text-align:center;text-transform:uppercase;color:#696b69}
.scan-page .scan-ministry{font-family:Arial,sans-serif;font-size:.9em;font-weight:750;text-align:center;max-width:500px;margin:13px auto 22px;border-bottom:1px solid #8f8d85;padding-bottom:11px;color:#30343b}
.scan-page .scan-data{display:flex;gap:15px;justify-content:space-between;margin:18px 0 36px;font: .8em Arial,sans-serif;color:#535c62}
.scan-page h2{font-family:Georgia,'Times New Roman',serif;text-transform:uppercase;text-align:center;font-size:1.25em;line-height:1.2;letter-spacing:.02em;font-weight:700;color:#24292e;margin:0 0 8px}
.scan-page .scan-sub{text-align:center;max-width:560px;margin:0 auto 29px;color:#40454a;font-style:italic;font-size:.95em}
.scan-page p{margin:0 0 16px;text-align:justify}
.scan-page table{border-collapse:collapse;width:100%;font-size:.88em;margin:12px 0 23px}
.scan-page th,.scan-page td{border:1px solid #767a7a;padding:7px 8px;text-align:left;vertical-align:top}
.scan-page th{background:rgba(110,113,106,.09);font-family:Arial,sans-serif;font-size:.86em}
.scan-page ol{padding-left:24px}
.scan-page li{margin:8px 0}
.scan-page .scan-map{height:180px;position:relative;margin:12px auto 24px;background:linear-gradient(150deg,#d9ded2,#eef0e7);border:1px solid #a4a69e;overflow:hidden;font:12px Arial,sans-serif}
.scan-map-a{position:absolute;top:23px;left:20px;font-weight:700}.scan-map-a span{font-weight:400}.scan-map-river{position:absolute;width:110%;height:26px;top:79px;left:-4%;border-top:9px solid #a5b7b9;transform:rotate(-12deg)}
.scan-map-road{position:absolute;bottom:17px;left:55px;background:#f1ebd4;padding:6px}.scan-map-b{position:absolute;top:41px;right:32px}.scan-map-label{position:absolute;right:9px;bottom:6px;color:#6e7774;font-size:9px}
.scan-page .scan-org{display:grid;gap:5px;justify-items:center;font:12px Arial,sans-serif;margin:15px 0 26px}.scan-org-main{border:1px solid #878b89;padding:10px;background:rgba(135,142,136,.1);font-weight:700}
.scan-org-stem{text-align:center;color:#667}.scan-org-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.scan-org-row span{border:1px solid #878b89;padding:9px 8px;background:rgba(255,255,255,.26)}
.scan-page .statline{display:flex;gap:12px;margin:18px 0}.scan-page .statline span{flex:1;border:1px solid #96938a;text-align:center;font:12px Arial,sans-serif;padding:9px}.scan-page .statline b{display:block;font-size:23px}
.scan-page .scan-end{display:flex;gap:15px;justify-content:space-between;margin-top:56px;align-items:end}
.scan-page .scan-sign{display:block;min-width:170px;border-bottom:1px solid #72797c;padding-bottom:10px;font:italic 1em Georgia,serif;color:#3c526e;transform:rotate(-3deg)}
.scan-page .scan-stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:138px;height:75px;border:3px double rgba(135,57,45,.65);color:rgba(135,57,45,.74);font:700 .70em Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-11deg)}
.scan-page .scan-bottom{margin-top:68px;border-top:1px solid #a5a29a;text-align:center;padding-top:12px;color:#72736e;font:10px Arial,sans-serif;letter-spacing:.1em}
.scan-reader .scan-folder{border:0}.scan-folder{display:flex;gap:14px;align-items:center;border:1px solid #d6d3c9;background:#fdfcf9;margin-top:12px;padding:12px;min-height:107px}
.scan-mini{position:relative;flex:0 0 60px;height:81px;box-shadow:2px 4px 7px rgba(40,41,42,.17);background:#ede9de;border:1px solid #bdb7a6;transform:rotate(-3deg)}
.scan-mini:before{content:"";position:absolute;left:8px;right:7px;top:11px;height:3px;background:#686a68;box-shadow:0 8px #c2c1ba,0 16px #b3b5af,0 24px #c2c1ba,0 32px #b3b5af,0 40px #c2c1ba,0 48px #c2c1ba}
.scan-mini:after{content:"08";position:absolute;right:5px;bottom:6px;font:700 9px Georgia,serif;color:#865d3c}
.scan-folder .scan-info{flex:1;min-width:0}.scan-folder .scan-info strong{display:block;color:#273d56;font-size:15px;line-height:1.3;margin:3px 0}
.scan-folder .scan-info small{font-size:10px;color:#85745f;letter-spacing:.10em}
.scan-folder .scan-controls{display:flex;flex-direction:column;align-items:end;gap:5px}
.scan-folder button{font-size:12px;padding:6px 12px;white-space:nowrap}

@media(max-width:640px){.scan-reader{padding:0 0 25px}.scan-toolbar{top:0;flex-wrap:wrap;font-size:10px}.scan-toolbar .rows{flex:1;justify-content:flex-end}.scan-page{transform:none;margin:0;min-height:100vh;padding:38px 24px 48px;font-size:var(--scansize);box-shadow:none}.scan-page .scan-data{flex-wrap:wrap;margin-bottom:24px}.scan-page .scan-stamp{width:115px;height:64px}.scan-page .scan-end{margin-top:35px}.scan-folder{flex-wrap:wrap}.scan-folder .scan-controls{margin-left:73px;align-items:start}.scan-page .scan-org-row span{font-size:11px}.scan-page .statline{gap:4px}}

/* DISTINCT SCANNED DOSSIERS v4 */
.scan-page{--page-ink:#283039;padding:66px 65px 52px;color:var(--page-ink);background:#efece4;font-size:var(--scansize)}
.scan-page .leaf-head{font-family:Arial,sans-serif;letter-spacing:.09em;font-size:.78em;font-weight:700}
.scan-page .leaf-meta{font: .80em Arial,sans-serif;color:#626b6e}
.scan-page .leaf-title{font-size:1.38em;text-transform:uppercase;letter-spacing:.03em;margin:20px 0 8px;color:#242a31;line-height:1.2}
.scan-page .leaf-sub{font-size:.92em;color:#5b6367;margin:0 0 22px}
.scan-page .leaf-foot{font: .67em Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;text-align:center;border-top:1px solid #9fa6a5;margin-top:36px;padding-top:12px;color:#626a68}
.scan-page .leaf-sign{margin-top:30px;display:flex;gap:15px;justify-content:space-between;align-items:flex-end;font: .80em Arial,sans-serif;color:#5f6569}

.scan-page .scan-content{font-size:1em}
.scan-page .scan-content table{width:100%;border-collapse:collapse;margin:12px 0 22px}
.scan-page .scan-content td,.scan-page .scan-content th{padding:7px;border:1px solid #8a8f8a;vertical-align:top;text-align:left}
.scan-page .scan-content th{background:rgba(76,89,94,.07);font-family:Arial,sans-serif;font-size:.8em}
.scan-page .scan-typed{font-family:'Courier New',Consolas,monospace}
.scan-page .perforation{height:14px;background:repeating-linear-gradient(90deg,transparent 0 22px,#c1bdb5 22px 26px,transparent 26px 35px);margin-bottom:19px}
.scan-page .leaf-report-serial{display:flex;justify-content:space-between;border-top:4px double #454c50;border-bottom:1px solid #a0a4a0;padding:11px 0;margin:0 0 24px;font:700 .76em Arial,sans-serif}
.scan-page .leaf-observation{font: .77em Arial,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:#5d686e}
.scan-page .leaf-box{border:1px solid #a7aaa7;padding:12px 14px;margin:15px 0;background:rgba(255,255,255,.25)}

.scan-page .scan-foot-label{margin-top:30px;font:10px Arial,sans-serif;color:#757974;text-transform:uppercase;letter-spacing:.11em;border-top:1px solid #b4b5ae;padding-top:12px;text-align:center}
/* 01 — Patrol incident log: carbon copy */
.scan-page.scan-incident{background:#e2e4e2;--page-ink:#273c4c;font-family:'Courier New',monospace;transform:rotate(.16deg)}

отдельных районах отмечались перекрытия дорог, поджоги шин и повреждения полицейского транспорта.</p><p>Наблюдатели независимо подтвердили два эпизода применения огнестрельного оружия, но не располагают сведениями, позволяющими связать их с единым планом или устойчивой вооружённой организацией.</p><p>Миссия продолжает сбор данных об участниках столкновений и действиях сил безопасности.</p>"},"p4":{"unit":"Объединённый аналитический центр","kind":"ОРГАНИЗАЦИОННАЯ СХЕМА","no":"АС-04","date":"27 июня","sign":"Руководитель группы анализа связей","sub":"Предполагаемая структура группы «ОВГ-1»","body":"<div class=\"scan-org\"><div class=\"scan-org-main\">Командный узел «Север»</div><div class=\"scan-org-stem\">│</div><div class=\"scan-org-row\"><span>Оперативный сектор</span><span>Логистика</span><span>Связь</span></div><div class=\"scan-org-stem\">│</div><div class=\"scan-org-row\"><span>Отряд «Рубеж»</span><span>«Северный мост»</span><span>Группа «Восток»</span></div></div><p>Схема составлена по повторяющимся позывным, приказам о передислокации и совпадающим каналам связи. Отдельные командиры неоднократно исполняли приказы общего узла.</p><p>Точные численность и обеспеченность подразделений устанавливаются.</p>"},"p5":{"unit":"Оперативный журнал Северного региона","kind":"ХРОНОЛОГИЧЕСКАЯ СВОДКА","no":"Х-27","date":"28 июня","sign":"Дежурный аналитического центра","sub":"Боевые столкновения за шесть недель","body":"<table><tr><th>Дата</th><th>Наблюдаемое событие</th></tr><tr><td>19 мая</td><td>Нападение на полицейский конвой с автоматическим оружием и гранатами.</td></tr><tr><td>24 мая</td><td>Штурм блокпоста у моста. Привлечено армейское подкрепление.</td></tr><tr><td>2 июня</td><td>Одновременные бои в двух районах с применением тяжёлых пулемётов.</td></tr><tr><td>14 июня</td><td>Столкновение около пяти часов у транспортного узла Лейк-Роуд.</td></tr><tr><td>26 июня</td><td>Согласованные нападения на три объекта сил безопасности.</td></tr></table><p>Частота столкновений возросла, привлечены регулярные военные подразделения. Данные сверены по нескольким сообщениям.</p>"},"p6":{"unit":"Полевой картографический сектор","kind":"СПРАВКА О КОНТРОЛЕ МЕСТНОСТИ","no":"Т-06","date":"29 июня","sign":"Начальник картографического сектора","sub":"Районы присутствия группы «ОВГ-1»","body":"<div class=\"scan-map\"><div class=\"scan-map-a\">СЕВЕРНЫЙ РЕГИОН<br/><span>зона эпизодического присутствия</span></div><div class=\"scan-map-river\"></div><div class=\"scan-map-road\">ДОРОГА Н-4</div><div class=\"scan-map-b\">район Лейк-Роуд</div><div class=\"scan-map-label\">Условная схема — не географическая карта</div></div><p>Группа неоднократно перекрывала движение по отдельным дорогам, иногда удерживая посты несколько часов. Постоянное управление населёнными пунктами и функционирование собственной администрации не подтверждены.</p><p>Наличие мобильных групп отмечается в трёх районах.</p>"},"p7":{"unit":"Командование пограничного участка Государства А","kind":"ПОГРАНИЧНЫЙ РАПОРТ","no":"BR-04","date":"4 июля","sign":"Командир поста «Восточный-4»","sub":"Перестрелка на международной границе","body":"<table><tr><th>Время</th><th>Запись в журнале</th></tr><tr><td>12:10</td><td>Вооружённое подразделение Государства Б пересекло границу.</td></tr><tr><td>12:14</td><td>По посту «Восточный-4» открыт огонь.</td></tr><tr><td>12:18</td><td>Гарнизон Государства А ответил огнём.</td></tr><tr><td>12:52</td><td>Огонь прекращён. Наблюдается отход подразделения Б.</td></tr></table><p>Общая продолжительность огневого контакта — около 40 минут. Двое военнослужащих А получили ранения. Объявление войны в рапорте не упоминается.</p>"},"p8":{"unit":"Министерство иностранных дел Государства А","kind":"ДИПЛОМАТИЧЕСКАЯ НОТА","no":"Д-71/7","date":"5 июля","sign":"Департамент соседних государств","sub":"Нота протеста посольству Государства Б","body":"<p>Министерство иностранных дел Государства А свидетельствует своё уважение посольству Государства Б и заявляет официальный протест в связи с пересечением международной границы вооружённым подразделением Б 4 июля.</p><p>Правительство А запрашивает сведения о командовании указанного подразделения, обстоятельствах применения силы и мерах, принимаемых для предотвращения повторения подобных инцидентов.</p><p>Государство А оставляет за собой право продолжить обсуждение вопроса на дипломатическом уровне.</p><p>Текст настоящей ноты не содержит объявления войны и не предусматривает разрыва дипломатических отношений.</p>"},"p9":{"unit":"Ситуационный центр Северного региона","kind":"ОПЕРАТИВНАЯ СВОДКА","no":"F-03","date":"6 июля","sign":"Офицер оперативной сводки","sub":"Боевые действия на территории Государства А","body":"<table><tr><th>Район</th><th>Событие</th><th>Участники</th></tr><tr><td>Лейк-Роуд</td><td>Трёхчасовой бой за транспортный узел.</td><td>Армия А, ОВГ-1</td></tr><tr><td>Норт-7</td><td>Обстрел колонны сил безопасности.</td><td>ОВГ-1</td></tr><tr><td>Северный мост</td><td>Попытка атаки на инженерный объект.</td><td>ОВГ-1, армия А</td></tr></table><p>Эти столкновения происходили одновременно с дипломатическим разбирательством пограничного инцидента. Подразделения ОВГ-1 продолжали действовать под общим командованием.</p>"},"p10":{"unit":"Полевой центр учёта задержанных лиц","kind":"РЕГИСТРАЦИОННАЯ КАРТА","no":"CP-0047","date":"5 июля","sign":"Офицер регистрации","sub":"Лицо, захваченное войсками Государства Б","body":"<table><tr><th>Поле учёта</th><th>Сведения</th></tr><tr><td>Принадлежность</td><td>Регулярные вооружённые силы Государства А (по жетону и форме).</td></tr><tr><td>Место</td><td>Пост «Восточный-4».</td></tr><tr><td>Обстоятельства</td><td>Захвачен подразделением Государства Б в ходе перестрелки.</td></tr><tr><td>Состояние</td><td>Ранение руки; оказана первая помощь.</td></tr></table><p>Личность проверяется. Запись сделана в месте первоначального содержания.</p>"},"p11":{"unit":"Военная полиция Государства А","kind":"ПРОТОКОЛ ЗАДЕРЖАНИЯ","no":"DP-0201","date":"7 июля","sign":"Дежурный офицер военной полиции","sub":"Задержание предполагаемого участника «ОВГ-1»","body":"<p>В районе Норт-7 после обстрела колонны сил безопасности задержан вооружённый мужчина. При нём обнаружены автомат без маркировки, радиостанция и лист с позывными.</p><p>Задержанный называет себя участником ОВГ-1, сообщает о подчинении командиру сектора и получении приказов по радиосвязи. Проверка показаний продолжается.</p><table><tr><th>Проверяется</th><th>Состояние</th></tr><tr><td>Связь с обстрелом колонны</td><td>Не установлена окончательно.</td></tr><tr><td>Принадлежность к группе</td><td>Подтверждается косвенными материалами.</td></tr></table>"},"p12":{"unit":"Совместная гуманитарная оценочная миссия","kind":"АКТ ПОЛЕВОГО ОБСЛЕДОВАНИЯ","no":"OC-009","date":"8 июля","sign":"Инспектор миссии","sub":"Фактический контроль района «Восточный»","body":"<p>В ходе выезда зафиксированы следующие обстоятельства:</p><ol><li>На въездах размещены вооружённые посты Государства Б.</li><li>Введён комендантский час с 21:00 до 06:00.</li><li>Передвижение транспорта регулируется пропусками подразделения Б.</li><li>Представители органов Государства А не осуществляют фактическое управление районом.</li></ol><p>Местные учреждения продолжают работать при согласовании с представителями сил Государства Б. Факты отмечены по результатам бесед с населением и наблюдений инспекторов.</p>"}};

}
function docList(){return scanList(false)}
function answerForm(){var t=currentTeam();var answer=t&&t.answers[String(data.stage)];if(answer)return '<div class="paper"><div class="label">Заключение комиссии</div><div class="notice">'+E(ST[data.stage].choices[answer.choice])+'</div><p>'+E(answer.reason)+'</p><div class="good">Решение принято. Дополнительная отправка заблокирована.</div></div>';return '<div class="paper"><div class="label">Экспертное заключение</div><h3>Предварительная правовая квалификация</h3>'+ST[data.stage].choices.map(function(c,i){return '<label class="choice"><input name="answer" type="radio" value="'+i+'" '+(String(i)===draftChoice?'checked':'')+' '+(data.revealed?'disabled':'')+'>'+E(c)+'</label>'}).join("")+'<p><strong>Обоснование</strong> <span class="micro">не менее 25 знаков; укажите факт и правовой критерий</span></p><textarea id="reason" '+(data.revealed?'disabled':'')+' placeholder="Поскольку ..., применима ..., однако для окончательного вывода необходимо ...">'+E(draftReason)+'</textarea><div class="spacer"></div><button class="primary" data-act="submit" '+(data.revealed?'disabled':'')+'>Отправить одно заключение команды</button></div>'}
function revealedAnswers(stage){var ans=teams().filter(function(t){return t.answers&&t.answers[String(stage)]});return '<div class="paper"><div class="label">Открытые решения команд · этап '+stage+'</div>'+ans.map(function(t){var a=t.answers[String(stage)];return '<div class="challenge"><strong>'+E(t.name)+'</strong><div class="micro">'+E(ST[stage].choices[a.choice])+'</div><p>'+E(a.reason)+'</p></div>'}).join("")+'</div>'}
function teamPage(){var t=currentTeam();var body='<div class="grid"><div>'+phaseHeader();if(data.stage===0)body+='<div class="paper"><h3>Комиссия зарегистрирована</h3><p>Ожидайте начала расследования. Ведущий открывает раунды на общем экране.</p></div>';else if(data.stage<=4){body+='<div class="situation-layout"><div class="paper"><div class="label">Доклад ситуационного центра</div><p class="statement">'+E(ST[data.stage].body)+'</p><div class="case-hint"><strong>На что обратить внимание:</strong> '+(data.stage===3?'Сравните юридические критерии международного и немеждународного конфликта. Какое значение имеет продолжительность перестрелки между регулярными армиями?':'Сначала установите факты, затем юридическую категорию. При недостатке данных не делайте категоричных выводов.')+'</div></div>'+sceneMap(data.stage)+'</div><div class="spacer"></div>'+answerForm();if(data.revealed)body+='<div class="spacer"></div>'+revealedAnswers(data.stage)}else if(data.stage===5){body+='<div class="paper"><div class="label">Перекрёстная экспертиза</div><p>'+E(ST[5].body)+'</p>'+teams().filter(function(x){return x.id!==myteam}).map(function(other){return '<div class="challenge"><strong>'+E(other.name)+'</strong><div class="micro">Баллы: '+other.score+'</div><button data-act="challenge-team" data-team="'+other.id+'">Оспорить вывод комиссии</button></div>'}).join("")+'<label for="challenge">Экспертное возражение</label><textarea id="challenge" placeholder="Назовите факт, неверный вывод и правовую норму…">'+E(draftChallenge)+'</textarea><button class="primary" data-act="send-challenge">Отправить экспертный вызов</button></div>'+[1,2,3,4].map(revealedAnswers).join("")}else{body+='<div class="paper"><h2>Расследование завершено</h2><p>Спасибо за работу. Результаты и экспертные оценки видны в рейтинге.</p></div>'}body+='</div><aside>'+scoreTable()+'<div class="spacer"></div>'+docListIfStage()+'</aside></div>';root.innerHTML=body}
function docListIfStage(){return data.stage>0&&data.stage<5?docList(): '<div class="paper"><div class="label">Комиссия</div><h3>Комиссия '+myteam+'</h3><p>Вы участвуете в общем расследовании. Материалы, ответы и баллы синхронизируются между устройствами.</p></div>'}
function hostPage(){var b='<div class="grid"><div>'+phaseHeader()+'<div class="situation-layout"><div class="paper"><div class="label">Панель ведущего / Оперативная сводка</div><h3>'+E(ST[data.stage].t)+'</h3><p class="statement">'+E(ST[data.stage].body)+'</p></div>'+sceneMap(data.stage)+'</div><div class="spacer"></div><div class="paper"><div class="label">Управление этапом</div><div class="rows hosttools">'+(data.stage===0?'<button class="primary" data-act="next">Начать расследование</button>':data.stage>=1&&data.stage<=4?'<button class="accent" data-act="reveal" '+(data.revealed?'disabled':'')+'>Показать решения</button><button class="primary" data-act="next" '+(!data.revealed?'disabled':'')+'>Следующий этап</button>':data.stage===5?'<button class="primary" data-act="next">Завершить расследование</button>':'<span class="good">Финал</span>')+'<button class="warn" data-act="reset">Сбросить сессию и участников</button></div><p class="micro">Таймер информационный; переходы между этапами управляются ведущим. Ответы скрыты от соперников до раскрытия.</p></div><div class="spacer"></div>';if(data.stage>=1&&data.stage<=4){b+=scanList(true)+'<div class="spacer"></div><div class="paper"><div class="label">Заключения комиссий</div>'+teams().map(function(t){var a=t.answers[String(data.stage)];return '<div class="challenge"><div class="rows" style="justify-content:space-between"><strong>'+E(t.name)+'</strong><span class="tag">'+(a?'Решение принято':'Ожидается')+'</span></div>'+(a?'<p><strong>'+E(ST[data.stage].choices[a.choice])+'</strong></p><p>'+E(a.reason)+'</p><div class="micro">Автооценка за классификацию начисляется при раскрытии</div>':'')+'<div class="rubric"><button data-act="grade" data-team="'+t.id+'" data-delta="3">+3 аргументы</button><button data-act="grade" data-team="'+t.id+'" data-delta="2">+2 доказательства</button><button data-act="grade" data-team="'+t.id+'" data-delta="-2">−2 ошибка</button></div></div>'}).join("")+'</div>'}else if(data.stage===5||data.stage===6){b+='<div class="paper"><div class="label">Экспертные вызовы соперников</div>'+(data.challenges.length?data.challenges.map(function(c){return '<div class="challenge"><strong>Комиссия '+c.from+' → комиссия '+c.to+'</strong><p>'+E(c.text)+'</p><div class="rubric"><button data-act="grade" data-team="'+c.from+'" data-delta="5">+5 обоснован</button><button data-act="grade" data-team="'+c.from+'" data-delta="-2">−2 необоснован</button></div></div>'}).join(""):'<p class="muted">Пока нет вызовов.</p>')+'</div>'}b+='</div><aside>'+scoreTable()+'<div class="spacer"></div><div class="paper"><div class="label">Общий экран</div><p>Команды подключаются по QR-коду внизу экрана. Ведущему доступно управление этапами, баллами и сбросом.</p><button data-act="copy" data-url="host">Скопировать отдельную ссылку ведущего</button><div class="spacer"></div><div class="micro">Не показывайте ссылку ведущего на общем экране: в ней содержится секрет управления.</div></div></aside></div>';root.innerHTML=b}
function render(){if(!room){landing();if(err)root.insertAdjacentHTML("afterbegin",'<div class="notice warn">'+E(err)+'</div>');qrfooter();return}var banner=err?'<div class="notice warn" style="margin-bottom:12px">'+E(err)+'</div>':'';if(!data){root.innerHTML=banner+'<div class="paper">Подключение к сессии…</div>';qrfooter();return}if(hostToken)hostPage();else if(!playerToken)joinPage();else teamPage();if(err)root.insertAdjacentHTML("afterbegin",banner);qrfooter();document.querySelectorAll("#timer").forEach(function(n){n.textContent=clock(data.deadline)})}
function valueOf(selector){var x=document.querySelector(selector);return x?x.value:""}
document.addEventListener("input",function(e){if(e.target.id==="reason")draftReason=e.target.value;if(e.target.id==="challenge")draftChallenge=e.target.value;if(e.target.name==="answer")draftChoice=e.target.value});
document.addEventListener("change",function(e){if(e.target.name==="answer")draftChoice=e.target.value});
document.addEventListener("click",async function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;try{if(a==="create"){el.textContent="Создание комнаты…";el.disabled=true;return action("create")};if(a==="open"){var v=valueOf("#linkinput").trim();if(!v)throw Error("Укажите ссылку.");try{var x=new URL(v);v=x.searchParams.get("room")||v}catch(_){}room=v;history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room));await poll();return}if(a==="scan-open"){scanDialog(el.dataset.id);return}if(a==="scan-close"){scanClose();return}if(a==="scan-size"){scanFont=Math.max(12,Math.min(21,scanFont+Number(el.dataset.change)));document.getElementById("scanPaper").style.setProperty("--scansize",scanFont+"px");return}if(a==="join")return action("join",{team:Number(el.dataset.team)});if(a==="next"||a==="reveal"||a==="reset"){if(a==="reset"&&!confirm("Удалить команды, баллы и решения этой сессии?"))return;return action(a)}if(a==="evidence")return action("evidence",{doc:el.dataset.id});if(a==="submit"){var r=draftReason.trim(),choice=Number(draftChoice);if(draftChoice===""||r.length<25)throw Error("Выберите квалификацию и напишите обоснование от 25 знаков.");return action("submit",{choice:choice,reason:r})}if(a==="grade")return action("grade",{team:Number(el.dataset.team),delta:Number(el.dataset.delta)});if(a==="challenge-team"){window.challengeTarget=Number(el.dataset.team);alert("Выбрана комиссия "+window.challengeTarget+". Напишите возражение в поле и отправьте.");return}if(a==="send-challenge"){if(!window.challengeTarget)throw Error("Сначала выберите комиссию-соперника.");if(draftChallenge.trim().length<35)throw Error("Возражение должно содержать не меньше 35 знаков.");return action("challenge",{target:window.challengeTarget,text:draftChallenge.trim()})}if(a==="copy"){var val=el.dataset.url==="host"?hostUrl():myUrl();try{await navigator.clipboard.writeText(val);el.textContent="Скопировано"}catch(_){prompt("Скопируйте ссылку:",val)}return}}catch(e){setError(e.message)}});
document.addEventListener("keydown",function(e){if(e.key==="Escape")scanClose()});document.getElementById("scanReader").addEventListener("click",function(e){if(e.target.id==="scanReader")scanClose()});
setInterval(function(){if(room&&!busy)poll()},4500);setInterval(function(){if(data){var z=document.getElementById("timer");if(z)z.textContent=clock(data.deadline)}},1000);poll();
})();
</script></body></html>
