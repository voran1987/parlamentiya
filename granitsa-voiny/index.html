{t:"Беспорядки или гражданская война?",short:"Квалификация",body:"В Северном регионе Государства А проходят протесты. За пять дней зафиксированы два эпизода применения оружия. Группа «ОВГ-1» объявляет в социальных сетях о начале гражданской войны. Сведения о её едином командовании и регулярности столкновений отсутствуют.",choices:["Немеждународный конфликт уже установлен","Недостаточно фактов для признания НМВК","Международный конфликт"]},

{t:"Иностранное вмешательство",short:"Граница",body:"Вооружённые силы Государства Б без согласия Государства А пересекли границу и вступили в краткое столкновение с его регулярной армией. В то же время продолжаются интенсивные бои правительства с ОВГ-1. Официального объявления войны не было.",choices:["Параллельно существуют МВК между государствами и НМВК с группой","Существует только международный конфликт","Без объявления войны МВК отсутствует"]},
{t:"Гуманитарное досье",short:"Статусы",body:"Материалы дела: A — солдат армии А захвачен войсками Б; Б — повстанец ОВГ-1 задержан армией А; В — действует гражданский госпиталь; Г — армия Б осуществляет эффективный контроль над районом А без его согласия.",choices:["Все захваченные автоматически являются военнопленными","А — военнопленный; Б — нет автоматического POW; В — госпиталь под особой защитой; Г — возможна оккупация","Оккупация возникает только после подписания мирного договора"]},

{id:"p3",stage:1,title:"Мониторинг протестов",content:"Большинство мероприятий было невооружённым. Имеющихся данных недостаточно для установления интенсивности устойчивых боевых действий."},

function E(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function myUrl(){return location.origin+location.pathname+"?room="+encodeURIComponent(room)}
function hostUrl(){return myUrl()+"#host="+hostToken}
function clock(deadline){var d=deadline?Math.max(0,Math.floor((deadline-Date.now())/1000)):0;return ("0"+Math.floor(d/60)).slice(-2)+":"+("0"+d%60).slice(-2)}
function setError(e){err=String(e||"Ошибка подключения");render()}
function save(){if(room){hostToken=localStorage.getItem("warhost_"+room)||"";playerToken=localStorage.getItem("warplayer_"+room)||"";myteam=Number(localStorage.getItem("warteam_"+room)||0)}var h=location.hash.match(/^#host=(.+)$/);if(h){hostToken=decodeURIComponent(h[1]);localStorage.setItem("warhost_"+room,hostToken);history.replaceState(null,"",myUrl()+"&host=1")}}
save();
async function api(a,p){var payload=Object.assign({a:a,room:room,token:hostToken||playerToken},p||{});var controller=new AbortController();var timeout=setTimeout(function(){controller.abort()},15000);try{var resp=await fetch("https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/granitsa-voiny?api=1",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload),signal:controller.signal});var r=await resp.json();if(!resp.ok||!r.ok)throw new Error(r.error||"Ошибка сервера");return r}catch(e){if(e&&e.name==="AbortError")throw new Error("Сервер не ответил за 15 секунд. Повторите запрос.");throw e}finally{clearTimeout(timeout)}}
async function action(a,p){if(busy)return;busy=true;try{var r=await api(a,p);if(r.room){room=r.room;hostToken=r.hostToken;localStorage.setItem("warhost_"+room,hostToken);history.replaceState(null,"",myUrl()+"&host=1")}if(r.playerToken){playerToken=r.playerToken;myteam=r.team;localStorage.setItem("warplayer_"+room,playerToken);localStorage.setItem("warteam_"+room,String(myteam))}err="";await poll()}catch(e){setError(e.message)}finally{busy=false}}
async function poll(){if(!room){render();return}try{var r=await api("get");data=r.data;err="";if(lastStage!==data.stage){draftChoice="";draftReason="";draftChallenge="";lastStage=data.stage}render()}catch(e){err=e.message;render()}}
function teams(){return data&&data.teams||[]}
function currentTeam(){return teams().find(function(t){return t.id===myteam})||null}
function timeline(){return '<div class="timeline">'+ST.slice(1).map(function(s,i){var n=i+1;return '<span class="'+(data.stage===n?'active':data.stage>n?'passed':'')+'">'+n+'. '+E(s.short)+'</span>'}).join("")+'</div>'}
function scoreTable(){return '<div class="paper"><div class="label">Таблица комиссий</div>'+teams().sort(function(a,b){return b.score-a.score}).map(function(t,i){return '<div class="score"><div><strong>'+E(t.name)+'</strong><div class="micro">'+t.members+' участн. · '+(t.answered?'решение готово':'в процессе')+'</div></div><div class="large" style="font-size:24px">'+t.score+'</div></div>'}).join("")+'<div class="micro" style="margin-top:10px">Баллы за правильный вывод + экспертная оценка ведущего.</div></div>'}

function landing(){root.innerHTML='<div class="paper hero"><div class="label">Интерактивное международно-правовое расследование</div><h2>Решения экспертных комиссий. Скрытые доказательства. Соперничество команд.</h2><p class="lead">Четыре этапа расследования, бюджет запросов, защита правовой квалификации и экспертные вызовы между комиссиями. Выдуманных названий стран нет: Государство А, Государство Б и Северный регион.</p><div class="rows"><button class="primary" data-act="create">Создать игру для группы</button></div></div><div class="paper"><h3>Присоединиться к существующей игре</h3><p class="muted">Откройте QR-код на экране ведущего или вставьте ссылку в браузер. Код доступа не нужен.</p><input id="linkinput" type="text" placeholder="Ссылка игры или UUID комнаты"><div class="spacer"></div><button data-act="open">Открыть комнату</button></div>'}
function joinPage(){root.innerHTML='<div class="paper"><div class="label">Комната '+E(room.slice(0,8))+'</div><h2>Выберите экспертную комиссию</h2><p class="lead">Подключение без кода доступа. Выберите команду, в которой будете работать. Одно заключение отправляется от всей команды.</p><div class="grid2">'+[1,2,3,4,5,6].map(function(n){var t=teams().find(function(t){return t.id===n});return '<button data-act="join" data-team="'+n+'" style="text-align:left;padding:18px"><strong>Комиссия '+n+'</strong><div class="micro">'+(t?t.members:0)+' участн.</div></button>'}).join("")+'</div></div>'+scoreTable()}

function answerForm(){var t=currentTeam();var answer=t&&t.answers[String(data.stage)];if(answer)return '<div class="paper"><div class="label">Заключение комиссии</div><div class="notice">'+E(ST[data.stage].choices[answer.choice])+'</div><p>'+E(answer.reason)+'</p><div class="good">Решение принято. Дополнительная отправка заблокирована.</div></div>';return '<div class="paper"><div class="label">Экспертное заключение</div><h3>Предварительная правовая квалификация</h3>'+ST[data.stage].choices.map(function(c,i){return '<label class="choice"><input name="answer" type="radio" value="'+i+'" '+(String(i)===draftChoice?'checked':'')+' '+(data.revealed?'disabled':'')+'>'+E(c)+'</label>'}).join("")+'<p><strong>Обоснование</strong> <span class="micro">не менее 25 знаков; укажите факт и правовой критерий</span></p><textarea id="reason" '+(data.revealed?'disabled':'')+' placeholder="Поскольку ..., применима ..., однако для окончательного вывода необходимо ...">'+E(draftReason)+'</textarea><div class="spacer"></div><button class="primary" data-act="submit" '+(data.revealed?'disabled':'')+'>Отправить одно заключение команды</button></div>'}
function revealedAnswers(stage){var ans=teams().filter(function(t){return t.answers&&t.answers[String(stage)]});return '<div class="paper"><div class="label">Открытые решения команд · этап '+stage+'</div>'+ans.map(function(t){var a=t.answers[String(stage)];return '<div class="challenge"><strong>'+E(t.name)+'</strong><div class="micro">'+E(ST[stage].choices[a.choice])+'</div><p>'+E(a.reason)+'</p></div>'}).join("")+'</div>'}
function teamPage(){var t=currentTeam();var body='<div class="grid"><div>'+phaseHeader();if(data.stage===0)body+='<div class="paper"><h3>Комиссия зарегистрирована</h3><p>Ожидайте начала расследования. Ведущий открывает раунды на общем экране.</p></div>';else if(data.stage<=4){body+='<div class="paper"><div class="label">Оперативная сводка</div><p class="statement">'+E(ST[data.stage].body)+'</p><p class="micro">Все государства и организации в сценарии условные.</p></div><div class="spacer"></div>'+answerForm();if(data.revealed)body+='<div class="spacer"></div>'+revealedAnswers(data.stage)}else if(data.stage===5){body+='<div class="paper"><div class="label">Перекрёстная экспертиза</div><p>'+E(ST[5].body)+'</p>'+teams().filter(function(x){return x.id!==myteam}).map(function(other){return '<div class="challenge"><strong>'+E(other.name)+'</strong><div class="micro">Баллы: '+other.score+'</div><button data-act="challenge-team" data-team="'+other.id+'">Оспорить вывод комиссии</button></div>'}).join("")+'<label for="challenge">Экспертное возражение</label><textarea id="challenge" placeholder="Назовите факт, неверный вывод и правовую норму…">'+E(draftChallenge)+'</textarea><button class="primary" data-act="send-challenge">Отправить экспертный вызов</button></div>'+[1,2,3,4].map(revealedAnswers).join("")}else{body+='<div class="paper"><h2>Расследование завершено</h2><p>Спасибо за работу. Результаты и экспертные оценки видны в рейтинге.</p></div>'}body+='</div><aside>'+scoreTable()+'<div class="spacer"></div>'+docListIfStage()+'</aside></div>';root.innerHTML=body}
function docListIfStage(){return data.stage>0&&data.stage<5?docList(): '<div class="paper"><div class="label">Комиссия</div><h3>Комиссия '+myteam+'</h3><p>Вы участвуете в общем расследовании. Материалы, ответы и баллы синхронизируются между устройствами.</p></div>'}
function hostPage(){var b='<div class="grid"><div>'+phaseHeader()+'<div class="paper"><div class="label">Панель ведущего</div><h3>'+E(ST[data.stage].t)+'</h3><p class="statement">'+E(ST[data.stage].body)+'</p><div class="rows">'+(data.stage===0?'<button class="primary" data-act="next">Начать расследование</button>':data.stage>=1&&data.stage<=4?'<button class="accent" data-act="reveal" '+(data.revealed?'disabled':'')+'>Показать решения</button><button class="primary" data-act="next" '+(!data.revealed?'disabled':'')+'>Следующий этап</button>':data.stage===5?'<button class="primary" data-act="next">Завершить расследование</button>':'<span class="good">Финал</span>')+'<button class="warn" data-act="reset">Сбросить сессию и участников</button></div><p class="micro">Таймер информационный; переходы между этапами управляются ведущим. Ответы скрыты от соперников до раскрытия.</p></div><div class="spacer"></div>';if(data.stage>=1&&data.stage<=4){b+='<div class="paper"><div class="label">Заключения комиссий</div>'+teams().map(function(t){var a=t.answers[String(data.stage)];return '<div class="challenge"><div class="rows" style="justify-content:space-between"><strong>'+E(t.name)+'</strong><span class="tag">'+(a?'Решение принято':'Ожидается')+'</span></div>'+(a?'<p><strong>'+E(ST[data.stage].choices[a.choice])+'</strong></p><p>'+E(a.reason)+'</p><div class="micro">Автооценка за классификацию начисляется при раскрытии</div>':'')+'<div class="rubric"><button data-act="grade" data-team="'+t.id+'" data-delta="3">+3 аргументы</button><button data-act="grade" data-team="'+t.id+'" data-delta="2">+2 доказательства</button><button data-act="grade" data-team="'+t.id+'" data-delta="-2">−2 ошибка</button></div></div>'}).join("")+'</div>'}else if(data.stage===5||data.stage===6){b+='<div class="paper"><div class="label">Экспертные вызовы соперников</div>'+(data.challenges.length?data.challenges.map(function(c){return '<div class="challenge"><strong>Комиссия '+c.from+' → комиссия '+c.to+'</strong><p>'+E(c.text)+'</p><div class="rubric"><button data-act="grade" data-team="'+c.from+'" data-delta="5">+5 обоснован</button><button data-act="grade" data-team="'+c.from+'" data-delta="-2">−2 необоснован</button></div></div>'}).join(""):'<p class="muted">Пока нет вызовов.</p>')+'</div>'}b+='</div><aside>'+scoreTable()+'<div class="spacer"></div><div class="paper"><div class="label">Общий экран</div><p>Команды подключаются по QR-коду внизу экрана. Ведущему доступно управление этапами, баллами и сбросом.</p><button data-act="copy" data-url="host">Скопировать отдельную ссылку ведущего</button><div class="spacer"></div><div class="micro">Не показывайте ссылку ведущего на общем экране: в ней содержится секрет управления.</div></div></aside></div>';root.innerHTML=b}
function render(){if(!room){landing();if(err)root.insertAdjacentHTML("afterbegin",'<div class="notice warn">'+E(err)+'</div>');qrfooter();return}var banner=err?'<div class="notice warn" style="margin-bottom:12px">'+E(err)+'</div>':'';if(!data){root.innerHTML=banner+'<div class="paper">Подключение к сессии…</div>';qrfooter();return}if(hostToken)hostPage();else if(!playerToken)joinPage();else teamPage();if(err)root.insertAdjacentHTML("afterbegin",banner);qrfooter();document.querySelectorAll("#timer").forEach(function(n){n.textContent=clock(data.deadline)})}
function valueOf(selector){var x=document.querySelector(selector);return x?x.value:""}
document.addEventListener("input",function(e){if(e.target.id==="reason")draftReason=e.target.value;if(e.target.id==="challenge")draftChallenge=e.target.value;if(e.target.name==="answer")draftChoice=e.target.value});
document.addEventListener("change",function(e){if(e.target.name==="answer")draftChoice=e.target.value});
document.addEventListener("click",async function(e){var el=e.target.closest("[data-act]");if(!el)return;var a=el.dataset.act;try{if(a==="create"){el.textContent="Создание комнаты…";el.disabled=true;return action("create")};if(a==="open"){var v=valueOf("#linkinput").trim();if(!v)throw Error("Укажите ссылку.");try{var x=new URL(v);v=x.searchParams.get("room")||v}catch(_){}room=v;history.replaceState(null,"",location.pathname+"?room="+encodeURIComponent(room));await poll();return}if(a==="join")return action("join",{team:Number(el.dataset.team)});if(a==="next"||a==="reveal"||a==="reset"){if(a==="reset"&&!confirm("Удалить команды, баллы и решения этой сессии?"))return;return action(a)}if(a==="evidence")return action("evidence",{doc:el.dataset.id});if(a==="submit"){var r=draftReason.trim(),choice=Number(draftChoice);if(draftChoice===""||r.length<25)throw Error("Выберите квалификацию и напишите обоснование от 25 знаков.");return action("submit",{choice:choice,reason:r})}if(a==="grade")return action("grade",{team:Number(el.dataset.team),delta:Number(el.dataset.delta)});if(a==="challenge-team"){window.challengeTarget=Number(el.dataset.team);alert("Выбрана комиссия "+window.challengeTarget+". Напишите возражение в поле и отправьте.");return}if(a==="send-challenge"){if(!window.challengeTarget)throw Error("Сначала выберите комиссию-соперника.");if(draftChallenge.trim().length<35)throw Error("Возражение должно содержать не меньше 35 знаков.");return action("challenge",{target:window.challengeTarget,text:draftChallenge.trim()})}if(a==="copy"){var val=el.dataset.url==="host"?hostUrl():myUrl();try{await navigator.clipboard.writeText(val);el.textContent="Скопировано"}catch(_){prompt("Скопируйте ссылку:",val)}return}}catch(e){setError(e.message)}});
setInterval(function(){if(room&&!busy)poll()},4500);setInterval(function(){if(data){var z=document.getElementById("timer");if(z)z.textContent=clock(data.deadline)}},1000);poll();
})();
</script></body></html>
