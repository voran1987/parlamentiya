function roleCard(id,brief=false){const rr=R[id];let occupied=SEATS[id]&&SEATS[id].pid!==PID, mine=SEATS[id]?.pid===PID;return `<div class="role" style="--role:${rr.c}"><div class="spread"><h3><span class="flag">${rr.flag}</span>${rr.n}</h3>${MODE!=='landing'?tag(mine?'Вы':occupied?'Занято':'Свободно',mine?'ok':''):''}</div><p>${rr.goal}</p>${MODE==='join'&&!brief?`<div style="margin-top:12px">${btn(mine?'Вернуться в роль':occupied?'Занято':'Выбрать делегацию','role','primary',`data-id="${id}" ${occupied?'disabled':''}`)}</div>`:''}</div>`}

function join(){if(!meta)return `<div class="panel hero"><h1>${initialized?'Комната не найдена':'Подключение…'}</h1><p class="muted">${initialized?'Проверьте код или создайте комнату в окне ведущего.':'Загружаем данные игровой комнаты.'}</p>${btn('На главную','home')}</div>`;return `<div class="stack"><section class="panel"><h2>Выберите делегацию</h2><p class="muted">Роль занимает один смартфон команды. Можно договариваться всей группой.</p><div class="row">${tag('Комната '+CODE)}${tag('Раундов: 6')}${tag('Команд: '+meta.n)}</div>${joinErr?`<p class="danger">${esc(joinErr)}</p>`:''}</section><section class="rolegrid">${active().map(id=>roleCard(id)).join('')}</section></div>`}
function lobby(){return `<div class="stack"><section class="panel hero"><div class="eyebrow">Организация семинара</div><h1>КНР: баланс сил</h1><p class="lead">Разделите группу на команды. Раздайте делегациям QR или код и подключите отдельный экран проектора.</p>${modeNotice()}</section><div class="layout"><div class="col"><section class="panel">${roomLink()}</section><section class="panel"><h2>Делегации</h2><p class="mini">Подключено ${active().filter(id=>SEATS[id]).length} из ${active().length}</p><div class="rolegrid">${active().map(id=>`<div class="role" style="--role:${R[id].c}"><h3>${R[id].flag} ${R[id].n}</h3>${tag(SEATS[id]?'● На связи':'○ Ожидаем',SEATS[id]?'ok':'')}</div>`).join('')}</div><div style="margin-top:12px">${btn('Освободить роли','release','ghost')}</div></section></div><div class="col"><section class="panel"><h2>Настройки</h2><div class="stack" style="margin:15px 0"><label>Число делегаций <select class="select" id="teamcount">${[4,5,6].map(n=>`<option value="${n}" ${meta.n===n?'selected':''}>${n}</option>`).join('')}</select></label><label>Переговоры <select class="select" id="talksec">${[60,90,120,180].map(n=>`<option value="${n}" ${S.talk===n?'selected':''}>${n} секунд</option>`).join('')}</select></label><label>Выступление делегации <select class="select" id="speechsec">${[30,45,60,90].map(n=>`<option value="${n}" ${S.speech===n?'selected':''}>${n} секунд</option>`).join('')}</select></label></div><div class="hintbox">Один раунд: событие → переговоры → выступления → тайный выбор → раскрытие. При отсутствии телефона ведущий выбирает за команду.</div><div style="margin-top:15px">${btn('Начать игру','start','primary')}</div></section><section class="panel"><h2>Три исхода</h2><p>Многосторонний компромисс, управляемое соперничество или острый кризис. Итог определяют решения делегаций, а не случайный кубик.</p><details><summary>Как считаются показатели</summary>${mechanics()}</details></section></div></div></div>`}
function mechanics(){return `<p class="mini">Все показатели находятся в диапазоне 0–10. Событие и выборы команд изменяют пять шкал, совместные решения дают дополнительные эффекты. Изменение шкалы за раунд ограничено ±2.</p><p class="mini"><b>Кризис:</b> напряжённость ≥ 8 и безопасность ≤ 4. <b>Компромисс:</b> напряжённость ≤ 3, дипломатия ≥ 7 и торговля ≥ 5. Иначе — управляемое соперничество. Проверка после 6-го раунда.</p><p class="mini">Очки делегации: 4 базовых + нормированное влияние изменения шкал на её интересы (приблизительно от −5 до +5) + 2 за выполнение секретного мандата. Для баланса асимметричных ролей США, Индия, ЕС и АСЕАН получают +1 корректирующий балл в 1-м, 3-м и 5-м раундах. До награды за речь максимум 10. Лучшая речь +2. В конце — бонус за сценарный исход. Правила и веса открыты в коде.</p>`}
function intro(){return `<div class="stack"><section class="panel hero"><div class="eyebrow">Вступление · перед первым раундом</div><h1>Мировая политика — это выбор</h1><div class="hero-ornament"></div><p class="lead">2027 год в альтернативном учебном сценарии. Крупные державы соперничают за влияние, технологии и безопасность. Ни одна страна не может полностью игнорировать остальных.</p><p class="mini">История и результаты условны. Это модель политических дилемм, а не прогноз событий.</p></section><div class="layout"><section class="panel"><h2>Правила семинара</h2><ol style="font-size:17px;line-height:1.9"><li>Обсудите кризис и договоритесь о предложениях.</li><li>Выступите от имени делегации. Возможны обещания и дипломатический торг.</li><li>Тайно выберите одно из трёх решений со смартфона.</li><li>Ведущий раскроет решения и покажет изменения пяти показателей.</li><li>В конце шести раундов состоится разбор исхода.</li></ol>${isHost()?btn('Перейти к первому кризису','begin','primary'):''}</section><section class="panel"><h2>Открытые интересы сторон</h2><div class="stack">${active().map(id=>`<div><b>${R[id].flag} ${R[id].n}</b><div class="mini">${R[id].goal}</div></div>`).join('')}</div></section></div></div>`}
function scoreBoard(){const calcScores=aggregate(S?.hist||[],active(),S?.stage==='reveal'?S.result:null);const list=active().sort((a,b)=>calcScores[b].base-calcScores[a].base);return `<section class="panel"><div class="kicker">Рейтинг делегаций</div>${list.map((id,i)=>`<div class="rank ${i===0&&calcScores[id].base>0?'first':''}"><span class="mini">${i+1}</span><div><strong>${R[id].flag} ${R[id].n}</strong><div class="tiny">Баллы решений и выступлений</div></div><span class="pts">${calcScores[id].base}</span></div>`).join('')}</section>`}
function gaugeBox(){let s=S.stage==='reveal'&&S.result?S.result.after:stateBefore(),prev=S.stage==='reveal'&&S.result?S.result.before:s;return `<section class="panel"><div class="kicker">Состояние международной системы</div>${G.map(([k,title,sub,color])=>{let diff=s[k]-prev[k],klass=k==='T'?(diff>0?'bad':'good'):(diff>0?'good':'bad');return `<div class="stat"><div class="stathead"><div><b>${title}</b><div class="mini">${sub}</div></div><strong>${s[k]}${diff?`<span class="delta ${klass}">${signed(diff)}</span>`:''}</strong></div><div class="bar" style="--bar:${color}"><i style="width:${s[k]*10}%"></i></div></div>`}).join('')}</section>`}
function stateMap(){return `<section class="panel"><div class="kicker">Карта глобальной напряжённости</div>${plot(states())}</section>`}
function eventBox(){const e=EVD[S.r];return `<section class="panel hero"><div class="spread"><span class="eyebrow">Раунд ${S.r+1} / ${TOTAL} · 2027 · учебный сценарий</span><div class="steps">${EVD.map((_,i)=>`<span class="step ${i<S.r?'done':i===S.r?'active':''}"></span>`).join('')}</div></div><div class="eventtitle">${e.t}</div><span class="eventtag">${e.theory}</span><p class="eventtext">${e.story}</p><div class="news">${e.news}</div><div class="mini"><b>Вопрос политолога:</b> ${e.q}</div></section>`}
function teamDecisions(host=false){let picks=picksNow();return `<section class="panel"><div class="spread"><h2>Решения делегаций</h2>${tag(readyCount()+' / '+active().length+' принято',readyCount()===active().length?'ok':'warn')}</div><div class="rolegrid" style="margin-top:14px">${active().map(id=>{let c=picks[id],role=R[id],e=EVD[S.r],mine=MODE==='player'&&ME===id;let canChoose=S.stage==='choose'&&(host||mine);let visible=S.stage==='reveal';return `<div class="role" style="--role:${role.c}"><div class="spread"><h3>${role.flag} ${role.n}</h3>${tag(c===undefined||c===null?'Ждём':'Решение принято',c===undefined?'':'ok')}</div>${visible?`<p><b>${esc(e.action[id][c])}</b></p><p class="mini">Раунд: +${S.result?.scores[id]?.points||0} очков</p>`:canChoose?`<div class="choose">${e.action[id].map((s,i)=>`<button class="option ${c===i?'selected':''}" data-act="pick" data-id="${id}" data-i="${i}"><strong>${i+1}. ${esc(s)}</strong><small>${['Сотрудничество и общие правила','Осторожная стратегия и самостоятельность','Усиление давления и демонстрация позиции'][i]}</small></button>`).join('')}</div>`:`<p class="mini">${c===undefined?'Ожидает тайное решение':'Решение скрыто до раскрытия ведущим'}</p>`}</div>`}).join('')}</div>${isHost()&&S.stage==='choose'?`<div style="margin-top:15px">${btn('Раскрыть решения','reveal','primary',readyCount()<active().length?'disabled':'')}${readyCount()<active().length?`<span class="mini" style="margin-left:9px">Заполните решения всех делегаций (вручную или с телефонов).</span>`:''}</div>`:''}</section>`}
function discussion(){let step=S.stage;let a=speakOrder();if(step==='talk')return `<section class="panel"><div class="kicker">Фаза 1 · Кулуарные переговоры</div><h2>Ищите партнёров</h2><div class="counter" id="countdown">${fmt(timerLeft())}</div><p class="muted">Команды обсуждают условия сотрудничества. Можно вести переговоры о разных решениях, но итоговый выбор каждой делегации остаётся тайным.</p>${isHost()?`<div class="row">${btn(S.deadline?'Перезапустить таймер':'Запустить таймер','timer','gold')}${btn('Начать выступления','tospeech','primary')}</div>`:''}</section>`;
 if(step==='speech'){let at=a[S.speaker]||null;return `<section class="panel"><div class="kicker">Фаза 2 · Публичные выступления</div><h2>Слово делегациям</h2><div class="smallgrid" style="margin-top:12px">${a.map((id,i)=>`<div class="role" style="--role:${R[id].c};padding:8px"><b>${R[id].flag} ${R[id].n}</b><div class="mini">${i<S.speaker?'Выступила':i===S.speaker?'Выступает':'Ожидает'}</div></div>`).join('')}</div>${at?`<div class="speaker" style="margin-top:12px"><div class="kicker">Сейчас выступает</div><h2>${R[at].flag} ${R[at].n}</h2><div class="counter" id="countdown">${fmt(timerLeft())}</div><p>Объясните, чего вы добиваетесь, предложите партнёрам соглашение и предупредите о неприемлемых условиях.</p></div>`:`<div class="hintbox" style="margin-top:14px">Ведущий по очереди предоставляет слово каждой команде.</div>`}${isHost()?`<div class="row" style="margin-top:12px">${btn(S.speaker<0?'Первое выступление':S.speaker>=a.length-1?'Завершить выступления':'Следующая делегация','nextspeaker','primary')}${btn('Пропустить выступления','tochoose')}</div>`:''}</section>`}
 if(step==='choose')return `<section class="panel"><div class="kicker">Фаза 3 · Тайный выбор</div><h2>Решения принимаются сейчас</h2><p class="muted">Каждая делегация выбирает стратегию на своём смартфоне. Ведущий видит лишь готовность команд, но не их решения до раскрытия.</p>${isHost()?`<div class="hintbox">Если команда без телефона — её решение можно указать вручную в карточке ниже.</div><div style="margin-top:12px">${speakerVoteUI()}</div>`:''}</section>`;
 if(step==='reveal')return `<section class="panel"><div class="kicker">Фаза 4 · Результаты</div><h2>Решения раскрыты</h2><p class="muted">Шкалы изменились с учётом всех решений и дипломатических сочетаний. Обратите внимание: отдельно взятый выбор не всегда определяет итог.</p>${isHost()?btn(S.r===TOTAL-1?'Завершить игру':'Следующий раунд','next','primary'):''}</section>`;
 return ''}
function speakerVoteUI(){const vs=getVoteCounts();return `<div class="kicker">Лучшая речь · +2 очка</div><div class="row" style="margin:10px 0">${active().map(id=>btn(R[id].flag+' '+R[id].n+' · '+vs[id],'best',S.best===id?'gold':'',`data-id="${id}"`)).join('')}${S.best?btn('Снять выбор','bestclear','ghost'):''}</div><div class="mini">Студенты могут голосовать с телефонов (не за себя). Ведущий назначает лучшую речь, учитывая голосование.</div>`}
function effects(){const r=S.result;if(!r)return '';return `<section class="panel"><div class="kicker">Итог раунда</div><h2>${EVD[r.r].t}</h2><div class="smallgrid" style="margin-top:10px">${G.map(([k,t],i)=>`<div class="hintbox"><div class="mini">${t}</div><b style="font:600 26px var(--display)">${r.after[k]}</b><div class="mini">${signed(r.diff[i])} за раунд</div></div>`).join('')}</div><details><summary>Почему изменились шкалы? Полный расчёт</summary><div class="overlay"><table><tr><th>Причина</th>${G.map(x=>`<th>${x[1]}</th>`).join('')}</tr>${r.sources.map(x=>`<tr><td>${esc(x.label)}</td>${x.d.map(v=>`<td>${signed(v)}</td>`).join('')}</tr>`).join('')}<tr><th>Сумма до ограничения</th>${r.raw.map(v=>`<th>${signed(v)}</th>`).join('')}</tr><tr><th>Фактическое изменение</th>${r.diff.map(v=>`<th>${signed(v)}</th>`).join('')}</tr></table></div><p class="mini">За один раунд шкала меняется не более чем на 2 пункта. Граничные значения 0 и 10.</p></details><details><summary>Очки каждой делегации</summary><div class="overlay"><table><tr><th>Команда</th><th>База</th><th>Изменение шкал</th><th>Мандат</th><th>Баланс</th><th>Речь</th><th>Итого</th></tr>${active().map(id=>{const s=r.scores[id];return `<tr><td>${R[id].n}</td><td>4</td><td>${signed(s.impact)}</td><td>+${s.mission}</td><td>+${s.compensation}</td><td>+${s.speech}</td><td><b>${s.points}</b></td></tr>`}).join('')}</table></div><p class="mini">Очки до добавления речи ограничены диапазоном 0–10.</p></details></section>`}
function player(){if(!meta||!S)return `<section class="panel"><h2>Подключение…</h2></section>`;if(!ME||!active().includes(ME))return join();const e=EVD[S.r]||EVD[0],role=R[ME];const choose=S.stage==='choose',cur=(CHOICES[S.r]||{})[ME];let phaseTitle={lobby:'Ожидаем начало',intro:'Введение',talk:'Кулуарные переговоры',speech:'Публичные выступления',choose:'Примите решение',reveal:'Результаты раунда',final:'Итоги игры'}[S.stage];let picks=EVD[S.r]?.action[ME]||[];return `<div class="stack" style="max-width:780px;margin:auto"><section class="role" style="--role:${role.c};padding:20px"><div class="eyebrow">Делегация · комната ${CODE}</div><h2 style="font:700 42px var(--display);margin:5px 0">${role.flag} ${role.n}</h2><p>${role.goal}</p><div class="row">${tag(phaseTitle,'ok')}${S.stage==='final'?'':tag('Раунд '+(S.r+1)+' / '+TOTAL)}</div></section>${S.stage==='lobby'?`<section class="panel"><h2>Вы подключены</h2><p class="muted">Дождитесь начала игры. Команда будет голосовать с этого устройства.</p></section>`:''}${S.stage==='intro'?`<section class="panel"><h2>Ваша цель</h2><p>${role.goal}</p><p class="muted">Переговоры и публичные заявления не гарантируют реализацию обещаний. В каждом раунде решение тайное.</p></section>`:''}${['talk','speech','choose','reveal'].includes(S.stage)?`<section class="panel"><div class="kicker">Событие ${S.r+1}: ${e.theory}</div><h2 style="font-size:33px;margin:7px 0">${e.t}</h2><p class="eventtext">${e.story}</p><div class="introcard"><div class="kicker">Закрытый мандат вашей делегации</div><p>Дополнительные <b>2 очка</b>, если выбран вариант № ${e.missions[ME]+1}: <b>${e.action[ME][e.missions[ME]]}</b>.</p><p class="mini">Мандат — подсказка, а не приказ. Другой вариант может принести больше очков по главным интересам.</p></div></section>`:''}${S.stage==='talk'?`<section class="panel"><h2>Обсудите стратегию</h2><p class="muted">Встретьтесь с другими командами. Вы можете обещать поддержку, но решение позже будет тайным.</p><div class="counter" id="countdown">${fmt(timerLeft())}</div></section>`:''}${S.stage==='speech'?`<section class="panel"><h2>Публичные заявления</h2><p class="muted">Убедите другие стороны. Очки за лучшую речь начислит ведущий.</p><div class="counter" id="countdown">${fmt(timerLeft())}</div>${speakOrder()[S.speaker]===ME?tag('Ваша очередь!','ok'):tag('Дождитесь своей очереди')}</section>`:''}${choose?`<section class="panel"><h2>Ваше тайное решение</h2><p class="muted">Только после раскрытия все увидят, какой вариант был принят. До этого можно изменить выбор.</p><div class="choose">${picks.map((label,i)=>`<button class="option ${cur===i?'selected':''}" data-act="pick" data-id="${ME}" data-i="${i}"><strong>${i+1}. ${esc(label)}</strong><small>${['Сотрудничество','Осторожная стратегия','Давление'][i]}</small></button>`).join('')}</div>${cur!==undefined?`<p class="success">✓ Решение принято. Можно изменить до раскрытия.</p>`:''}<details><summary>Проголосовать за лучшую речь (не свою)</summary><div class="smallgrid" style="margin-top:9px">${active().filter(id=>id!==ME).map(id=>btn(R[id].flag+' '+R[id].n,'vote',VOTES[S.r]?.[PID]===id?'gold':'',`data-id="${id}"`)).join('')}</div></details></section>`:''}${S.stage==='reveal'?`<section class="panel"><h2>Решения раскрыты</h2><p><b>Вы выбрали:</b> ${esc(e.action[ME][S.result.picks[ME]])}</p><p>Очки за раунд: <b>${S.result.scores[ME].points}</b> (за мандат +${S.result.scores[ME].mission}, за речь +${S.result.scores[ME].speech}).</p></section>${gaugeBox()}`:''}${S.stage==='final'?`<section class="panel"><div class="kicker">Итоги шести раундов</div><h2>${O[outcome(S.hist.at(-1).after)].t}</h2>${finalTable(true)}</section>`:''}<div class="mini">Роль занята этим устройством. Для освобождения делегации обратитесь к ведущему.</div></div>`}
function hostGame(){return `<div class="stack"><section class="spread"><div><div class="eyebrow">Комната ${CODE} · ${isHost()?'ведущий':'экран проектора'}</div><h1 style="font-size:39px">${GAME}</h1><div class="progress" style="max-width:260px;margin-top:9px">${Array.from({length:TOTAL},(_,i)=>`<span class="${i<S.r?'done':i===S.r?'active':''}"></span>`).join('')}</div></div><div class="row">${isHost()?btn('QR и код','showqr'):''}${isHost()?btn('Экран проектора','screen'):''}</div></section>${showJoin?`<section class="panel">${roomLink()}</section>`:''}<div class="layout"><div class="col">${eventBox()}${discussion()}${S.stage==='choose'||S.stage==='reveal'?teamDecisions(isHost()):''}${S.stage==='reveal'?effects():''}</div><div class="col">${gaugeBox()}${stateMap()}${scoreBoard()}</div></div></div>`}
let showJoin=false;
function finalTable(compact=false){let h=S.hist,o=outcome(h.at(-1).after),acc=aggregate(h,active()),list=active().map(id=>{let bonus=finalBonus(id,o,h.at(-1).after);return {id,base:acc[id].base,bonus,sum:acc[id].base+bonus}}).sort((a,b)=>b.sum-a.sum);return `<div class="overlay"><table><tr><th>Место</th><th>Делегация</th><th>За раунды</th><th>Бонус</th><th>Итого</th></tr>${list.map((v,i)=>`<tr><td>${i+1}</td><td>${R[v.id].flag} ${R[v.id].n}</td><td>${v.base}</td><td>+${v.bonus}</td><td><b>${v.sum}</b></td></tr>`).join('')}</table></div>`}
function finalPage(){let last=S.hist.at(-1),o=outcome(last.after);return `<div class="stack"><section class="panel hero"><div class="eyebrow">Итог · шесть раундов</div><div class="win ${O[o].cls}">${O[o].t}</div><p class="lead">${O[o].d}</p><div class="row" style="margin-top:14px">${isHost()?btn('Скачать отчёт CSV','csv','gold'):''}${isHost()?btn('Сыграть ещё раз','reset','primary'):''}</div></section><div class="layout"><div class="col"><section class="panel"><h2>Итоговый рейтинг</h2><p class="mini">Важна не только сумма очков, но и аргументация делегаций.</p>${finalTable()}</section><section class="panel"><h2>История решений</h2><div class="overlay"><table><tr><th>Раунд</th>${active().map(id=>`<th>${R[id].n}</th>`).join('')}</tr>${S.hist.map(h=>`<tr><td>${h.r+1}. ${EVD[h.r].t}</td>${active().map(id=>`<td>${esc(EVD[h.r].action[id][h.picks[id]])}</td>`).join('')}</tr>`).join('')}</table></div></section><section class="panel"><h2>Вопросы для разбора</h2><ol><li>Какие переговоры реально повлияли на выборы команд, а какие остались риторикой?</li><li>Когда экономическая взаимозависимость сдерживала конфликт, а когда усиливала уязвимость?</li><li>Как проявлялись реализм, либеральный институционализм и конструктивизм?</li><li>Была ли экономическая сила КНР эквивалентна дипломатическому влиянию?</li><li>Что происходило с интересами России, Индии, ЕС и АСЕАН при соперничестве Пекина и Вашингтона?</li></ol><p class="mini">Итог игры нельзя автоматически переносить на реальную мировую политику.</p></section></div><div class="col">${gaugeBox()}<section class="panel"><div class="kicker">Траектория шести раундов</div>${plot(states())}</section><section class="panel"><h2>Принципы расчёта</h2>${mechanics()}</section></div></div></div>`}
function resetBox(){return `<section class="panel"><h2>Создать новую игру?</h2><p>Текущая комната будет возвращена к настройкам. Итоги незавершённой партии исчезнут из этой комнаты. Если хотите сохранить результаты, сначала выгрузите CSV.</p><div class="row">${btn('Сохранить CSV','csv')}${btn('Да, начать заново','resetyes','primary')}${btn('Отмена','resetno')}</div></section>`}
let confirmReset=false;
function render(){if(!document.getElementById('app'))return;let content;if(!CODE)content=landing();else if(MODE==='join')content=join();else if(MODE==='player')content=player();else if(!meta||!S)content=`<section class="panel"><h2>${initialized?'Комната не найдена':'Подключение к комнате…'}</h2><p>${esc(error||'')}</p>${btn('На главную','home')}</section>`;else if(confirmReset&&isHost())content=resetBox();else if(S.stage==='lobby')content=lobby();else if(S.stage==='intro')content=intro();else if(S.stage==='final')content=finalPage();else content=hostGame();
 document.getElementById('app').innerHTML=header()+(error?`<div class="hintbox" style="border-color:var(--red);margin:12px 0">${esc(error)}</div>`:'')+content+`<footer class="footer"><span>Учебная игра «КНР: баланс сил» · 2026</span><span>Условные сценарии; показатели — модельные, не эмпирические данные</span></footer>`;qrLater();}
function tick(){const el=document.getElementById('countdown');if(el&&S){const s=timerLeft();el.textContent=fmt(s);if(!s)el.style.color='var(--red)'}}
setInterval(tick,450);
async function action(a,b){try{switch(a){
 case'create':await create();break;
 case'home':CODE='';MODE='landing';history.pushState(null,'',base);unsubscribe();DB=null;meta=null;S=null;render();break;
 case'enter':await enter(document.getElementById('code')?.value,document.getElementById('isscreen')?.checked);break;
 case'role':await selectRole(b.dataset.id);break;
 case'start':{const n=Number(document.getElementById('teamcount')?.value)||6,t=Number(document.getElementById('talksec')?.value)||90,sp=Number(document.getElementById('speechsec')?.value)||45;meta={...meta,n};S={...fresh(n,t,sp),stage:'intro'};await DB.set('meta',meta);await persist();break}
 case'begin':setStage('talk',{r:0,deadline:0});break;
 case'timer':startTimer(S.talk);break;
 case'tospeech':setStage('speech',{speaker:-1,deadline:0});break;
 case'nextspeaker':{let next=S.speaker+1;if(next>=active().length){setStage('choose',{speaker:next,deadline:0})}else{setStage('speech',{speaker:next,deadline:Date.now()+S.speech*1000})}break}
 case'tochoose':setStage('choose',{speaker:-1,deadline:0});break;
 case'pick':await pick(b.dataset.id,Number(b.dataset.i));break;
 case'vote':await vote(b.dataset.id);break;
 case'best':S.best=b.dataset.id;await persist();break;
 case'bestclear':S.best=null;await persist();break;
 case'reveal':await reveal();break;
 case'next':await nextRound();break;
 case'copyjoin':await navigator.clipboard.writeText(urlJoin());break;
 case'screen':window.open(urlScreen(),'_blank','noopener');break;
 case'showqr':showJoin=!showJoin;render();break;
 case'release':await releaseSeats();break;
 case'reset':confirmReset=true;render();break;
 case'resetno':confirmReset=false;render();break;
 case'resetyes':confirmReset=false;S=fresh(meta.n,S.talk,S.speech);await DB.set('choices',null);await DB.set('votes',null);await persist();break;
 case'csv':exportReport();break;
 } }catch(e){failure('Ошибка: '+e.message)}}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();action(b.dataset.act,b)}});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')action('enter',e.target)});
window.addEventListener('popstate',()=>location.reload());
render();window.addEventListener('load',qrLater);if(CODE)connect();
</script></body></html>
