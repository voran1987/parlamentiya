<style>

:root{
  color-scheme:dark;
  --bg:#0a1422;
  --bg2:#101f34;
  --bg3:#11263c;
  --panel:#122033cc;
  --panel-strong:#14263c;
  --panel-soft:#10202fb0;
  --line:#2d4460;
  --line-soft:#36516f80;
  --text:#eef4fb;
  --muted:#9fb3c8;
  --muted2:#7f95ad;
  --red:#f06d63;
  --gold:#e4c27a;
  --green:#7ec7aa;
  --blue:#7ea9e6;
  --cyan:#7fd2e7;
  --shadow:0 26px 70px rgba(1,8,20,.45);
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --font:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:var(--text);font:14px/1.6 var(--font);background:
radial-gradient(circle at 12% 8%,rgba(41,79,128,.36),transparent 24%),
radial-gradient(circle at 88% 18%,rgba(34,104,122,.20),transparent 20%),
radial-gradient(circle at 78% 82%,rgba(171,80,69,.18),transparent 20%),
linear-gradient(180deg,#0b1320 0%,#0b1727 38%,#0a1422 100%);
position:relative;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:-1}
body::before{background-image:linear-gradient(rgba(127,210,231,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(127,210,231,.045) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(circle at center,black,transparent 88%);opacity:.35}
body::after{background:linear-gradient(110deg,transparent 0 15%,rgba(228,194,122,.035) 48%,transparent 52% 100%)}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
a{color:var(--blue)}
.shell{width:min(1520px,100% - 34px);margin:0 auto;padding:26px 0 52px}
.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:18px 20px 22px;margin-bottom:20px;border:1px solid var(--line-soft);border-radius:22px;background:linear-gradient(180deg,rgba(17,31,49,.88),rgba(11,22,35,.74));backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.mark{display:grid;place-items:center;min-width:68px;height:68px;padding:0 10px;border-radius:18px;border:1px solid rgba(228,194,122,.35);background:linear-gradient(160deg,rgba(228,194,122,.16),rgba(240,109,99,.18));font:700 30px var(--display);letter-spacing:.04em;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.17em;font-size:11px;font-weight:800}
.brandname{font:700 clamp(27px,4vw,36px)/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.muted{color:var(--muted)} .mini{font-size:12px;color:var(--muted)} .tiny{font-size:11px;color:var(--muted2)}
.status{border:1px solid var(--line);border-radius:999px;padding:7px 12px;display:inline-flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);background:rgba(8,16,28,.55)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 16px rgba(126,199,170,.8)} .dot.local{background:var(--gold);box-shadow:0 0 16px rgba(228,194,122,.8)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:16px}.col{display:grid;gap:16px;align-content:start}
.layout{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(340px,.92fr);gap:18px}.subgrid-2,.smallgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.subgrid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.rolegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.panel{position:relative;overflow:hidden;min-width:0;padding:20px;border-radius:22px;border:1px solid var(--line-soft);background:linear-gradient(180deg,rgba(19,34,54,.92),rgba(12,24,39,.88));box-shadow:var(--shadow);backdrop-filter:blur(10px)}
.panel::before{content:'';position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.05),transparent 30%);pointer-events:none}
.panel.soft{background:linear-gradient(180deg,rgba(16,31,48,.72),rgba(10,20,32,.72))}
.panel h2,.panel h3,h1{position:relative;z-index:1;margin:0;font-family:var(--display);line-height:1.08;text-transform:uppercase;letter-spacing:.02em}
.panel h2{font-size:29px}.panel h3{font-size:21px}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.sectionhead p{margin:6px 0 0}
.hero{padding:0;background:linear-gradient(145deg,rgba(15,29,48,.96),rgba(11,22,35,.94));border-radius:26px}
.hero-inner{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(290px,.82fr);gap:18px;align-items:stretch;padding:26px}
.hero-copy h1{font-size:clamp(40px,5.4vw,72px);margin:6px 0 12px}.hero .lead{font-size:16px;color:#d3deec;max-width:66ch}.hero-ornament{height:5px;width:108px;border-radius:999px;background:linear-gradient(90deg,var(--gold),var(--red));margin:18px 0 16px}.hero p{margin:10px 0 0}
.worldframe{position:relative;min-height:290px;border-radius:22px;border:1px solid rgba(126,169,230,.18);background:radial-gradient(circle at 50% 20%,rgba(126,210,231,.16),transparent 34%),linear-gradient(180deg,rgba(7,17,28,.94),rgba(12,24,39,.82));overflow:hidden;padding:14px}
.worldframe::before{content:'';position:absolute;inset:10px;border:1px solid rgba(126,210,231,.12);border-radius:18px;pointer-events:none}
.worldcap{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px;color:var(--muted);font-size:12px}
.worldcap strong{color:var(--text);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.map-svg,.event-svg{width:100%;height:auto;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(28,45,68,.92);color:var(--text);font-weight:700;text-decoration:none;transition:transform .15s,background .15s,border-color .15s,box-shadow .15s;box-shadow:0 10px 26px rgba(0,0,0,.18)}
.btn:hover{transform:translateY(-1px);border-color:#93a9c4;background:rgba(49,69,97,.96)}
.btn.primary{background:linear-gradient(135deg,#d67266,#b9554d);border-color:#cc6d61;color:#fff}.btn.primary:hover{background:linear-gradient(135deg,#e07b70,#c55d56)}
.btn.gold{background:linear-gradient(135deg,#dcb867,#b9923c);border-color:#e4c27a;color:#111827}.btn.ghost{background:rgba(9,17,28,.35)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.role{position:relative;border-radius:18px;border:1px solid rgba(126,169,230,.17);background:linear-gradient(180deg,rgba(18,31,49,.92),rgba(13,23,37,.92));padding:16px;overflow:hidden}
.role::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--role)}
.rolehead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.role h3{font:600 24px/1.05 var(--display);margin:0}.role p{margin:7px 0 0;color:#ccdae8;font-size:13px}.flag{font-size:28px;margin-right:8px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--role);font-weight:800}.rolemeta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.roleicon{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04);display:grid;place-items:center;font-size:22px}
.kicker{color:var(--gold);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.16em}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:11px;color:var(--muted);background:rgba(8,16,28,.45)} .pill.ok{border-color:rgba(126,199,170,.55);color:var(--green)} .pill.warn{border-color:rgba(228,194,122,.5);color:var(--gold)}
.code{font:700 clamp(46px,7vw,76px)/.95 var(--display);letter-spacing:.16em;color:var(--gold)}
.joinbox{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:center}.qr{min-height:168px;min-width:168px;display:grid;place-items:center;background:#fff;border-radius:16px;padding:8px;color:#101723;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.codeinput,.select{background:rgba(14,24,38,.95);border:1px solid var(--line);color:var(--text);border-radius:14px}.codeinput{font:700 30px var(--display);text-align:center;text-transform:uppercase;width:128px;padding:7px 10px;letter-spacing:.13em}.select{padding:10px 12px}
.notice,.linktext{overflow-wrap:anywhere;color:var(--blue);font-size:12px}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:14px}.stats-strip .strip-card{padding:12px 14px;border-radius:16px;border:1px solid var(--line-soft);background:rgba(255,255,255,.03)}.stats-strip strong{display:block;font:600 28px var(--display)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.metric-card{padding:15px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.02));min-width:0}.metric-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:12px}.metric-main{display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center}.metric-ring{width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--deg),rgba(255,255,255,.08) 0);padding:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}.metric-ring::before{content:'';grid-area:1/1;background:linear-gradient(180deg,#0f1d2f,#13273b);border-radius:50%;width:100%;height:100%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}.metric-ring span{grid-area:1/1;position:relative;z-index:1;font:700 28px var(--display)}.metric-meta h3{font-size:20px;margin:0 0 4px}.meter{width:100%;height:10px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.07);margin:9px 0 7px}.meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent),white 18%))}.delta-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;border:1px solid rgba(255,255,255,.08)}.delta-chip.good{color:var(--green);border-color:rgba(126,199,170,.35);background:rgba(126,199,170,.08)}.delta-chip.bad{color:var(--red);border-color:rgba(240,109,99,.33);background:rgba(240,109,99,.08)}.delta-chip.neutral{color:var(--gold);border-color:rgba(228,194,122,.33);background:rgba(228,194,122,.08)}
.event-wrap{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(270px,.82fr);gap:16px;align-items:stretch}.event-title{font:700 clamp(30px,4vw,52px)/1.05 var(--display);text-transform:uppercase;margin:8px 0 10px}.event-tag{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(228,194,122,.35);background:rgba(63,54,40,.52);color:var(--gold);border-radius:999px;padding:4px 11px;font-size:12px;margin:6px 0 12px}.eventtext{font-size:16px;color:#d7e1ee}.news{border:1px solid rgba(126,169,230,.22);border-left:4px solid var(--red);padding:12px 14px;background:rgba(21,34,51,.8);border-radius:16px;margin:14px 0 10px;color:#dbe6f3}.event-visual{border-radius:20px;border:1px solid rgba(126,169,230,.18);background:radial-gradient(circle at 50% 12%,rgba(127,210,231,.12),transparent 30%),linear-gradient(180deg,rgba(8,18,29,.98),rgba(17,30,47,.88));padding:14px;position:relative;overflow:hidden}.event-visual::after{content:'';position:absolute;inset:auto -30% -40% auto;width:240px;height:240px;background:radial-gradient(circle,rgba(255,255,255,.12),transparent 66%);opacity:.18}.visual-note{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:11px;color:var(--muted)}
.phase-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin:12px 0 16px}.phase-card{padding:13px;border-radius:16px;border:1px solid var(--line-soft);background:rgba(255,255,255,.03)}.phase-card.active{border-color:rgba(228,194,122,.52);box-shadow:0 0 0 1px rgba(228,194,122,.2) inset;background:rgba(228,194,122,.06)}.phase-card.done{border-color:rgba(126,199,170,.44);background:rgba(126,199,170,.06)}.phase-card h4{font:600 18px var(--display);margin:0 0 4px;text-transform:uppercase}.counter{font:700 clamp(56px,8vw,78px)/1 var(--display);color:var(--gold);text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 10px}.clock{font:700 34px var(--display);color:var(--gold)}
.choose{display:grid;grid-template-columns:1fr;gap:10px}.option{border:1px solid rgba(126,169,230,.18);background:linear-gradient(180deg,rgba(31,49,75,.96),rgba(24,37,57,.96));border-radius:16px;text-align:left;padding:14px 15px;display:grid;gap:5px;color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.15)}.option:hover{border-color:rgba(228,194,122,.55);background:linear-gradient(180deg,rgba(45,63,92,.96),rgba(26,38,58,.96))}.option.selected{border-color:rgba(126,199,170,.6);background:linear-gradient(180deg,rgba(24,70,67,.92),rgba(21,51,51,.92))}.option strong{font-size:14px}.option small{color:var(--muted);font-size:12px}
.decision-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.decision-card{padding:16px;border-radius:18px;border:1px solid rgba(255,255,255,.06);background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.015))}.decision-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:10px}.decision-status{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.08)}.decision-status.ready{color:var(--green);border-color:rgba(126,199,170,.35);background:rgba(126,199,170,.08)}.decision-status.wait{color:var(--gold);border-color:rgba(228,194,122,.32);background:rgba(228,194,122,.08)}
.rank{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.06)}.rank:last-child{border-bottom:0}.rank strong{font:600 24px var(--display)}.rank .pts{font:700 32px var(--display)}.rank.first{background:linear-gradient(90deg,rgba(228,194,122,.16),transparent);padding-left:10px;border-left:3px solid var(--gold);border-radius:0 14px 14px 0}.rankidx{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);font-size:12px;color:var(--muted)}
.linechart{display:block;width:100%;height:auto}.linechart text{font-family:var(--font);fill:#a9b9ca;font-size:11px}.map-stack{display:grid;gap:14px}.briefing{padding:14px;border-radius:16px;border:1px solid rgba(126,169,230,.16);background:rgba(255,255,255,.025)}
.overlay{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid rgba(126,169,230,.18);padding:8px 9px;text-align:left;vertical-align:top}th{color:var(--gold);background:#1f3047}td{color:#d6e0ea}details{margin-top:10px}summary{cursor:pointer;color:var(--gold);font-weight:700}
.introcard,.hintbox{padding:13px 15px;border-radius:16px;border:1px solid rgba(126,169,230,.18);background:rgba(26,45,69,.8);color:#cce0f5}.introcard{border-left:4px solid var(--gold)}
.progress,.steps{display:flex;gap:5px;flex-wrap:wrap}.progress span,.step{height:8px;flex:1;min-width:18px;background:#30455f;border-radius:999px}.progress span.active,.step.active{background:var(--gold)}.progress span.done,.step.done{background:var(--green)}
.win{font:700 clamp(40px,6vw,68px)/1 var(--display);text-transform:uppercase;color:var(--gold);margin:0 0 10px}.danger{color:var(--red)}.success{color:var(--green)}
.footer{border-top:1px solid rgba(126,169,230,.16);margin-top:28px;padding-top:14px;color:#7f95ad;font-size:11px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.listreset{margin:0;padding-left:18px}.listreset li{margin:8px 0}
@media(max-width:1100px){.layout,.hero-inner,.event-wrap{grid-template-columns:1fr}.shell{width:min(100% - 20px,1100px)}.worldframe{min-height:240px}}
@media(max-width:720px){.panel{padding:16px}.topline{padding:16px}.joinbox{grid-template-columns:1fr}.qr{min-width:130px;min-height:130px}.code{font-size:52px}.metric-main{grid-template-columns:72px 1fr}.metric-ring{width:72px;height:72px}.brandname{font-size:24px}.mark{min-width:58px;height:58px;font-size:25px}}

</style>

<style>

.photo-panel{position:relative;overflow:hidden;border-radius:20px;border:1px solid #39516d;background:linear-gradient(145deg,#14243b,#102034);min-height:305px;display:flex;flex-direction:column}

function geoFocus(){
 const playing=!!(S&&['talk','speech','choose','reveal'].includes(S.stage));
 if(!playing)return {cx:445,cy:220,w:800,h:470,spots:['Пекин','Нью-Дели','Тайваньский пролив','Южно-Китайское море','Сингапур']};

 const xy=geoProject(loc[0][0],loc[0][1]);return {cx:xy[0],cy:xy[1],w:loc[1],h:loc[2],spots:ROUND_FOCUS[i].spots};

function geoPins(spots){return MAP_PLACES.filter(p=>spots.includes(p.name)).map((p,i)=>{const [x,y]=geoProject(p.lng,p.lat);const col=p.type==='sea'?'#7bd0e1':p.type==='route'||p.type==='resource'?'#e8c478':'#ec8274';return `<g class="geo-pin" data-map-spot="${encodeURIComponent(p.name)}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(p.name)}: ${esc(p.text)}"><circle r="15" fill="${col}" fill-opacity=".17"/><circle r="7.5" fill="${col}" stroke="#f1f5fa" stroke-width="2.5"/><text x="12" y="-11" fill="#f9fbff" font-size="13" font-weight="700" stroke="#0b1929" stroke-width="3" paint-order="stroke">${esc(p.name)}</text></g>`}).join('')}
function clampView(v){const w=Math.min(800,Math.max(165,v.w)),h=Math.min(470,Math.max(105,v.h)),x=Math.min(800-w,Math.max(0,v.x)),y=Math.min(470-h,Math.max(0,v.y));return {x,y,w,h}}
function applyGeoView(el,v){const svg=el.querySelector('svg.geo-svg');if(!svg)return;v=clampView(v);svg.setAttribute('viewBox',`${v.x.toFixed(2)} ${v.y.toFixed(2)} ${v.w.toFixed(2)} ${v.h.toFixed(2)}`);el._view=v}
function mountMaps(){
 document.querySelectorAll('.real-map-shell').forEach(el=>{
  if(el.dataset.bound)return;el.dataset.bound='1';
  const f=geoFocus();let v=clampView({x:f.cx-f.w/2,y:f.cy-f.h/2,w:f.w,h:f.h});
  el.innerHTML=`<div class="geo-stage" aria-label="Политическая карта Азии, географические границы Natural Earth"><svg class="geo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" aria-label="Реальная политико-географическая карта Азии" role="img"><rect x="0" y="0" width="800" height="470" fill="#102c41"/>${GEO_GRID}${GEO_LAND}${GEO_LABELS}${geoPins(f.spots)}</svg></div><div class="geo-controls" aria-label="Масштаб карты"><button data-geo-action="in" aria-label="Увеличить карту">+</button><button data-geo-action="out" aria-label="Уменьшить карту">−</button><button data-geo-action="reset" aria-label="Обзор региона">⤢</button></div><div class="geo-tooltip" aria-live="polite">Нажмите на метку для справки</div><div class="geo-watermark">Natural Earth · географические границы · 1:110m</div>`;
  applyGeoView(el,v);const map=el.querySelector('svg.geo-svg');
  el.addEventListener('click',e=>{
   const act=e.target.closest('[data-geo-action]');if(act){const a=act.dataset.geoAction,z=el._view;
    if(a==='reset'){applyGeoView(el,{x:0,y:0,w:800,h:470})}
    else{let factor=a==='in'?.75:1.33, w=z.w*factor,h=z.h*factor;applyGeoView(el,{x:z.x+(z.w-w)/2,y:z.y+(z.h-h)/2,w,h})}
    return;
   }
   const pin=e.target.closest('[data-map-spot]');if(pin){const name=decodeURIComponent(pin.dataset.mapSpot);const loc=MAP_PLACES.find(p=>p.name===name);if(loc)el.querySelector('.geo-tooltip').textContent=`${loc.name} — ${loc.text}`}
  });
  el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const pin=e.target.closest('[data-map-spot]');if(!pin)return;e.preventDefault();const loc=MAP_PLACES.find(p=>p.name===decodeURIComponent(pin.dataset.mapSpot));if(loc)el.querySelector('.geo-tooltip').textContent=`${loc.name} — ${loc.text}`});
  let drag=null;
  map.addEventListener('pointerdown',e=>{if(e.target.closest('[data-map-spot]'))return;drag={x:e.clientX,y:e.clientY,v:{...el._view}};map.setPointerCapture?.(e.pointerId)});
  map.addEventListener('pointermove',e=>{if(!drag)return;const r=map.getBoundingClientRect();const dx=(e.clientX-drag.x)*drag.v.w/r.width,dy=(e.clientY-drag.y)*drag.v.h/r.height;applyGeoView(el,{...drag.v,x:drag.v.x-dx,y:drag.v.y-dy})});
  map.addEventListener('pointerup',()=>{drag=null});map.addEventListener('pointercancel',()=>{drag=null});
  map.addEventListener('wheel',e=>{e.preventDefault();const z=el._view,factor=e.deltaY<0?.88:1.12,w=z.w*factor,h=z.h*factor;applyGeoView(el,{x:z.x+(z.w-w)/2,y:z.y+(z.h-h)/2,w,h})},{passive:false});
 });
}

function mechanics(){return `<p class="mini">Все показатели находятся в диапазоне 0–10. Событие и решения делегаций изменяют пять стратегических индикаторов; некоторые комбинации решений дают дополнительный синергетический эффект. За один раунд любая шкала меняется максимум на 2 пункта.</p><p class="mini"><b>Кризис:</b> напряжённость ≥ 8 и безопасность ≤ 4. <b>Компромисс:</b> напряжённость ≤ 3, дипломатия ≥ 7 и торговля ≥ 5. Во всех остальных случаях игра завершится сценарием управляемого соперничества.</p><p class="mini">Очки делегации: 4 базовых + влияние изменений шкал на её интересы + 2 за выполнение скрытого мандата. Для баланса асимметричных ролей США, Индия, ЕС и АСЕАН получают +1 корректирующий балл в 1-м, 3-м и 5-м раундах. Лучшая речь приносит +2, а в конце добавляется бонус за общий исход.</p>`}

 if(!ME||!active().includes(ME))return join();
 const e=EVD[S.r]||EVD[0],role=R[ME];const choose=S.stage==='choose',cur=(CHOICES[S.r]||{})[ME];let phaseTitle={lobby:'Ожидаем начало',intro:'Введение',talk:'Кулуарные переговоры',speech:'Публичные выступления',choose:'Примите решение',reveal:'Результаты раунда',final:'Итоги игры'}[S.stage];let picks=EVD[S.r]?.action[ME]||[];
 return `<div class="stack" style="max-width:920px;margin:auto"><section class="role" style="--role:${role.c};padding:22px"><div class="rolehead"><div><div class="eyebrow">Делегация · комната ${CODE}</div><h2 style="font:700 44px var(--display);margin:6px 0">${role.flag} ${role.n}</h2></div><div class="roleicon">${roleGlyph(ME)}</div></div><p>${role.goal}</p><div class="row">${tag(phaseTitle,'ok')}${S.stage==='final'?'':tag('Раунд '+(S.r+1)+' / '+TOTAL)}${tag('Дипломатический интерфейс')}</div></section>${S.stage==='lobby'?`<section class="panel"><h2>Вы подключены</h2><p class="muted">Дождитесь начала игры. Это устройство закреплено за вашей делегацией.</p></section>`:''}${S.stage==='intro'?`<section class="panel">${sectionHead('Ваша роль','Позиция делегации','Держите в фокусе свои интересы, но учитывайте реакцию других игроков.') }<p>${role.goal}</p><p class="muted">Публичные заявления не гарантируют реализацию обещаний. Итоговое решение каждый раунд принимается тайно.</p></section>`:''}${['talk','speech','choose','reveal'].includes(S.stage)?`<section class="panel hero"><div class="hero-inner event-wrap"><div class="hero-copy"><div class="kicker">Событие ${S.r+1}: ${e.theory}</div><div class="event-title">${e.t}</div><p class="eventtext">${e.story}</p><div class="introcard"><div class="kicker">Закрытый мандат вашей делегации</div><p>Дополнительные <b>2 очка</b>, если выбран вариант № ${e.missions[ME]+1}: <b>${e.action[ME][e.missions[ME]]}</b>.</p><p class="mini">Мандат — ориентир, а не приказ. Другой вариант может лучше соответствовать вашим стратегическим интересам.</p></div></div><div>${eventVisual(S.r)}</div></div></section>`:''}${S.stage==='talk'?`<section class="panel">${sectionHead('Фаза переговоров','Обсудите стратегию','Согласуйте коалиции, обменяйтесь сигналами и оцените пределы уступок.') }<div class="counter" id="countdown">${fmt(timerLeft())}</div></section>`:''}${S.stage==='speech'?`<section class="panel">${sectionHead('Фаза выступлений','Сформулируйте публичную позицию','Лучшая речь может принести бонус вашей делегации.')}<div class="counter" id="countdown">${fmt(timerLeft())}</div>${speakOrder()[S.speaker]===ME?tag('Ваша очередь','ok'):tag('Дождитесь своей очереди')}</section>`:''}${choose?`<section class="panel">${sectionHead('Тайное решение','Выберите стратегию делегации','До раскрытия ведущим вы можете изменить свой выбор.') }<div class="choose">${picks.map((label,i)=>`<button class="option ${cur===i?'selected':''}" data-act="pick" data-id="${ME}" data-i="${i}"><strong>${i+1}. ${esc(label)}</strong><small>${STRAT_FAMILY[i]}</small></button>`).join('')}</div>${cur!==undefined?`<p class="success">✓ Решение принято. При необходимости его можно изменить до раскрытия.</p>`:''}<details><summary>Проголосовать за лучшую речь (не свою)</summary><div class="smallgrid" style="margin-top:9px">${active().filter(id=>id!==ME).map(id=>btn(R[id].flag+' '+R[id].n,'vote',VOTES[S.r]?.[PID]===id?'gold':'',`data-id="${id}"`)).join('')}</div></details></section>`:''}${S.stage==='reveal'?`<section class="panel">${sectionHead('Решения раскрыты','Ваш результат в раунде','Можно соотнести свой выбор с изменениями международной системы.') }<p><b>Вы выбрали:</b> ${esc(e.action[ME][S.result.picks[ME]])}</p><p>Очки за раунд: <b>${S.result.scores[ME].points}</b> (мандат +${S.result.scores[ME].mission}, речь +${S.result.scores[ME].speech}).</p></section>${gaugeBox()}`:''}${S.stage==='final'?`<section class="panel"><div class="kicker">Итоги шести раундов</div><h2>${O[outcome(S.hist.at(-1).after)].t}</h2>${finalTable(true)}</section>`:''}<div class="mini">Роль закреплена за этим устройством. Для освобождения делегации обратитесь к ведущему.</div></div>`
}
function hostGame(){
 return `<div class="stack"><section class="panel"><div class="spread"><div><div class="eyebrow">Комната ${CODE} · ${isHost()?'ведущий':'экран проектора'}</div><h1 style="font-size:40px">${GAME}</h1><div class="mini">Дипломатический центр управления партией</div><div class="progress" style="max-width:300px;margin-top:10px">${Array.from({length:TOTAL},(_,i)=>`<span class="${i<S.r?'done':i===S.r?'active':''}"></span>`).join('')}</div></div><div class="row">${isHost()?btn('QR и код','showqr'):''}${isHost()?btn('Экран проектора','screen'):''}</div></div></section>${showJoin?`<section class="panel">${roomLink()}</section>`:''}<div class="layout"><div class="col">${eventBox()}${discussion()}${S.stage==='choose'||S.stage==='reveal'?teamDecisions(isHost()):''}${S.stage==='reveal'?effects():''}</div><div class="col">${gaugeBox()}${stateMap()}${scoreBoard()}</div></div></div>`
}
let showJoin=false;
function finalTable(compact=false){let h=S.hist,o=outcome(h.at(-1).after),acc=aggregate(h,active()),list=active().map(id=>{let bonus=finalBonus(id,o,h.at(-1).after);return {id,base:acc[id].base,bonus,sum:acc[id].base+bonus}}).sort((a,b)=>b.sum-a.sum);return `<div class="overlay"><table><tr><th>Место</th><th>Делегация</th><th>За раунды</th><th>Бонус за итог</th><th>Итого</th></tr>${list.map((v,i)=>`<tr><td>${i+1}</td><td>${R[v.id].flag} ${R[v.id].n}</td><td>${v.base}</td><td>+${v.bonus}</td><td><b>${v.sum}</b></td></tr>`).join('')}</table></div>`}
function finalPage(){
 let last=S.hist.at(-1),o=outcome(last.after);
 return `<div class="stack"><section class="panel hero"><div class="hero-inner"><div class="hero-copy"><div class="eyebrow">Финал · дипломатическая оценка</div><div class="win ${O[o].cls}">${O[o].t}</div><p class="lead">${O[o].d}</p><div class="row" style="margin-top:14px">${isHost()?btn('Скачать отчёт CSV','csv','gold'):''}${isHost()?btn('Сыграть ещё раз','reset','primary'):''}</div></div><div>${worldPreview('Финальный баланс системы')}</div></div></section><div class="layout"><div class="col"><section class="panel">${sectionHead('Итоговый рейтинг','Кто лучше реализовал свои интересы','Сумма очков отражает эффективность стратегии внутри игровой модели.')}${finalTable()}</section><section class="panel">${sectionHead('История решений','Хронология шести раундов','Можно быстро проследить, как менялась логика делегаций от кризиса к кризису.')}<div class="overlay"><table><tr><th>Раунд</th>${active().map(id=>`<th>${R[id].n}</th>`).join('')}</tr>${S.hist.map(h=>`<tr><td>${h.r+1}. ${EVD[h.r].t}</td>${active().map(id=>`<td>${esc(EVD[h.r].action[id][h.picks[id]])}</td>`).join('')}</tr>`).join('')}</table></div></section><section class="panel">${sectionHead('Вопросы для разбора','Политологический дебрифинг','Используйте их как основу для обсуждения после игры.')}<ol class="listreset"><li>Какие переговоры реально повлияли на решения, а какие остались риторикой?</li><li>Когда экономическая взаимозависимость сдерживала конфликт, а когда превращалась в уязвимость?</li><li>Как проявлялись реализм, либеральный институционализм и конструктивизм?</li><li>Была ли экономическая сила КНР эквивалентна дипломатическому влиянию?</li><li>Что происходило с интересами России, Индии, ЕС и АСЕАН в условиях соперничества Пекина и Вашингтона?</li></ol><p class="mini">Итог игры нельзя напрямую переносить на реальную мировую политику — это аналитическая модель для семинара.</p></section></div><div class="col">${gaugeBox()}${stateMap()}<section class="panel">${sectionHead('Принципы расчёта','Как устроена модель','Для студентов полезно видеть прозрачность игровой механики.')} ${mechanics()}</section></div></div></div>`
}
function resetBox(){return `<section class="panel">${sectionHead('Новая игра','Сбросить текущую комнату','Незавершённая партия будет очищена. Если нужны результаты, сначала сохраните CSV.') }<div class="row">${btn('Сохранить CSV','csv')}${btn('Да, начать заново','resetyes','primary')}${btn('Отмена','resetno')}</div></section>`}
let confirmReset=false;
function render(){if(!document.getElementById('app'))return;disposeMaps();let content;if(!CODE)content=landing();else if(MODE==='join')content=join();else if(MODE==='player')content=player();else if(!meta||!S)content=`<section class="panel"><h2>${initialized?'Комната не найдена':'Подключение к комнате…'}</h2><p>${esc(error||'')}</p>${btn('На главную','home')}</section>`;else if(confirmReset&&isHost())content=resetBox();else if(S.stage==='lobby')content=lobby();else if(S.stage==='intro')content=intro();else if(S.stage==='final')content=finalPage();else content=hostGame();
 document.getElementById('app').innerHTML=header()+(error?`<div class="hintbox" style="border-color:var(--red);margin:12px 0">${esc(error)}</div>`:'')+content+`<footer class="footer"><span>Учебная игра «КНР: баланс сил» · 2026</span><span>Сценарии условные · фотографии: Wikimedia Commons (кредиты на фото) · карта: © OpenStreetMap</span></footer>`;qrLater();mountMaps();}
function tick(){const el=document.getElementById('countdown');if(el&&S){const s=timerLeft();el.textContent=fmt(s);if(!s)el.style.color='var(--red)'}}
setInterval(tick,450);
async function action(a,b){try{switch(a){
 case'create':await create();break;
 case'home':CODE='';MODE='landing';history.pushState(null,'',base);unsubscribe();DB=null;meta=null;S=null;render();break;
 case'enter':await enter(document.getElementById('code')?.value,document.getElementById('isscreen')?.checked);break;
 case'role':await selectRole(b.dataset.id);break;
 case'start':{const n=Number(document.getElementById('teamcount')?.value)||6,t=Number(document.getElementById('talksec')?.value)||90,sp=Number(document.getElementById('speechsec')?.value)||45;meta={...meta,n};S={...fresh(n,t,sp),stage:'intro'};await DB.set('meta',meta);await persist();break}
 case'begin':setStage('talk',{r:0,deadline:0});break;
 case'timer':startTimer(S.talk);break;
 case'tospeech':setStage('speech',{speaker:-1,deadline:0});break;
 case'nextspeaker':{let next=S.speaker+1;if(next>=active().length){setStage('choose',{speaker:next,deadline:0})}else{setStage('speech',{speaker:next,deadline:Date.now()+S.speech*1000})}break}
 case'tochoose':setStage('choose',{speaker:-1,deadline:0});break;
 case'pick':await pick(b.dataset.id,Number(b.dataset.i));break;
 case'vote':await vote(b.dataset.id);break;
 case'best':S.best=b.dataset.id;await persist();break;
 case'bestclear':S.best=null;await persist();break;
 case'reveal':await reveal();break;
 case'next':await nextRound();break;
 case'copyjoin':await navigator.clipboard.writeText(urlJoin());break;
 case'screen':window.open(urlScreen(),'_blank','noopener');break;
 case'showqr':showJoin=!showJoin;render();break;
 case'release':await releaseSeats();break;
 case'reset':confirmReset=true;render();break;
 case'resetno':confirmReset=false;render();break;
 case'resetyes':confirmReset=false;S=fresh(meta.n,S.talk,S.speech);await DB.set('choices',null);await DB.set('votes',null);await persist();break;
 case'csv':exportReport();break;
 } }catch(e){failure('Ошибка: '+e.message)}}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){e.preventDefault();action(b.dataset.act,b)}});
document.getElementById('app').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')action('enter',e.target)});
window.addEventListener('popstate',()=>location.reload());
render();window.addEventListener('load',qrLater);if(CODE)connect();
</script></body></html>
