<link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Source+Sans+3:wght@400;600;700&display=swap">
<style id="sty">/* Layout: shared casino table. Host runs the game, students watch the same table on their phones. Single dark felt look by choice. */
:root{color-scheme:dark;--felt:#0B3A2C;--felt2:#0F4A38;--felt3:#082A20;--ink:#F4EFE0;--mute:#A9C2B5;--gold:#D9B45A;--gold2:#8F7230;--red:#B3262E;--black:#17181A;--line:#2C6A55;
--t0:#D9B45A;--t1:#E5736B;--t2:#6FB3D9;--t3:#9BD16F;--t4:#C99BE0;--t5:#F0A15A;
--serif:"Playfair Display",Georgia,"Times New Roman",serif;--sans:"Source Sans 3","Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
body{background:var(--felt);background-image:radial-gradient(120% 80% at 50% 0%,var(--felt2),var(--felt) 60%,var(--felt3));background-attachment:fixed;color:var(--ink);font-family:var(--sans);font-size:16px;padding-inline:16px;padding-block:16px 32px;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--felt3);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-weight:600}
button:hover{border-color:var(--gold)}
button:disabled{opacity:.45;cursor:default;border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.gold{background:var(--gold);color:#241B05;border-color:var(--gold)}
button.gold:hover{background:#E6C273}
button.red{background:var(--red);border-color:var(--red)}
input,select{font:inherit;background:var(--felt3);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.brand{font-size:clamp(26px,4vw,40px);font-weight:900;font-style:italic;color:var(--gold)}
.sub{color:var(--mute);font-size:14px}
.tag{font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
/* setup */
.setup{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:860px){.setup{grid-template-columns:1.1fr .9fr}}
.card{background:rgba(8,42,32,.72);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.deck{text-align:left;padding:14px;border-radius:12px;display:flex;flex-direction:column;gap:4px}
.deck.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.deck b{font-family:var(--serif);font-size:20px}
.deck span{font-weight:400;color:var(--mute);font-size:14px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.rules li::marker{color:var(--gold)}
/* table */
.table{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
@media(min-width:900px){.table{grid-template-columns:minmax(0,440px) 1fr}}
.wheelbox{display:flex;flex-direction:column;align-items:center;gap:12px}
.wheelwrap{position:relative;width:min(440px,100%);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:28px solid var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.legend{display:grid;grid-template-columns:1fr;gap:4px;width:100%;font-size:15px}
.legend div{display:flex;gap:10px;align-items:center;padding:4px 8px;border-radius:8px}
.legend .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--red);color:var(--ink);flex:none}
.legend div:nth-child(even) .n{background:var(--black)}
.legend .cur{background:rgba(217,180,90,.18);outline:1px solid var(--gold)}
.legend .left{margin-left:auto;color:var(--mute);font-size:13px;white-space:nowrap}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.dealer{background:rgba(8,42,32,.72);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.odds{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--serif);font-weight:900;font-size:clamp(28px,4vw,40px);color:var(--gold)}
.odds small{font-family:var(--sans);font-weight:600;font-size:14px;color:var(--mute)}
.ctx{background:rgba(0,0,0,.22);border-radius:12px;padding:14px 16px;font-size:clamp(16px,2vw,20px);line-height:1.5}
.ctx b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.q{font-family:var(--serif);font-weight:700;font-size:clamp(22px,3.2vw,32px);line-height:1.25;text-wrap:balance}
.ans{background:var(--gold);color:#241B05;border-radius:12px;padding:14px 18px;font-family:var(--serif);font-weight:700;font-size:clamp(20px,2.8vw,28px);line-height:1.35}
.note{background:rgba(217,180,90,.14);border:1px solid var(--gold2);border-radius:10px;padding:8px 12px;font-size:14px}
.hint{color:var(--mute);font-size:14px}
/* teams */
.rack{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.team{background:rgba(8,42,32,.8);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team.lead{border-color:var(--gold)}
.tname{font-weight:700;overflow-wrap:anywhere;display:flex;gap:8px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.bank{font-family:var(--serif);font-weight:900;font-size:30px;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-wrap:wrap;gap:3px;min-height:20px}
.chip{width:20px;height:20px;border-radius:50%;border:3px dashed rgba(255,255,255,.75);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.bet{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.qb{display:flex;flex-wrap:wrap;gap:5px}
.qb button{padding:5px 9px;font-size:14px}
.qb button.sel{background:var(--gold);color:#241B05;border-color:var(--gold)}
.betv{font-variant-numeric:tabular-nums;font-weight:700}
.mark{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mark button{padding:8px 0;font-size:18px}
.mark .w.on{background:#2F8A57;border-color:#2F8A57}
.mark .l.on{background:var(--red);border-color:var(--red)}
.pos{color:#8EE0A9;font-weight:700}.neg{color:#F19A9A;font-weight:700}
.podium{display:flex;flex-direction:column;gap:8px}
.podium div{display:flex;gap:12px;align-items:baseline;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.22);font-size:20px}
.podium div:first-child{background:var(--gold);color:#241B05}
.podium .p{font-family:var(--serif);font-weight:900;font-size:26px;width:34px}
.podium .c{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
</style>

<script id="qdata">const DECKS=[{"name":"Демократия","sub":"Сравнительная политология: модели, измерение, волны, откат","D":{"cats":["Понятия\nи подходы","Модели\nдемократии","Измерение\nдемократии","Условия\nдемократии","Волны\nи транзиты","Кризис\nи откат"],"catsFlat":["Понятия и подходы","Модели демократии","Измерение демократии","Условия демократии","Волны и транзиты","Кризис и откат"],"q":[[{"tag":"Афины, V в. до н. э.","ctx":"Граждане Афин собираются на холме Пникс и голосуют по законам и войне сами, без представителей. Решения принимаются большинством голосов, многие должности распределяют жребием.","q":"Какая это форма демократии?"},{"tag":"Геттисберг, 1863","ctx":"19 ноября 1863 года Авраам Линкольн на открытии кладбища в Геттисберге говорит о правлении, которое не исчезнет с земли.","q":"Как звучит его формула демократии?"},{"tag":"Швейцария","ctx":"В Швейцарии граждане выбирают парламент, а ещё регулярно голосуют на референдумах по законам и поправкам к конституции и могут выдвигать народную инициативу.","q":"Какие формы демократии здесь сочетаются?"},{"tag":"Минимальное определение","ctx":"Исследователь считает страну демократией, если там проходят свободные конкурентные выборы. О свободе СМИ и независимости судов он ничего не выясняет.","q":"Какое понимание демократии он использует?"}],[{"tag":"Даль, 1971","ctx":"Роберт Даль различает идеал демократии и реальные режимы, в которых действуют выборные власти, свободные выборы, свобода слова и право создавать объединения.","q":"Как Даль назвал такие реальные режимы?"},{"tag":"Великобритания","ctx":"Партия, получившая около 40% голосов, формирует однопартийное правительство с большинством мест. Две крупные партии сменяют друг друга у власти, кабинет сильнее парламента.","q":"Какая модель по Лейпхарту здесь показана?"},{"tag":"Нидерланды и Бельгия","ctx":"Выборы идут по пропорциональной системе, в парламенте много партий, правительства создаются как коалиции. Важные решения принимают, договариваясь с представителями разных групп.","q":"Какая модель по Лейпхарту здесь показана?"},{"tag":"Шумпетер, 1942","ctx":"Избиратели раз в несколько лет выбирают между конкурирующими группами политиков. В промежутке решения принимают профессионалы, а граждане в них не участвуют.","q":"Какая это модель демократии?"}],[{"tag":"Freedom House","ctx":"Американская организация ежегодно ставит странам баллы за политические права и гражданские свободы и на этой основе присваивает им статус.","q":"Какие три статуса она использует?"},{"tag":"The Economist","ctx":"Economist Intelligence Unit оценивает страны по шкале от 0 до 10 по пяти группам показателей: выборы и плюрализм, работа правительства, участие, политическая культура, гражданские свободы.","q":"Какие четыре типа режимов выделяет индекс?"},{"tag":"V-Dem, Гётеборг","ctx":"Проект из Гётеборга опирается на оценки тысяч экспертов по странам и делит режимы на четыре типа, от самого закрытого до самого демократичного.","q":"Назовите эти четыре типа."},{"tag":"Polity","ctx":"По шкале Polity одна страна получает +9, другая −8. Шкала идёт от −10 до +10.","q":"Что означают эти оценки?"}],[{"tag":"Липсет, 1959","ctx":"Липсет сравнивает страны по доходу, образованию и урбанизации и показывает: чем богаче и образованнее общество, тем выше шансы на устойчивую демократию.","q":"Как называется эта теория?"},{"tag":"Алмонд и Верба, 1963","ctx":"Исследователи опрашивают жителей США, Великобритании, ФРГ, Италии и Мексики о доверии к власти, интересе к политике и готовности участвовать в ней.","q":"Какое понятие они вводят?"},{"tag":"Италия, Патнэм","ctx":"После региональной реформы 1970 года северные области Италии с давними кооперативами и ассоциациями управляются заметно лучше южных.","q":"Какой фактор объясняет разницу по Патнэму?"},{"tag":"Мур, 1966","ctx":"Баррингтон Мур сравнивает Англию, Францию, США, Китай, Японию и Индию. Исход зависит от того, как соотносятся силы крестьянства, землевладельцев и городских классов.","q":"Какая формула приписывается Муру?"}],[{"tag":"Хантингтон, 1991","ctx":"Хантингтон выделяет периоды, когда число демократий в мире быстро растёт, и периоды отката, когда часть из них возвращается к авторитаризму.","q":"Сколько волн демократизации он насчитал?"},{"tag":"Лиссабон, 1974","ctx":"25 апреля 1974 года офицеры свергают в Лиссабоне авторитарный режим. Солдаты и горожане выходят на улицы с гвоздиками.","q":"Как называется событие и какую волну оно открыло?"},{"tag":"О'Доннелл и Шмиттер, 1986","ctx":"Исследователи описывают переход от диктатуры к демократии как последовательность: кризис режима, переговоры элит, первые свободные выборы, закрепление новых правил.","q":"Как называется этот подход?"},{"tag":"Каротерс, 2002","ctx":"Многие страны, пережившие переходы 1990-х, не стали ни устойчивыми демократиями, ни закрытыми диктатурами. Выборы проходят, но власть почти не меняется.","q":"Как называют такие режимы?"}],[{"tag":"Закария, 1997","ctx":"В стране проходят выборы, но правительство ограничивает права меньшинств, а суды и СМИ работают под давлением. Фарид Закария описал этот случай в статье для Foreign Affairs.","q":"Какой термин он предложил?"},{"tag":"Откат демократии","ctx":"Правящая партия честно побеждает на выборах, затем меняет правила: подчиняет суды, усиливает контроль над СМИ, меняет избирательные округа.","q":"Как называется этот процесс?"},{"tag":"Левицки и Зиблатт, 2018","ctx":"В книге «Как умирают демократии» авторы пишут, что сегодня демократии чаще разрушают избранные лидеры, а не военные перевороты. Защищают их неписаные нормы.","q":"Назовите две такие нормы."},{"tag":"Поляризация","ctx":"Партии воспринимают друг друга не как оппонентов, а как врагов. Победа на выборах кажется вопросом выживания, поэтому правила игры легко нарушают.","q":"Какой фактор отката показан в примере?"}]],"final":{"tag":"Выборы без демократии","ctx":"В стране регулярно проходят выборы с несколькими партиями, но оппозиция почти не имеет доступа к СМИ, судьи зависят от власти, а правящая партия не меняется десятилетиями.","q":"К какому типу режимов по V-Dem относится страна и чем он отличается от электоральной демократии?"},"spare":{"tag":"Токвиль, 1835","ctx":"В 1830-е годы французский аристократ едет в США, изучает тюрьмы, а пишет о равенстве условий и об опасности «тирании большинства».","q":"Кто это и как называется его книга?"}}},{"name":"Россия-цивилизация","sub":"Основы российской государственности","D":{"cats":["Понятия\nи подходы","Русская\nмысль","Государство\nи институты","Исторические\nоснования","Ценности","Мыслители\nи термины"],"catsFlat":["Понятия и подходы","Русская мысль","Государство и институты","Исторические основания","Ценности","Мыслители и термины"],"q":[[{"tag":"Данилевский, 1869","ctx":"В книге «Россия и Европа» автор утверждает, что человечество не едино: существует ряд самобытных типов, и каждый проходит рождение, расцвет и упадок.","q":"Как называется его теория?"},{"tag":"Хантингтон, 1993","ctx":"Американский политолог пишет, что после холодной войны главные линии разломов в мире пройдут не между идеологиями, а между культурными общностями.","q":"Как называется его концепция?"},{"tag":"Тойнби","ctx":"Британский историк объясняет рост цивилизации тем, как творческое меньшинство отвечает на трудности среды и внешние угрозы.","q":"Какую формулу он использует?"},{"tag":"Шпенглер, 1918","ctx":"Немецкий философ описывает культуры как организмы, которые проходят весну, лето, осень и зиму. Последнюю стадию он называет цивилизацией.","q":"Как называется книга и в чём её главная мысль?"}],[{"tag":"Псков, начало XVI в.","ctx":"Старец псковского монастыря пишет великому князю: два Рима пали, Москва — третий, а четвёртому не бывать.","q":"Как называется эта идея и кто её автор?"},{"tag":"Леонтьев, 1875","ctx":"Мыслитель видит силу России в сплаве византийского православия и самодержавия и призывает беречь «цветущую сложность».","q":"Как называется его работа?"},{"tag":"Эмиграция, 1920-е","ctx":"Н. Трубецкой и П. Савицкий считают Россию не частью Европы и не частью Азии, а особым миром, связанным общей историей и географией.","q":"Как называется это направление?"},{"tag":"Гумилёв","ctx":"Историк-этнолог объясняет подъёмы и упадки этносов избытком или нехваткой особой энергии, которая действует в течение примерно полутора тысяч лет.","q":"Какой термин он ввёл?"}],[{"tag":"Парламент","ctx":"В России регионы представлены в парламенте дважды: через выборы депутатов Государственной думы и через верхнюю палату, куда входят представители субъектов федерации.","q":"Как называется верхняя палата парламента?"},{"tag":"Конституция, 1993","ctx":"Конституция 1993 года называет носителем суверенитета и единственным источником власти в России «… народ Российской Федерации».","q":"Какое слово пропущено?"},{"tag":"Российская империя","ctx":"С 1808 по 1917 год в одной из северо-западных областей Российской империи действовал особый порядок управления: собственные органы власти и законы.","q":"Какая это область?"},{"tag":"Поправки 2020 года","ctx":"Поправки 2020 года закрепили за русским языком статус языка «… народа, входящего в многонациональный союз равноправных народов».","q":"Какое слово пропущено?"}],[{"tag":"Днепр, Х век","ctx":"Киевский князь принимает веру из Византии, и жителей города массово крестят в реке.","q":"Как называется это событие и в каком году оно произошло?"},{"tag":"Осень 1480 года","ctx":"Осенью 1480 года войска Ивана III и хана Ахмата стоят друг против друга на реке и расходятся без решающей битвы.","q":"Как называется событие и что оно значило?"},{"tag":"Москва, 1613","ctx":"После Смутного времени Земский собор избирает нового царя. Так начинается новая династия.","q":"Кого избрали на царство?"},{"tag":"Санкт-Петербург, 1721","ctx":"После окончания Северной войны Сенат и Синод преподносят Петру I новые титулы, которые меняют название государства.","q":"Как изменился статус государства?"}],[{"tag":"Константа","ctx":"Одна из пяти ценностных констант российской цивилизации — сохранение своего  else{const d=qd(),o=odds(c),topic=c.final?'Финальный вопрос':deck().catsFlat[c.ci];
  p=`<div class="dealer"><div class="tag">${esc(topic)}</div><div class="odds">Выплата ${o} к 1<small>${c.final?'ва-банк':'карта ведущего'}</small></div>`;
  if(S.notes.length&&S.phase==='bet')p+=S.notes.map(n=>`<div class="note">${esc(n)}</div>`).join('');
  if(S.phase==='bet')p+=`<div class="hint">Команды делают ставки, вопрос пока скрыт.</div>${teacher?'<div><button class="gold" data-a="reveal">Принять ставки и показать вопрос</button></div>':''}`;
  else{p+=`<div class="ctx"><b>Кейс · ${esc(d.tag)}</b>${esc(d.ctx)}</div><div class="q">${esc(d.q)}</div>`;
   if(S.show)p+=`<div class="ans">${esc(S.ans)}</div>`;
   else if(teacher)p+=`<div><button class="gold" data-a="answer">Показать ответ</button></div>`;
   if(S.show&&S.phase==='question'&&teacher){const bs=S.teams.filter(t=>t.bet>0),ok=bs.every(t=>t.res);p+=`<div class="hint">${bs.length?'Отметьте результат у команд, сделавших ставку.':'Ставок не было.'}</div><div><button class="gold" data-a="settle"${ok?'':' disabled'}>Рассчитать ставки</button></div>`}
   if(S.phase==='question'&&!teacher&&!S.show)p+='<div class="hint">Ведущий покажет ответ и рассчитает ставки.</div>';
   if(S.phase==='result'&&teacher)p+=`<div><button class="gold" data-a="next">${c.final?'Подвести итоги':'Следующий раунд'}</button></div>`}
  p+='</div>'}
 return `<div class="table">${wheel}<div class="panel">${p}</div></div>`}
function rack(){const inGame=S.phase!=='end',mx=Math.max(...S.teams.map(t=>t.chips)),o=S.cur?odds(S.cur):1;
 return `<div class="rack">${S.teams.map((t,i)=>{const stack=Array.from({length:Math.min(10,Math.ceil(t.chips/250))},()=>`<span class="chip" style="background:var(${COLS[i]})"></span>`).join('');let b='';
 if(inGame&&S.phase==='bet'&&teacher)b=`<div class="bet"><div>Ставка: <span class="betv">${fmt(t.bet)}</span></div><div class="qb">${[['Пас',0],['50',50],['100',100],['250',250],['½ банка',Math.floor(t.chips/2)],['Ва-банк',t.chips]].map(([l,v])=>`<button data-a="bet" data-i="${i}" data-v="${v}" class="${t.bet===v&&(l!=='Пас'||t.bet===0)?'sel':''}"${v>t.chips?' disabled':''}>${l}</button>`).join('')}</div><input type="number" min="0" max="${t.chips}" inputmode="numeric" value="${t.bet}" data-a="betin" data-i="${i}" aria-label="Ставка команды ${esc(t.name)}"></div>`;
 else if(inGame&&S.phase==='question'&&S.show&&t.bet>0&&teacher)b=`<div class="bet"><div>Ставка: <span class="betv">${fmt(t.bet)}</span> · выплата ${fmt(t.bet*o)}</div><div class="mark"><button class="w${t.res==='w'?' on':''}" data-a="mark" data-i="${i}" data-v="w" aria-label="Верно">✓ верно</button><button class="l${t.res==='l'?' on':''}" data-a="mark" data-i="${i}" data-v="l" aria-label="Неверно">✗ неверно</button></div></div>`;
 else if(inGame&&(S.phase==='question'||S.phase==='result')&&S.phase!=='result')b=`<div class="hint">${t.bet>0?'Ставка: '+fmt(t.bet):'Пас'}</div>`;
 else if(inGame&&S.phase==='result')b=t.bet>0?`<div class="hint">Ставка ${fmt(t.bet)}: <span class="${t.delta>0?'pos':'neg'}">${t.delta>0?'+':'−'}${fmt(Math.abs(t.delta))}</span></div>`:`<div class="hint">Пас</div>`;
 return `<div class="team${t.chips===mx?' lead':''}"><div class="tname"><span class="dot" style="background:var(${COLS[i]})"></span>${esc(t.name)}</div><div class="bank">${fmt(t.chips)}</div><div class="stack">${stack}</div>${b}</div>`}).join('')}</div>`}
function endScreen(){const r=[...S.teams].sort((a,b)=>b.chips-a.chips);
 return `<div class="card"><h2>Итоги вечера</h2><div class="podium">${r.map((t,i)=>`<div><span class="p">${i+1}</span><span>${esc(t.name)}</span><span class="c">${fmt(t.chips)} фишек</span></div>`).join('')}</div>${teacher?'<div><button class="gold" data-a="new">Сыграть ещё</button></div>':''}</div>`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!teacher||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.a,i=+b.dataset.i,v=b.dataset.v;
 if(a==='deck'){S.deck=i;render()}else if(a==='n-'){S.n=Math.max(2,S.n-1);render()}else if(a==='n+'){S.n=Math.min(6,S.n+1);render()}
 else if(a==='start-game')start();else if(a==='spin')doSpin();else if(a==='bet')setBet(i,v);
 else if(a==='reveal'){S.phase='question';render();publish()}
 else if(a==='answer'){const k=akey();S.ans=ANS[k]||'Ответ не найден';S.show=true;render();publish()}
 else if(a==='mark'){S.teams[i].res=S.teams[i].res===v?null:v;render()}
 else if(a==='settle')settle();else if(a==='next')nextRound();
 else if(a==='new'){S.phase='setup';S.cur=null;S.show=false;S.ans='';render();publish()}});
document.addEventListener('change',e=>{if(!teacher)return;const t=e.target,a=t.dataset.a;if(a==='betin')setBet(+t.dataset.i,t.value);
 else if(a==='start')S.start=+t.value;else if(a==='rounds')S.rounds=+t.value;else if(a==='name')S.names[+t.dataset.i]=t.value});
window.addEventListener('resize',()=>{if($('wheel'))drawWheel()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if($('wheel'))drawWheel()});
render();
(function(){
 const fresh=JSON.parse(JSON.stringify(S));
 try{const k=new URL(location.href).searchParams.get('key');if(k){localStorage.setItem('koleso_key',k);history.replaceState(null,'',location.pathname)}fbKey=localStorage.getItem('koleso_key');if(/[?&]view=1/.test(location.search))fbKey=null}catch(e){}
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||typeof firebase==='undefined'){teacher=true;try{const sv=localStorage.getItem(LK);if(sv)S=JSON.parse(sv)}catch(e){}diag='локальный режим: игра только на этом устройстве';render();return}
 try{firebase.initializeApp(cfg);db=firebase.database()}catch(e){diag='нет связи с базой';render();return}
 teacher=!!fbKey;let first=true;diag=teacher?'ведущий, синхронизация включена':'просмотр';render();
 db.ref('koleso/json').on('value',snap=>{let o=null;try{o=snap.val()?JSON.parse(snap.val()):null}catch(e){}
  if(teacher){if(first){first=false;if(o&&o.phase)S=o;else{S=fresh;publish()}render()}return}
  if(o&&o.phase)S=o;else S=fresh;render()},()=>{diag='нет доступа к игре';render()})
})();
</script></body></html>
