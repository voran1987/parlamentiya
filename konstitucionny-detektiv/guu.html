:13px 15px;background:#eaf2ec;color:#285541;border-left:4px solid #6b9c7d;border-radius:8px;margin:0 0 15px;font-size:13px;font-weight:650}.guu-edition header{border-bottom-color:#7d9d87}.guu-edition .brandmark{background:#3e6554;border-color:#3e6554;color:#fff}.guu-edition .mode-switch a.current{background:#3e6554}.guu-edition .intro .eyebrow{color:#467660}.guu-edition .demo-link{background:#e5f0e8;border-color:#a4c7aa;color:#315b42}.guu-edition .demo-link:hover{background:#d9eadf}</style><link rel="stylesheet" href="./minigames.css?v=20261119-14"></head><body class="guu-edition"><header><div class="brand"><div class="brandmark" aria-hidden="true">§</div><div><strong>КОНСТИТУЦИОННЫЙ ДЕТЕКТИВ · ГУУ</strong><small>Государственный университет управления · Правоведение и публичная политика</small></div></div><div class="row"><nav class="mode-switch" aria-label="Выбор университета"><a href="./">МЭИ</a><a href="./guu.html" class="current" aria-current="page">ГУУ</a></nav><span id="tag" class="small"></span><button class="slim" id="leave" onclick="leave()" style="display:none">Выйти</button></div></header><main class="wrap" id="app"></main>
<script src="./minigames-guu.js?v=20261119-18"></script><script>
const API='https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/constitutional-detective-guu';
const KEY='sb_publishable_gUO0b5EHdgs_vS39Iqi4pQ_tU-7tPuw';
const BASE='https://voran1987.github.io/parlamentiya/konstitucionny-detektiv/guu.html';
const TEAMS=['Нормотворцы','Муниципальный совет','Цифровые права','Избирательная комиссия','Общественный контроль','Правосудие'];
const STAGES=['brief','investigate','hypothesis','twist','final','results'];
const LABELS=['Получение дела','Сбор доказательств','Версия расследования','Новые обстоятельства','Итоговое заключение','Результаты'];
const MINUTES=[10,25,15,10,25,5];
const QUESTIONS=['Какая первоначальная версия событий была у вашей команды?','Какие новые факты вы обнаружили и какими документами они подтверждаются?','Подтвердилась ли первая версия расследования или её пришлось изменить?','Какие нормы Конституции РФ и отраслевого законодательства применимы?','Каково окончательное юридическое заключение по вашему делу и почему?'];
const invite=new URLSearchParams(location.search).get('join')?.toUpperCase()||'';
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
let auth=invite?(read('detective_guu_team_'+invite)||null):read('detective_guu_host');
if(invite&&auth?.role!=='team')auth=null;
let state=auth?.state||null,working=false,poll=null,error='',elapsedStart=Date.now();
const root=document.getElementById('app'),tag=document.getElementById('tag');
const esc=x=>String(x??'').replace(/[&<>"']/g,y=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[y]));
const val=id=>document.getElementById(id)?.value??'';
function url(){return BASE+'?join='+encodeURIComponent(auth.code)}
function message(e){error=String(e);render()}
async function request(action,opts={}){
 const p={action,...opts};if(action!=='create'&&action!=='join'){p.code=auth.code;p.token=auth.token;}
 const retryable=new Set(['challenge','solveChallenge','cancelChallenge','assistChallenge']);
 for(let attempt=0;attempt<3;attempt++){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(p)});
  const j=await r.json().catch(()=>({error:'Некорректный ответ сервера'}));
  if(r.ok)return j;
  const reason=String(j.error||'Сервер недоступен');
  if(r.status===409&&retryable.has(action)&&attempt<2&&/одновременно|состояние.*изменилось|данные обновились|повторите запрос|повторите действие/i.test(reason)){
   await new Promise(resolve=>setTimeout(resolve,160*(attempt+1)));continue;
  }
  throw Error(reason);
 }
 throw Error('Не удалось согласовать действия команды. Повторите попытку.');
}
function save(a){auth=a;state=a.state;localStorage.setItem(a.role==='host'?'detective_guu_host':'detective_guu_team_'+a.code,JSON.stringify({role:a.role,code:a.code,team:a.team,token:a.token}));render();start();}
async function create(){if(working)return;working=true;try{const a=await request('create');save({role:'host',code:a.code,token:a.token,state:a.state});error=''}catch(e){message(e.message)}finally{working=false}}
async function join(){if(working)return;const team=val('team');if(!team)return message('Выберите команду');working=true;try{
 const a=await request('join',{code:invite,team});save({role:'team',code:a.code,team,token:a.token,state:a.state});error='';
 }catch(e){message(e.message)}finally{working=false}}
async function load(){if(!auth||working)return;try{const a=await request('state');if(JSON.stringify(a.state)!==JSON.stringify(state)){state=a.state;error='';if(trial&&state.stage==='investigate'&&state.case?.activeTrial?.id===trial.id&&!state.case.items[trial.id]?.unlocked)return;trial=null;render()}}catch(e){error=e.message;if(!trial)render()}}
function start(){clearInterval(poll);poll=setInterval(load,3500);load()}
function leave(){if(!confirm('Выйти из кабинета? Сессия и данные команд останутся на сервере.'))return;
 localStorage.removeItem(auth.role==='host'?'detective_guu_host':'detective_guu_team_'+auth.code);
 auth=null;state=null;clearInterval(poll);location.href=BASE;}
async function control(stage){if(working||!confirm('Перейти к этапу «'+LABELS[STAGES.indexOf(stage)]+'»?'))return;working=true;try{const a=await request('control',{stage});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
async function teamAction(kind,id){if(working)return;let text=val(kind+'Text');if(kind==='clue'){if(!confirm('Потратить один жетон на улику?'))return;}else if(!confirm('Это общий ответ команды. После отправки изменить его не сможет никто из участников. Согласовали ответ?'))return;
 working=true;try{const payload={kind,id,text};if(kind==='prepare')payload.answers=QUESTIONS.map((_,i)=>val('answer'+i));const a=await request('act',payload);state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
async function hostAssist(team){
 if(working||!confirm('Открыть документ команде через техническую помощь? Будет списан один жетон, а помощь отмечена в журнале.'))return;
 working=true;try{const a=await request('assistChallenge',{team});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}
}
async function score(t){const x=Number(val('score'+TEAMS.indexOf(t)));if(!Number.isInteger(x)||x<0||x>100)return message('Баллы от 0 до 100');working=true;try{const a=await request('score',{team:t,points:x});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
function render(){
 const expanded=root.querySelectorAll?Array.from(root.querySelectorAll('details.detailscase[open]')).map(x=>x.dataset.case):[];
 const drafts={};

  body+='<div class="panel"><h2>Общий разбор</h2><p>Сравните аргументы всех групп по пяти вопросам. Преподаватель проводит обсуждение и выставляет баллы.</p></div>';
 }
 body+='<div class="panel"><h2>Рейтинг расследований</h2>'+state.teams.map(t=>'<div class="rankingrow"><span class="num">'+String(state.teams.indexOf(t)+1).padStart(2,'0')+'</span><span>'+esc(t.name)+'</span><b>'+Number(state.scores[t.name]||0)+' баллов</b></div>').join('')+'</div>';
 }
 root.innerHTML=intro+body+(trial?miniView():'')+(error?'<div class="danger">'+esc(error)+'</div>':'')+'<div class="footer">Все материалы вымышлены · Конституция Российской Федерации · Учебный симулятор ГУУ</div>';
 if(root.querySelectorAll){
  root.querySelectorAll('details.detailscase').forEach(x=>{if(expanded.includes(x.dataset.case))x.open=true});
  root.querySelectorAll('textarea.field').forEach(x=>{if(drafts[x.id]!==undefined)x.value=drafts[x.id]});
  if(trial)miniMount();
 }
}
function copyUrl(){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url()).then(()=>alert('Ссылка скопирована')).catch(()=>prompt('Ссылка для команд',url()));else prompt('Ссылка для команд',url())}
render();if(auth)start();window.addEventListener('focus',load);
</script></body></html>
