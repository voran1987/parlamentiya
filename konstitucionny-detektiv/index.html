<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#18344c"><title>Конституционный детектив · МЭИ</title>
<style>
:root{--navy:#15354b;--gold:#ba9252;--bg:#f2f5f7;--line:#dbe4ec;--muted:#607384;--ok:#217555;--red:#a63d38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1b3548;font-family:Segoe UI,Arial,sans-serif;font-size:15px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;font-weight:700;background:var(--navy);color:white}button:disabled{opacity:.45;cursor:not-allowed}button.light{background:#edf2f7;color:var(--navy);border:1px solid var(--line)}button.slim{padding:8px 11px;font-size:13px}.full{width:100%}header{background:var(--navy);color:white;padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}header strong{font-size:17px;letter-spacing:.3px}header small{display:block;color:#b9cbd8;font-size:12px;margin-top:5px}header button{background:#ffffff20;border:1px solid #ffffff45}.wrap{max-width:1150px;margin:0 auto;padding:25px 18px 60px}.intro{background:linear-gradient(110deg,#15354b,#38617a);padding:31px;border-radius:16px;color:white;margin-bottom:18px}.intro h1{font-size:clamp(29px,5vw,46px);margin:6px 0 12px}.intro p{line-height:1.6;max-width:700px;color:#e2eaf1}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gold);text-transform:uppercase}.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;margin:14px 0;box-shadow:0 4px 15px #17384b09}.panel h2{margin:0 0 12px;font-size:22px}.muted{color:var(--muted)}.small{font-size:12px}.label{font-size:12px;color:var(--muted);font-weight:800;margin:15px 0 7px;text-transform:uppercase;letter-spacing:.5px}.cols{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{border:1px solid var(--line);background:white;border-radius:12px;padding:17px}.card h3{font-size:16px;margin:5px 0}.card p{line-height:1.5;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;padding:15px;border:1px solid var(--line);border-radius:10px}.stat b{font-size:25px;display:block}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{font-size:12px;padding:7px 10px;border-radius:30px;background:#edf3f6;color:#486277;display:inline-block}.pill.active{background:#15354b;color:white}.field{width:100%;border:1px solid #c4d1dd;border-radius:9px;padding:12px;background:white;color:#203d50}textarea.field{min-height:130px;line-height:1.55;resize:vertical}a{color:#245a84;word-break:break-word}.qr{width:230px;max-width:100%;min-height:230px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:block}.qrarea{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.casebox{background:#f0f5f8;border-left:4px solid var(--gold);border-radius:9px;padding:18px;line-height:1.6;margin:15px 0}.evidence{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.evidence button{text-align:left;background:#f3f7fa;border:1px solid var(--line);color:var(--navy);padding:18px}.evidence button.unlocked{background:#e6f3ee;border-color:#95c5b1}.alert{background:#fff1e8;border-left:4px solid #c78346;border-radius:8px;padding:15px;margin:13px 0;line-height:1.5}.success{background:#e7f6ed;border-left:4px solid #3e9971;border-radius:8px;padding:14px;margin:13px 0}.danger{background:#fff0ee;border:1px solid #eebcba;color:var(--red);padding:13px;border-radius:8px;margin:13px 0}.section{font-size:20px;font-weight:750;margin:20px 0 11px}.steps{display:flex;gap:7px;flex-wrap:wrap}.steps button{font-size:13px;padding:10px 11px}.steps button.selected{background:var(--gold);color:#142e42}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.score{width:80px;padding:9px;border:1px solid var(--line);border-radius:7px}.truncate{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55}.footer{text-align:center;color:var(--muted);font-size:12px;margin:34px auto}.hidden{display:none!important}@media(max-width:800px){.cols,.cards,.stats{grid-template-columns:1fr}.evidence{grid-template-columns:1fr}.wrap{padding:16px 12px 40px}.panel{padding:17px}.intro{padding:22px}header{padding:12px 15px}}
</style></head><body><header><div><strong>⚖ КОНСТИТУЦИОННЫЙ ДЕТЕКТИВ</strong><small>НИУ «МЭИ» · Основы российской государственности</small></div><div class="row"><span id="tag" class="small"></span><button class="slim" id="leave" onclick="leave()" style="display:none">Выйти</button></div></header><main class="wrap" id="app"></main>
<script>
const API='https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/constitutional-detective';
const KEY='sb_publishable_gUO0b5EHdgs_vS39Iqi4pQ_tU-7tPuw';
const BASE='https://voran1987.github.io/parlamentiya/konstitucionny-detektiv/';
const TEAMS=['Архив','Федерализм','Права человека','Исполнительная власть','Местное самоуправление','Правосудие'];
const STAGES=['brief','investigate','hypothesis','twist','cross','final','results'];
const LABELS=['Получение дела','Сбор доказательств','Предварительная версия','Неожиданный поворот','Перекрёстная экспертиза','Итоговое заключение','Результаты'];
const MINUTES=[10,20,15,5,15,20,5];
const invite=new URLSearchParams(location.search).get('join')?.toUpperCase()||'';
function read(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
let auth=invite?(read('detective_team_'+invite)||null):read('detective_host');
if(invite&&auth?.role!=='team')auth=null;
let state=auth?.state||null,working=false,poll=null,error='',elapsedStart=Date.now();
const root=document.getElementById('app'),tag=document.getElementById('tag');
const esc=x=>String(x??'').replace(/[&<>"']/g,y=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[y]));
const val=id=>document.getElementById(id)?.value??'';
function url(){return BASE+'?join='+encodeURIComponent(auth.code)}
function message(e){error=String(e);render()}
async function request(action,opts={}){
 const p={action,...opts};if(action!=='create'&&action!=='join'){p.code=auth.code;p.token=auth.token;}
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(p)});
 const j=await r.json().catch(()=>({error:'Некорректный ответ сервера'}));if(!r.ok)throw Error(j.error||'Сервер недоступен');return j;
}
function save(a){auth=a;state=a.state;localStorage.setItem(a.role==='host'?'detective_host':'detective_team_'+a.code,JSON.stringify({role:a.role,code:a.code,team:a.team,token:a.token}));render();start();}
async function create(){if(working)return;working=true;try{const a=await request('create');save({role:'host',code:a.code,token:a.token,state:a.state});error=''}catch(e){message(e.message)}finally{working=false}}
async function join(){if(working)return;const team=val('team');if(!team)return message('Выберите команду');working=true;try{
 const a=await request('join',{code:invite,team});save({role:'team',code:a.code,team,token:a.token,state:a.state});error='';
 }catch(e){message(e.message)}finally{working=false}}
async function load(){if(!auth||working)return;try{const a=await request('state');if(JSON.stringify(a.state)!==JSON.stringify(state)){state=a.state;error='';render()}}catch(e){error=e.message;render()}}
function start(){clearInterval(poll);poll=setInterval(load,3500);load()}
function leave(){if(!confirm('Выйти из кабинета? Сессия и данные команд останутся на сервере.'))return;
 localStorage.removeItem(auth.role==='host'?'detective_host':'detective_team_'+auth.code);
 auth=null;state=null;clearInterval(poll);location.href=BASE;}
async function control(stage){if(working||!confirm('Перейти к этапу «'+LABELS[STAGES.indexOf(stage)]+'»?'))return;working=true;try{const a=await request('control',{stage});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
async function teamAction(kind,id){if(working)return;let text=val(kind+'Text');if(kind==='clue'){if(!confirm('Потратить один жетон на улику?'))return;}else if(!confirm('Отправить окончательный ответ на этом этапе? Изменить его нельзя.'))return;
 working=true;try{const a=await request('act',{kind,id,text});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
async function score(t){const x=Number(val('score'+TEAMS.indexOf(t)));if(!Number.isInteger(x)||x<0||x>100)return message('Баллы от 0 до 100');working=true;try{const a=await request('score',{team:t,points:x});state=a.state;error='';render()}catch(e){message(e.message)}finally{working=false}}
function render(){
 tag.textContent=auth?(auth.role==='host'?'Ведущий':'Команда «'+esc(auth.team)+'»'):'';
 document.getElementById('leave').style.display=auth?'':'none';
 if(!auth){if(invite){root.innerHTML='<section class="intro"><div class="eyebrow">Приглашение на расследование</div><h1>Вход команды</h1><p>Введите ничего не требуется. Выберите свободную команду и нажмите «Присоединиться».</p></section><div class="panel"><h2>Выберите команду</h2><select id="team" class="field">'+TEAMS.map(t=>'<option>'+esc(t)+'</option>').join('')+'</select><button class="full" style="margin-top:15px" onclick="join()">Присоединиться</button></div>'+ (error?'<div class="danger">'+esc(error)+'</div>':'');return;}
 root.innerHTML='<section class="intro"><div class="eyebrow">Интерактивное расследование · 90 минут</div><h1>Конституционный детектив</h1><p>Шесть конкурирующих экспертных групп. Документы и свидетели, ограниченные запросы улик, неожиданные повороты, юридические заключения и финальный рейтинг.</p></section><div class="panel"><h2>Кабинет ведущего</h2><p class="muted">Создайте новую игровую сессию. На экране появятся QR-код и ссылка для капитанов шести команд.</p><button onclick="create()">Создать новую игру</button></div>'+(error?'<div class="danger">'+esc(error)+'</div>':'');return}
 if(!state){root.innerHTML='<div class="panel"><h2>Восстановление игровой сессии…</h2><p>Загружаем данные с сервера.</p><button onclick="load()">Повторить</button></div>';return;}
 const host=auth.role==='host',stage=state.stage,index=STAGES.indexOf(stage);
 const intro='<section class="intro"><div class="eyebrow">Расследование · '+(index+1)+' / 7</div><h1>'+LABELS[index]+'</h1><p>Шесть дел об основах конституционного строя и публичной власти России. Предположения проверяются доказательствами, а выводы — правовыми аргументами.</p></section>';
 let body='';
 if(host){
 const link=url();
 body+='<div class="panel qrarea"><div><div class="eyebrow">Вход команд · без кода доступа</div><h2>Отсканируйте QR-код</h2><div id="qrArea" class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data='+encodeURIComponent(link)+'" width="208" height="208" alt="QR-код приглашения" style="max-width:100%" onerror="this.onerror=null;this.src=\'https://quickchart.io/qr?size=220&text='+encodeURIComponent(link)+'\'"></div></div><div style="flex:1;min-width:230px"><p class="muted">Один капитан от команды. Студенты открывают ссылку и выбирают команду; код вводить не требуется.</p><p><a href="'+esc(link)+'" target="_blank" rel="noopener">'+esc(link)+'</a></p><button class="light" onclick="copyUrl()">Копировать приглашение</button></div></div>';
 body+='<div class="stats">'+[state.teams.filter(x=>x.joined).length+' / 6',''+state.teams.filter(x=>x.submitted).length, ''+state.teams.filter(x=>x.hypothesis).length, ''+Object.values(state.scores||{}).filter(x=>x>0).length].map((v,i)=>'<div class="stat"><b>'+v+'</b><span>'+['Подключено','Сдано заключений','Предварительных версий','Оценено команд'][i]+'</span></div>').join('')+'</div>';
 body+='<div class="panel"><h2>Управление этапами</h2><p class="muted small">Рекомендованное время: 10 / 20 / 15 / 5 / 15 / 20 / 5 минут. Этапы переключает ведущий.</p><div class="steps">'+STAGES.map((s,i)=>'<button class="'+(s===stage?'selected':'light')+'" onclick="control(\''+s+'\')">'+(i+1)+'. '+LABELS[i]+' · '+MINUTES[i]+' мин</button>').join('')+'</div></div>';
 body+='<div class="cards">'+state.cases.map((c,i)=>{let t=TEAMS[i],p=state.teams[i];return '<div class="card"><span class="pill">'+esc(t)+'</span><h3>'+esc(c.title)+'</h3><p>'+esc(c.topic)+'</p><div class="row"><span class="pill">'+(p.joined?'✓ Подключена':'Нет капитана')+'</span><span class="pill">Улик '+p.requests+'/3</span></div><p class="small muted">Версия: '+(p.hypothesis?'✓':'—')+' · Заключение: '+(p.submitted?'✓':'—')+'</p></div>'}).join('')+'</div>';
 body+='<div class="section">Материалы и ответы команд</div>';
 body+=state.cases.map((c,i)=>{let t=TEAMS[i],n=state.notes[t],report=state.reports[t],crit=state.critiques[t];return '<details class="panel"><summary style="cursor:pointer;font-weight:700">'+esc(t)+' · '+esc(c.title)+'</summary><p class="muted">'+esc(c.brief)+'</p><div class="casebox">'+esc(c.question)+'</div><p class="small"><b>Улики:</b> '+c.items.map(x=>esc(x[0]+': '+x[1])).join(' · ')+'</p><p class="alert"><b>Поворот:</b> '+esc(c.twist)+'</p><p><b>Предварительная версия:</b></p><p class="truncate">'+esc(n?.text||'Не представлена')+'</p><p><b>Перекрёстный вопрос:</b></p><p class="truncate">'+esc(crit?.text||'Не представлен')+'</p><p><b>Итоговое заключение:</b></p><p class="truncate">'+esc(report?.text||'Не представлено')+'</p><div class="success"><b>Методический разбор:</b> '+esc(c.solution)+'</div><div class="row"><input class="score" type="number" id="score'+i+'" min="0" max="100" value="'+(state.scores[t]??0)+'"><button class="slim" onclick="score(\''+t+'\')">Сохранить оценку</button></div></details>'}).join('');
 }else{
 const c=state.case;
 body+='<div class="stats"><div class="stat"><b>'+state.teams.filter(t=>t.joined).length+' / 6</b><span>Команд в игре</span></div><div class="stat"><b>'+c.remaining+' / 3</b><span>Жетоны расследования</span></div><div class="stat"><b>'+state.myScore+'</b><span>Ваши баллы</span></div><div class="stat"><b>'+esc(LABELS[index])+'</b><span>Текущий этап</span></div></div>';
 body+='<div class="panel"><span class="pill">'+esc(auth.team)+'</span><h2 style="margin-top:12px">Дело: «'+esc(c.title)+'»</h2><p class="muted">'+esc(c.topic)+'</p><p class="truncate">'+esc(c.brief)+'</p><div class="casebox"><b>Задание:</b> '+esc(c.question)+'</div><p class="muted small">Правовая основа для проверки: '+esc(c.norm)+'</p></div>';
 if(index===0)body+='<div class="panel"><h2>Первичная версия</h2><p>Изучите обстоятельства и определите, что нужно проверить. В следующем раунде будут доступны запросы дополнительных документов.</p></div>';
 if(index>=1){
 body+='<div class="panel"><h2>Досье и улики</h2><p class="muted">На расследование выделено три жетона. Выбирайте документы осмысленно: не все одинаково важны.</p><div class="evidence">'+c.items.map(e=>'<button class="'+(e.unlocked?'unlocked':'')+'" '+(!e.unlocked&&(index!==1||c.remaining===0)?'disabled':'')+' onclick="teamAction(\'clue\','+e.id+')"><b>'+(e.unlocked?'✓':'🔎')+' '+esc(e.label)+'</b><p>'+esc(e.unlocked?e.content:(index===1?'Потратить 1 жетон':'Не исследовано'))+'</p></button>').join('')+'</div></div>';
 }
 if(index===2){body+='<div class="panel"><h2>Предварительная версия</h2><p>Опишите факты, предполагаемое нарушение и необходимую проверку. Отправить можно только один раз.</p>'+(state.myHypothesis?'<div class="success">'+esc(state.myHypothesis.text)+'</div>':'<textarea class="field" id="hypothesisText" placeholder="Наша версия: ..."></textarea><button class="full" onclick="teamAction(\'hypothesis\')">Отправить версию</button>')+'</div>'}
 if(index>=3)body+='<div class="panel"><div class="eyebrow">Новый материал</div><h2>Неожиданный поворот</h2><div class="alert">'+esc(c.twist)+'</div></div>';
 if(index===4)body+='<div class="panel"><h2>Перекрёстная экспертиза</h2><p>Вы анализируете предварительную версию команды <b>«'+esc(state.crossTarget)+'»</b>.</p><div class="casebox">'+esc(state.crossSummary)+'</div>'+(state.myCritique?'<div class="success">'+esc(state.myCritique.text)+'</div>':'<textarea class="field" id="critiqueText" placeholder="Какое доказательство недостаточно? Какой вопрос необходимо задать?"></textarea><button class="full" onclick="teamAction(\'critique\')">Отправить замечание</button>')+'</div>';
 if(index===5)body+='<div class="panel"><h2>Итоговое юридическое заключение</h2><p>Укажите доказанные факты, компетенцию, конституционные принципы и способ разрешения ситуации.</p>'+(state.myReport?'<div class="success"><b>Заключение принято.</b><p class="truncate">'+esc(state.myReport.text)+'</p></div>':'<textarea class="field" style="min-height:230px" id="reportText" placeholder="1. Установленные факты. 2. Доказательства. 3. Конституционные принципы и полномочия. 4. Вывод и правовое решение."></textarea><button class="full" onclick="teamAction(\'report\')">Отправить итоговое заключение</button>')+'</div>';
 if(index===6)body+='<div class="panel"><h2>Расследование завершено</h2><p>Посмотрите итоговые баллы всех команд. Преподаватель объяснит юридические решения и ошибки следствия.</p></div>';
 body+='<div class="panel"><h2>Рейтинг расследований</h2>'+state.teams.map(t=>'<div class="row" style="padding:9px 0;border-bottom:1px solid #e9eef3"><span>'+esc(t.name)+'</span><b>'+Number(state.scores[t.name]||0)+' баллов</b></div>').join('')+'</div>';
 }
 root.innerHTML=intro+body+(error?'<div class="danger">'+esc(error)+'</div>':'')+'<div class="footer">Все дела вымышлены · Конституция Российской Федерации · Учебный симулятор МЭИ</div>';
}
function copyUrl(){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(url()).then(()=>alert('Ссылка скопирована')).catch(()=>prompt('Ссылка для команд',url()));else prompt('Ссылка для команд',url())}
render();if(auth)start();window.addEventListener('focus',load);
</script></body></html>
