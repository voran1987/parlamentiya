['Права человека','Биометрический пропуск','Университет вводит обязательное распознавание лиц. Студентам, не согласным на биометрию, отказано в проходе. Оцените права и предложите альтернативу.','Статьи 23, 24, 43, 55','Нужно проверить правовые основания обработки биометрии, соразмерность и наличие законной альтернативы.'],
['Парламент','Чрезвычайный энергетический закон','Дума приняла закон, Совет Федерации его отклонил. Депутаты предлагают ввести закон в силу немедленно, так как он нужен для борьбы с авариями. Восстановите процедуру.','Статьи 105–107','Согласительная комиссия или преодоление отклонения большинством не менее двух третей общего числа депутатов Думы; затем дальнейшие стадии.'],

['Правосудие','Защита жителей','Региональный акт допускает строительство энергетических объектов без предусмотренных федеральным законом экологических процедур. Объясните порядок защиты жителей и пределы компетенции судов.','Статьи 42, 46, 58, 125','Судебная защита доступна, но порядок и подсудность зависят от оспариваемого акта; Конституционный Суд не заменяет суды общей юрисдикции.'] ];
const labels=['Конституционный блиц','Экспертные заключения','Кризисные события','Заседание совета','Итоги'];
let auth=JSON.parse(localStorage.getItem('ccauth')||'null'),state=null,choice=null,interval=null,polling=false,qrOpen=false,saveBusy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){let e=document.getElementById('toast');e.textContent=s;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),4000)}
async function api(action,params={}){let data={action,...params};if(action!=='create'&&action!=='join')Object.assign(data,{code:auth?.code,token:auth?.token});let r=await fetch(URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'Ошибка сервера');return j}
function setAuth(a){auth=a;localStorage.setItem('ccauth',JSON.stringify(a));state=a.state||null;render();startPoll()}function goHome(){if(!confirm('Выйти из текущего кабинета на этом устройстве? Игра на сервере сохранится.'))return;localStorage.removeItem('ccauth');auth=null;state=null;clearInterval(interval);document.getElementById('overlay').innerHTML='';render()}

async function join(){let code=document.getElementById('joinCode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');let team=document.getElementById('joinTeam').value;if(!/^[A-Z0-9]{6}$/.test(code))return toast('Введите шестизначный код');try{let r=await api('join',{code,team});setAuth({role:'team',code,token:r.token,team,state:r.state});toast('Вы подключились как капитан команды')}catch(e){toast(e.message)}}
async function refresh(silent=true){if(!auth||polling)return;polling=true;try{let r=await api('state');if(!state||JSON.stringify(r.state)!==JSON.stringify(state)){state=r.state;render()}}catch(e){if(!silent)toast(e.message)}finally{polling=false}}
function startPoll(){clearInterval(interval);interval=setInterval(()=>{refresh();updateTimer()},2300);refresh()}
function section(){return state?.round??0}function current(){let round=section();return round===0?QUIZ[state.idx]:(round===2?EVENTS[state.idx]:null)}
function k(){return section()+':'+state.idx}function accepted(){return state.myAnswer!==null&&state.myAnswer!==undefined}function open(){return state.phase==='open'}
function hero(){let round=section(),name=state?.phase==='lobby'?'Ожидание команд':labels[round];return `<section class="hero"><div class="eyebrow">КОНСТИТУЦИОННЫЙ СОВЕТ · КРИЗИС–2026</div><h1>${esc(name)}</h1><p>Конституционное право Российской Федерации · Практические решения в условиях энергетического кризиса</p></section>`}
function ranking(){let pairs=TEAMS.map(t=>[t,state?.scores?.[t]||0]).sort((a,b)=>b[1]-a[1]);return `<div class="card"><div class="space"><h2>Рейтинг команд</h2><span class="pill">из 48 баллов</span></div>${pairs.map(([t,p],i)=>`<div class="rank"><span class="ranknum">${i+1}</span><div class="rankname">${esc(t)}<div class="bar" style="margin-top:7px"><i style="width:${Math.min(100,p/48*100)}%"></i></div></div><span class="rankscore">${p}</span></div>`).join('')}</div>`}
function timer(){if(!state?.deadline||!open())return '—';let d=Math.max(0,Math.ceil((new Date(state.deadline).getTime()-Date.now())/1000));return String(Math.floor(d/60)).padStart(2,'0')+':'+String(d%60).padStart(2,'0')}
function updateTimer(){document.querySelectorAll('[data-timer]').forEach(e=>{e.textContent=timer();e.classList.toggle('warn',timer()==='00:00')})}
function answerRows(){return `<div class="card"><div class="space"><h2>Ответы команд</h2><span class="pill">${state.answered?.length||0}/6 ответили</span></div>${TEAMS.map(t=>`<div class="rank"><span class="rankname">${esc(t)}</span><span class="pill ${state.answered?.includes(t)?'good':''}">${state.answered?.includes(t)?'Принят':'Ожидание'}</span></div>`).join('')}</div>`}
function renderQuiz(){let q=current();if(!q)return '';let revealed=state.reveal||state.phase==='finished';let myAnswer=state.myAnswer;return `<div class="card question"><div class="space"><span class="eyebrow">ВОПРОС ${state.idx+1} / ${QUIZ.length}</span><span class="pill">1 балл</span></div><h2>${esc(q[0])}</h2>${q[1].map((a,i)=>`<label class="option ${choice===i?'selected':''} ${revealed&&q[2]===i?'correct':''}"><input type="radio" name="answer" value="${i}" ${choice===i?'checked':''} ${auth.role==='host'||!open()||accepted()?'disabled':''} onchange="choice=${i};render()"><b>${'АБВГ'[i]}</b><span>${esc(a)}</span></label>`).join('')}${revealed?`<div class="hint answerbox"><strong>Правильный ответ: ${'АБВГ'[q[2]]}</strong><p>${esc(q[3])}</p></div>`:''}${submitButton()}</div>`}

function caseText(t){return CASES.find(x=>x[0]===t)}function renderCase(){let c=caseText(auth.role==='team'?auth.team:TEAMS[state.idx%6]);let isDefense=section()===3;if(auth.role==='host')return `<div class="card"><div class="eyebrow">${isDefense?'ЗАСЕДАНИЕ КОНСТИТУЦИОННОГО СОВЕТА':'ЭКСПЕРТНОЕ ЗАКЛЮЧЕНИЕ'} · КОМАНДА ${state.idx+1}</div><h2 class="case-title">${esc(c[1])}</h2><p>${esc(c[2])}</p><div class="hint">Материалы: ${esc(c[3])}</div><div class="hint answerbox"><strong>Методический ключ:</strong> ${esc(c[4])}</div></div>`;
return `<div class="card"><div class="eyebrow">ВАША СПЕЦИАЛИЗАЦИЯ</div><h2>${esc(c[0])}</h2><h3 class="case-title">${esc(c[1])}</h3><p>${esc(c[2])}</p><div class="hint">Рекомендуемые статьи: ${esc(c[3])}</div><p class="muted tiny">Определите проблему, укажите конституционные нормы и предложите юридически обоснованное решение.</p>${section()===1?`<textarea id="written" class="field" placeholder="Экспертное заключение команды (от 20 символов)..." ${!open()||accepted()?'disabled':''}>${typeof state.myAnswer==='string'?esc(state.myAnswer):''}</textarea>${submitButton()}`: `<div class="hint">На заседании представитель команды защищает ранее подготовленное заключение. Оценки выставляет ведущий.</div>`}</div>`}
function submitButton(){if(auth.role==='host')return '';if(accepted())return `<div class="hint answerbox">✓ Ответ команды принят и заблокирован. Повторная отправка невозможна.</div>`;if(!open())return `<div class="hint">Приём ответов закрыт. Ожидайте команды ведущего.</div>`;return `<button class="btn full" onclick="submit()" ${!state.deadline?'':' '}>Отправить единственный ответ команды →</button>`}
async function submit(){if(saveBusy||!auth||auth.role!=='team'||!open())return;let answer=section()===1?document.getElementById('written')?.value?.trim():choice;if(answer===null||answer===undefined||answer==='')return toast('Выберите вариант или заполните заключение');if(!confirm('Отправить окончательный ответ от всей команды? Изменить его нельзя.'))return;saveBusy=true;try{let r=await api('submit',{answer});state=r.state;choice=null;render();toast('Ответ команды принят')}catch(e){toast(e.message);refresh(false)}finally{saveBusy=false}}
function hostControls(){if(auth.role!=='host')return '';let r=section();let max=r===0?QUIZ.length:r===2?EVENTS.length:r===1||r===3?6:1;let idx=state.idx;return `<div class="card"><div class="space"><h2>Кабинет ведущего</h2><span class="pill">Код: ${esc(auth.code)}</span></div><div class="label" style="margin-top:13px">Этап игры</div><div class="tabs">${labels.map((x,i)=>`<button class="tab ${r===i?'active':''}" onclick="control(${i},0,'${i===4?'finished':'lobby'}')">${i+1}. ${esc(x)}</button>`).join('')}</div><div class="space"><span class="label">${r===0?'Вопрос':r===2?'Событие':r===1?'Экспертиза':r===3?'Защита':'Итоги'} ${idx+1} / ${max}</span><span class="timer" data-timer>${timer()}</span></div><div class="flex" style="margin:15px 0"><button class="btn secondary" onclick="control(${r},${Math.max(0,idx-1)},'lobby')" ${idx===0?'disabled':''}>← Назад</button><button class="btn secondary" onclick="control(${r},${Math.min(max-1,idx+1)},'lobby')" ${idx>=max-1?'disabled':''}>Следующее →</button></div><div class="flex" style="margin:15px 0"><button class="btn" onclick="control(${r},${idx},'open')" ${r===4?'disabled':''}>▶ Открыть приём</button><button class="btn gold" onclick="control(${r},${idx},'reveal')" ${r===4?'disabled':''}>◉ Раскрыть результаты</button><button class="btn secondary" onclick="control(${r},${idx},'lobby')">Остановить</button></div><div class="label">Таймер, секунд</div><select id="seconds" class="field" style="max-width:190px"><option value="45">45 сек.</option><option value="75" selected>75 сек.</option><option value="120">120 сек.</option><option value="300">5 минут</option><option value="600">10 минут</option></select><div class="hint tiny">Вопросы и кризисы оцениваются после раскрытия правильного ответа. Выставить баллы можно в панели оценивания ниже.</div></div>`}
async function control(round,idx,phase){if(!auth||auth.role!=='host')return;if(phase==='open'&&round===1){if(!confirm('Открыть приём экспертных заключений?'))return}try{let n=document.getElementById('seconds');let r=await api('control',{round,idx,phase,seconds:n?Number(n.value):75});state=r.state;choice=null;render()}catch(e){toast(e.message)}}
function scoring(){if(auth.role!=='host')return '';let r=section();if(r===4)return '';let kind=r===0?'quiz':r===2?'event':r===1?'case':'defense';let max=r===0?1:r===2?5:r===1?15:10;return `<div class="card"><h2>Оценивание команд</h2><p class="muted tiny">За текущий вопрос / кейс. Повторное сохранение заменяет оценку, не прибавляя её ещё раз.</p>${TEAMS.map((t,i)=>{let key=kind+':'+state.idx+':'+t,old=state.reviews?.[key]??0;let ans=state.answers?.[r+':'+state.idx+':'+t];return `<div class="rank" style="align-items:flex-start"><div class="rankname"><b>${esc(t)}</b>${state.reveal&&ans!==undefined?`<div class="tiny muted" style="margin:6px 0">${typeof ans==='string'?esc(ans).slice(0,450):'Ответ: '+('АБВГ'[ans]||'—')}</div>`:''}</div><input type="number" min="0" max="${max}" id="point${i}" class="scorefield" value="${old}"><button class="btn small secondary" onclick="score('${t}',${i},'${kind}:${state.idx}')">✓</button></div>`}).join('')}</div>`}
async function score(team,i,key){let points=Number(document.getElementById('point'+i).value);if(!Number.isInteger(points)||points<0||points>(section()===0?1:section()===2?5:section()===1?15:10))return toast('Недопустимое количество баллов');try{let r=await api('score',{team,points,scorekey:key});state=r.state;render();toast('Оценка сохранена')}catch(e){toast(e.message)}}
function details(){if(state.phase==='lobby'&&section()===0)return `<div class="card"><h2>Подготовка к игре</h2><p>Подключите команды через QR-панель, назначьте по одному капитану на команду. Затем нажмите «Открыть приём».</p></div>`;if(section()===4)return `<div class="card"><h2>Игра завершена</h2><p>Все решения и оценки сохранены. Итоговый рейтинг показан справа.</p><button class="btn secondary" onclick="window.print()">Распечатать результаты</button></div>`;return section()===0?renderQuiz():section()===2?renderEvent():renderCase()}
function render(){let app=document.getElementById('app'),tag=document.getElementById('sessionTag'),toggle=document.getElementById('qrToggle');toggle.classList.toggle('hidden',!auth||auth.role!=='host');tag.textContent=auth?'Игра '+auth.code+(auth.role==='team'?' · '+auth.team:' · ведущий'):'';if(!auth){let hash=new URLSearchParams(location.search);app.innerHTML=`<section class="intro"><div class="eyebrow">НИУ «МЭИ» · ИНТЕРАКТИВНЫЙ СЕМИНАР</div><h1>Конституционный<br>совет</h1><p>Командная юридическая симуляция. Шесть экспертных групп, решения конституционных кризисов, голоса команд и публичный рейтинг.</p><div class="cards"><div class="card"><h2>Кабинет ведущего</h2><p>Создайте игру и выведите QR-код для капитанов. Управляйте раундами, временем и оценками.</p><button class="btn full" onclick="create()">Создать новую игру</button></div><div class="card"><h2>Подключение команды</h2><p>Введите код с экрана преподавателя и выберите команду. Один капитан отправляет ответы за всю команду.</p><label class="label">Код игры</label><input id="joinCode" class="field" maxlength="6" value="${esc(hash.get('code')||'')}" placeholder="ABC123" style="text-transform:uppercase"><label class="label">Команда</label><select id="joinTeam" class="field">${TEAMS.map(t=>`<option>${esc(t)}</option>`).join('')}</select><button class="btn full" onclick="join()">Присоединиться</button></div></div></section>`;return}
let host=auth.role==='host';app.innerHTML=hero()+`<div class="stats"><div class="stat"><strong>${state.joined||0} / 6</strong><span>Команд подключено</span></div><div class="stat"><strong>${state.answered?.length||0} / 6</strong><span>Ответили в текущем раунде</span></div><div class="stat"><strong data-timer>${timer()}</strong><span>Таймер</span></div></div><div class="status">${host?'Режим ведущего':'Капитан команды «'+esc(auth.team)+'»'} · ${state.phase==='open'?'Приём ответов открыт':state.phase==='reveal'?'Результаты раскрыты':state.phase==='finished'?'Игра завершена':'Ожидание ведущего'} · Онлайн-синхронизация</div>${host?hostControls():''}<div class="columns"><div>${details()}${host?scoring():''}</div><div>${host?answerRows():''}${ranking()}</div></div><div class="foot">Учебный материал по конституционному праву РФ · Все ситуации вымышлены · МЭИ</div>`;updateTimer();if(qrOpen)drawQR()}
function toggleQR(){if(!auth||auth.role!=='host')return;qrOpen=!qrOpen;if(qrOpen){document.getElementById('overlay').innerHTML=`<div class="shade" onclick="toggleQR()"></div><aside class="qrpanel"><div class="space"><h2>Подключение команд</h2><button class="btn secondary small" onclick="toggleQR()">✕ Скрыть</button></div><p class="muted">Отсканируйте код на смартфоне капитана команды.</p><div class="qrframe" id="qrSpot"></div><div class="label" style="text-align:center">Код сессии</div><div class="code">${esc(auth.code)}</div><p class="muted tiny" style="text-align:center">Код действителен для текущей игры</p><button class="btn full" onclick="copyLink()">Копировать ссылку</button><a class="btn secondary full" style="margin-top:10px;overflow-wrap:anywhere;text-decoration:none" href="${joinLink()}" target="_blank" rel="noopener">Открыть ссылку для команды ↗</a><p class="tiny muted">Подключено ${state.joined||0} из 6 команд. Панель можно скрыть — сессия продолжится.</p></aside>`;drawQR()}else document.getElementById('overlay').innerHTML=''}
function joinLink(){let x=new URL(location.href);x.searchParams.set('code',auth.code);return x.toString()}
function drawQR(){
 const spot=document.getElementById('qrSpot');
 if(!spot)return;
 const link=joinLink();
 const marker=spot.getAttribute('data-link');
 if(marker===link && spot.querySelector('img,canvas,svg'))return;
 spot.setAttribute('data-link',link);
 spot.innerHTML='';
 const im=document.createElement('img');
 im.alt='QR-код для входа в командную игру';
 im.width=230;im.height=230;
 im.style.cssText='width:230px;height:230px;max-width:100%;object-fit:contain;background:white;display:block;margin:auto';
 im.onload=()=>{spot.dataset.loaded='1'};
 im.onerror=()=>{
   im.remove();
   if(typeof QRCode!=='undefined'){
     try{new QRCode(spot,{text:link,width:230,height:230,colorDark:'#102a43',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});return;}
     catch(e){console.warn('QR renderer failed',e);}
   }
   spot.innerHTML='<div style="text-align:center;padding:12px;color:#65788a">QR-код не загрузился.<br>Откройте ссылку ниже или введите код игры вручную.</div>';
 };
 im.src='https://api.qrserver.com/v1/create-qr-code/?size=230x230&margin=10&format=png&data='+encodeURIComponent(link);
 spot.appendChild(im);
}

function copyLink(){navigator.clipboard?.writeText(joinLink()).then(()=>toast('Ссылка скопирована')).catch(()=>prompt('Ссылка для команд',joinLink()))}
window.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});render();if(auth)startPoll();
</script></body></html>
