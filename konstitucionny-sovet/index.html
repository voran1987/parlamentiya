function caseText(t){return CASES.find(x=>x[0]===t)}function renderCase(){
 const defending=section()===3;
 const team=auth.role==='team'?auth.team:TEAMS[state.idx%6];
 const c=caseText(team);
 const caseIndex=TEAMS.indexOf(team);
 const twistVisible=defending&&state.reveal;
 const myTurn=!defending||state.idx===caseIndex;
 const submitted=state.myAnswer;
 const host=auth.role==='host';
 const roleLine='<div class="eyebrow">'+(defending?'ЗАСЕДАНИЕ КОНСТИТУЦИОННОГО СОВЕТА · ЗАЩИТА '+(state.idx+1)+'/6':'ЭКСПЕРТНАЯ РАБОТА · 6 РАЗНЫХ РОЛЕЙ')+'</div>';
 const caseBody='<h2 class="case-title">'+esc(c[1])+'</h2><p>'+esc(c[2])+'</p><div class="hint">Конституционные положения: '+esc(c[3])+'</div>';
 if(host){
 const keys='<div class="hint answerbox"><strong>Методический ориентир для преподавателя:</strong> '+esc(c[4])+'</div>';
 const extra=defending?'<div class="hint '+(twistVisible?'answerbox':'')+'"><strong>Неожиданный поворот</strong><p>'+(twistVisible?esc(TWISTS[caseIndex]):'Будет доступен командам после нажатия «Открыть неожиданный поворот».')+'</p></div>':'<div class="hint">Каждая команда видит собственное задание. Заключение от капитана принимается один раз; для одновременной работы всех шести команд используйте задание №1.</div>';
 const answer=(defending&&state.answers)?'<div class="hint"><strong>Ранее отправленное заключение:</strong><p>'+esc(state.caseSubmissions?.['1:0:'+team]??'Ещё не отправлено')+'</p></div>':'';
 return '<div class="card">'+roleLine+'<div class="pill">'+esc(team)+'</div>'+caseBody+keys+extra+answer+'</div>';
 }
 if(defending){
 return '<div class="card">'+roleLine+(myTurn?'<div class="pill">Сейчас защищается ваша команда</div>':'<div class="pill">Выступает '+esc(TEAMS[state.idx])+'</div>')+'<h2>'+esc(TEAMS[state.idx])+'</h2><p>'+(myTurn?'Представьте своё заключение, ответьте на возражения и подготовьтесь к дополнительному обстоятельству.':'Ваша задача — внимательно слушать и подготовить юридически обоснованное возражение.')+'</p>'+(myTurn?caseBody:'')+(twistVisible?'<div class="hint answerbox"><strong>Неожиданный поворот:</strong><p>'+esc(TWISTS[state.idx])+'</p></div>':'<div class="hint">Дополнительное обстоятельство пока скрыто. Его откроет ведущий во время защиты.</div>')+'</div>';
 }
 return '<div class="card">'+roleLine+'<div class="pill">Команда «'+esc(c[0])+'»</div>'+caseBody+'<p class="muted tiny">Сформулируйте проблему, укажите нормы Конституции РФ, юридический вывод и предлагаемое решение. Другие команды получают иные задания.</p>'+(accepted()?'<div class="hint answerbox"><strong>Ваше заключение принято:</strong><p>'+esc(submitted)+'</p></div>':'<textarea id="written" class="field" placeholder="Экспертное заключение команды (от 20 символов)..." '+(!open()?'disabled':'')+'></textarea>'+submitButton())+'</div>';
}

function submitButton(){if(auth.role==='host')return '';if(accepted())return `<div class="hint answerbox">✓ Ответ команды принят и заблокирован. Повторная отправка невозможна.</div>`;if(!open())return `<div class="hint">Приём ответов закрыт. Ожидайте команды ведущего.</div>`;return `<button class="btn full" onclick="submit()" ${!state.deadline?'':' '}>Отправить единственный ответ команды →</button>`}
async function submit(){if(saveBusy||!auth||auth.role!=='team'||!open())return;let answer=section()===1?document.getElementById('written')?.value?.trim():choice;if(answer===null||answer===undefined||answer==='')return toast('Выберите вариант или заполните заключение');if(!confirm('Отправить окончательный ответ от всей команды? Изменить его нельзя.'))return;saveBusy=true;try{let r=await api('submit',{answer});state=r.state;choice=null;render();toast('Ответ команды принят')}catch(e){toast(e.message);refresh(false)}finally{saveBusy=false}}
function hostControls(){
 if(auth.role!=='host')return '';
 const r=section(),max=r===0?QUIZ.length:r===1?1:r===3?6:1,idx=state.idx;
 const menu=[0,1,3,4].map((n,i)=>'<button class="tab '+(r===n?'active':'')+'" onclick="control('+n+',0,\''+(n===4?'finished':'lobby')+'\')">'+(i+1)+'. '+esc(labels[n])+'</button>').join('');
 const title=r===0?'Вопрос':r===1?'Подготовка всех команд':r===3?'Защита команды':'Итоги';
 let actions='';
 if(r===0)actions='<button class="btn" onclick="control(0,'+idx+',\'open\')">▶ Открыть ответ</button><button class="btn gold" onclick="control(0,'+idx+',\'reveal\')">◉ Раскрыть ответ</button>';
 else if(r===1)actions='<button class="btn" onclick="control(1,0,\'open\')">▶ Начать экспертную работу</button><button class="btn secondary" onclick="control(1,0,\'lobby\')">■ Закрыть приём заключений</button>';
 else if(r===3)actions='<button class="btn" onclick="control(3,'+idx+',\'open\')">▶ Начать защиту</button><button class="btn gold" onclick="control(3,'+idx+',\'reveal\')">⚡ Открыть неожиданный поворот</button>';
 return '<div class="card"><div class="space"><h2>Кабинет ведущего</h2><span class="pill">Код: '+esc(auth.code)+'</span></div><div class="label" style="margin-top:13px">Этап игры</div><div class="tabs">'+menu+'</div>'+(r===4?'<div class="hint">Игра завершена. Итоговые баллы сохранены.</div>':'<div class="space"><span class="label">'+title+' '+(idx+1)+' / '+max+'</span><span class="timer" data-timer>'+timer()+'</span></div>')+(r===0||r===3?'<div class="flex" style="margin:15px 0"><button class="btn secondary" onclick="control('+r+','+Math.max(0,idx-1)+',\'lobby\')" '+(idx===0?'disabled':'')+'>← Назад</button><button class="btn secondary" onclick="control('+r+','+Math.min(max-1,idx+1)+',\'lobby\')" '+(idx>=max-1?'disabled':'')+'>Следующее →</button></div>':'')+'<div class="flex" style="margin:15px 0">'+actions+'</div>'+(r!==4?'<div class="label">Время этапа</div><select id="seconds" class="field" style="max-width:190px"><option value="45">45 сек.</option><option value="75">75 сек.</option><option value="120">2 минуты</option><option value="300">5 минут</option><option value="600" selected>10 минут</option></select>':'')+'<div class="hint tiny">Порядок: блиц → одновременная подготовка шести различных заключений → защита и неожиданный поворот каждой команды → итоги. При переходе к следующей команде её поворот скрыт до открытия ведущим.</div></div>';
}

async function control(round,idx,phase){if(!auth||auth.role!=='host')return;if(phase==='open'&&round===1){if(!confirm('Открыть приём экспертных заключений?'))return}try{let n=document.getElementById('seconds');let r=await api('control',{round,idx,phase,seconds:n?Number(n.value):75});state=r.state;choice=null;render()}catch(e){toast(e.message)}}
function scoring(){
 if(auth.role!=='host'||section()===4)return '';
 const r=section(),kind=r===0?'quiz':r===1?'case':'defense',max=r===0?1:r===1?15:12;
 const shown=r===0?TEAMS:r===1?TEAMS:[TEAMS[state.idx]];
 return '<div class="card"><h2>Оценивание команд</h2><p class="muted tiny">'+(r===3?'Оцените защиту выступающей команды: аргументы, ответ на неожиданный поворот и возражения (до 12 баллов).':'Оценки сохраняются на сервере. Повторное сохранение заменяет предыдущую оценку.')+'</p>'+shown.map(t=>{const i=TEAMS.indexOf(t),key=kind+':'+(r===1?0:state.idx)+':'+t,old=state.reviews?.[key]??0;const ans=r===1?state.caseSubmissions?.['1:0:'+t]:state.answers?.[r+':'+state.idx+':'+t];return '<div class="rank" style="align-items:flex-start"><div class="rankname"><b>'+esc(t)+'</b>'+(r===1&&ans!==undefined?'<div class="tiny muted" style="margin:6px 0">'+esc(ans).slice(0,550)+'</div>':'')+'</div><input type="number" min="0" max="'+max+'" id="point'+i+'" class="scorefield" value="'+old+'"><button class="btn small secondary" onclick="score(\''+t+'\','+i+',\''+kind+':'+(r===1?0:state.idx)+'\')">✓</button></div>'}).join('')+'</div>';
}

async function score(team,i,key){let points=Number(document.getElementById('point'+i).value);if(!Number.isInteger(points)||points<0||points>(section()===0?1:section()===1?15:12))return toast('Недопустимое количество баллов');try{let r=await api('score',{team,points,scorekey:key});state=r.state;render();toast('Оценка сохранена')}catch(e){toast(e.message)}}
function details(){if(state.phase==='lobby'&&section()===0)return `<div class="card"><h2>Подготовка к игре</h2><p>Подключите команды по QR-коду выше, назначьте по одному капитану на команду. Затем нажмите «Открыть приём».</p></div>`;if(section()===4)return `<div class="card"><h2>Игра завершена</h2><p>Все решения и оценки сохранены. Итоговый рейтинг показан справа.</p><button class="btn secondary" onclick="window.print()">Распечатать результаты</button></div>`;return section()===0?renderQuiz():renderCase()}
function render(){let app=document.getElementById('app'),tag=document.getElementById('sessionTag');tag.textContent=auth?'Игра '+auth.code+(auth.role==='team'?' · '+auth.team:' · ведущий'):'';if(auth&&!state){app.innerHTML='<section class="card" style="margin-top:24px"><h2>Восстановление игровой сессии…</h2><p class="muted">Загружаем состояние игры с сервера. Код: '+esc(auth.code)+'</p><button class="btn secondary" onclick="refresh(false)">Повторить подключение</button></section>';return;}if(!auth){let hash=new URLSearchParams(location.search);app.innerHTML=`<section class="intro"><div class="eyebrow">НИУ «МЭИ» · ИНТЕРАКТИВНЫЙ СЕМИНАР</div><h1>Конституционный<br>совет</h1><p>Командная юридическая симуляция. Шесть экспертных групп, решения конституционных кризисов, голоса команд и публичный рейтинг.</p><div class="cards"><div class="card"><h2>Кабинет ведущего</h2><p>Создайте игру: QR-код сразу появится на экране. Управляйте раундами, временем и оценками.</p><button class="btn full" onclick="create()">Создать новую игру</button></div><div class="card"><h2>Подключение команды</h2><p>Введите код с экрана преподавателя и выберите команду. Один капитан отправляет ответы за всю команду.</p><label class="label">Код игры</label><input id="joinCode" class="field" maxlength="6" value="${esc(hash.get('code')||'')}" placeholder="ABC123" style="text-transform:uppercase"><label class="label">Команда</label><select id="joinTeam" class="field">${TEAMS.map(t=>`<option>${esc(t)}</option>`).join('')}</select><button class="btn full" onclick="join()">Присоединиться</button></div></div></section>`;return}
let host=auth.role==='host';app.innerHTML=hero()+`<div class="stats"><div class="stat"><strong>${state.joined||0} / 6</strong><span>Команд подключено</span></div><div class="stat"><strong>${state.answered?.length||0} / 6</strong><span>Ответили в текущем раунде</span></div><div class="stat"><strong data-timer>${timer()}</strong><span>Таймер</span></div></div><div class="status">${host?'Режим ведущего':'Капитан команды «'+esc(auth.team)+'»'} · ${state.phase==='open'?'Приём ответов открыт':state.phase==='reveal'?'Результаты раскрыты':state.phase==='finished'?'Игра завершена':'Ожидание ведущего'} · Онлайн-синхронизация</div>${host?connectionPanel():''}${host?hostControls():''}<div class="columns"><div>${details()}${host?scoring():''}</div><div>${host?answerRows():''}${ranking()}</div></div><div class="foot">Учебный материал по конституционному праву РФ · Все ситуации вымышлены · МЭИ</div>`;updateTimer();if(host)drawQR()}
function connectionPanel(){
 return '<section class="card" style="margin:18px 0;display:flex;align-items:center;justify-content:center;gap:25px;flex-wrap:wrap;border-top:4px solid #c49a50"><div><div class="eyebrow">ПОДКЛЮЧЕНИЕ КОМАНД · QR-КОД ВСЕГДА ВИДЕН</div><h2 style="margin:9px 0">Отсканируйте QR-код</h2><p class="muted" style="max-width:390px">Откройте камеру смартфона капитана и выберите свободную команду. QR-код сохраняется при переходе между раундами.</p><div class="label">Код игровой сессии</div><div class="code" style="text-align:left">'+esc(auth.code)+'</div><div class="hint tiny">Подключено '+(state.joined||0)+' из 6 команд</div><div class="flex" style="flex-wrap:wrap;gap:10px"><button class="btn secondary" onclick="copyLink()">Копировать ссылку</button><a class="btn secondary" style="text-decoration:none" href="'+joinLink()+'" target="_blank" rel="noopener">Ссылка для студента ↗</a></div></div><div class="qrframe" style="margin:0;padding:12px;background:white;min-width:286px;min-height:286px;align-items:center" id="qrSpot"></div></section>'
}

function joinLink(){const u=new URL('https://voran1987.github.io/parlamentiya/konstitucionny-sovet/');u.searchParams.set('code',auth.code);return u.toString()}
function drawQR(){
 const spot=document.getElementById('qrSpot');
 if(!spot||!auth)return;
 const link=joinLink();
 if(spot.dataset.link===link && spot.querySelector('img,canvas,svg'))return;
 spot.dataset.link=link;
 spot.innerHTML='';
 const warning=document.createElement('p');
 warning.className='tiny muted';
 warning.style.cssText='text-align:center;margin:8px;display:none';
 warning.textContent='QR недоступен. Используйте ссылку для входа или код игры.';
 const services=[
  'https://api.qrserver.com/v1/create-qr-code/?size=320x320&margin=12&data='+encodeURIComponent(link),
  'https://quickchart.io/qr?size=320&margin=2&text='+encodeURIComponent(link)
 ];
 let step=0;
 const image=document.createElement('img');
 image.alt='QR-код для подключения к игре';
 image.width=260;image.height=260;
 image.referrerPolicy='no-referrer';
 image.style.cssText='display:block;width:260px;height:260px;max-width:100%;object-fit:contain;margin:auto;background:white';
 image.onerror=()=>{
  if(++step<services.length){image.src=services[step];return}
  image.remove();
  if(typeof QRCode!=='undefined'){
   try{new QRCode(spot,{text:link,width:260,height:260,colorDark:'#102a43',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});return}catch(e){}
  }
  warning.style.display='block';
 };
 image.src=services[0];
 spot.appendChild(image);
 spot.appendChild(warning);
}

function copyLink(){navigator.clipboard?.writeText(joinLink()).then(()=>toast('Ссылка скопирована')).catch(()=>prompt('Ссылка для команд',joinLink()))}
window.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});render();if(auth)startPoll();
</script></body></html>
