async function join(code){const name=document.querySelector('#name')?.value?.trim(),team=Number(document.querySelector('#team')?.value);try{const d=await api('join',{code,name,team});auth={code:d.code,token:d.token,host:false};save();await refresh();}catch(e){toast(e.message)}}

function qr(){const url=location.origin+location.pathname+'?room='+stateCode();const src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(url);return '<div class="panel" style="text-align:center"><h3>Подключение по QR</h3><img class="qr" alt="QR-код игрового подключения" src="'+src+'" onerror="this.style.display=\'none\'"><p class="note">Сканируйте QR камерой смартфона. Код вручную вводить не нужно.</p><input class="field" readonly value="'+esc(url)+'" onclick="this.select()">'+button('Скопировать ссылку','copyLink()','small alt')+'</div>'}

'<div class="section"></div><h3>Все дипломатические сообщения</h3>'+(state.messages||[]).slice(-30).reverse().map(m=>'<div class="history"><strong>'+esc(TEAMS[m.from])+' → '+(m.to===-1?'Все':esc(TEAMS[m.to]))+'</strong><p class="note">'+esc(m.text)+'</p></div>').join('')+

}

const primary='<section class="host-hero"><div class="eyebrow">Кабинет преподавателя · Раунд '+(state.round+1)+' из 8</div><h1>'+(done?'Игра завершена':esc(state.scenario?.title||'Ожидание начала'))+'</h1><p class="sub">Этап: <strong>'+esc(ph[phase])+'</strong>. Участников: <strong>'+state.players.length+'</strong>. Подано голосов: <strong>'+state.votesCount+'</strong>.</p><div class="actions">'+(done?'':button(cta,"action('phase')"))+button('QR для новых участников','showTeacherQR()','alt')+button('Обновить','refresh()','alt small')+'</div></section>';

:hostTab==='activity'

function chatUI(){const own=state.myTeam;const msgs=(state.messages||[]).filter(m=>m.round===state.round);return '<div class="panel"><h3>Дипломатические сообщения</h3><p class="muted">Публичные заявления и закрытая переписка. Закрытые сообщения видят только две делегации и ведущий.</p><div style="max-height:240px;overflow:auto;margin:12px 0">'+(msgs.length?msgs.map(m=>'<div class="team" style="margin-bottom:7px"><strong>'+esc(TEAMS[m.from])+' → '+(m.to===-1?'Все делегации':esc(TEAMS[m.to]))+'</strong>'+esc(m.text)+'</div>').join(''):'<p class="note">Сообщений пока нет.</p>')+'</div><select class="field" id="msgTarget"><option value="-1">Публичное обращение ко всем</option>'+TEAMS.map((t,i)=>i!==own?'<option value="'+i+'">'+esc(t)+'</option>':'').join('')+'</select><input class="field" id="msgText" maxlength="300" placeholder="Текст обращения (до 300 символов)">'+button('Отправить сообщение','sendMessage()','small')+'</div>'}

function adjustmentUI(){return '<div class="panel"><h3>Корректировка ведущего</h3><p class="muted">Изменение очков или показателей с сохранением в протоколе.</p><select class="field" id="adjustKind" onchange="adjustTargets()"><option value="metric">Показатель государства</option><option value="score">Очки делегации</option></select><select class="field" id="adjustTarget"><option value="0">Доверие</option><option value="1">Экономика</option><option value="2">Политическая стабильность</option></select><input class="field" type="number" id="adjustAmount" value="1" min="-20" max="20">'+button('Применить поправку','adjust()','small alt')+'</div>'}
function adjustTargets(){const k=document.querySelector('#adjustKind').value;document.querySelector('#adjustTarget').innerHTML=(k==='score'?TEAMS:['Доверие','Экономика','Политическая стабильность']).map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join('')}
function adjust(){const kind=document.querySelector('#adjustKind').value,metric=Number(document.querySelector('#adjustTarget').value),amount=Number(document.querySelector('#adjustAmount').value);if(!Number.isInteger(amount)||Math.abs(amount)>20)return toast('Допустимо целое изменение от −20 до +20');action('adjust',{kind,metric,amount})}

const ACTION_LABELS={emergency:'Объявила чрезвычайное положение',endorse:'Публично поддержала / раскритиковала делегацию',referendum:'Инициировала референдум',no_confidence:'Вынесла вотум недоверия',investment:'Предоставила политические инвестиции',blockade:'Применила экономическую блокаду',veto:'Использовала право вето',investigation:'Провела расследование',coup:'Предприняла попытку переворота',block:'Заблокировала правительственный курс'};
function signed(n){if(n==null)return '—';return (n>0?'+':'')+n}
function roundReport(h){
if(!h)return '<div class="panel">Отчёт станет доступен после завершения раунда.</div>';
const labels=(h.teamDecisions||[]),choices=h.teamChoices||[],alliances=h.alliances||[],actions=h.actions||[];
const before=h.metricsBefore||[],scoreOld=h.scoresBefore||[];
return '<section class="panel round-report"><div class="eyebrow">Политический отчёт · Раунд '+(h.round+1)+'</div><h2>'+esc(h.title)+'</h2><p class="sub">Общее решение республики: <strong>'+esc(h.choice)+'</strong>. Итог: <strong>'+esc(h.regime)+'</strong>.</p>'+
'<div class="report-metrics">'+METRIC_NAMES.map((n,i)=>'<div class="report-metric"><span>'+esc(n)+'</span><strong>'+h.metrics[i]+'</strong><small>'+(before[i]==null?'Текущее значение':esc(signed(h.metrics[i]-before[i]))+' за раунд')+'</small></div>').join('')+'</div>'+
'<h3 style="margin:20px 0 10px">Как действовали делегации</h3>'+
TEAMS.map((name,i)=>{
const decision=labels[i]||(choices[i]==null||choices[i]<0?'Не участвовала в голосовании':(h.roleMode?'Вариант '+(choices[i]+1):'Вариант '+(choices[i]+1)));
const arr=actions.filter(a=>a.team===i),out=alliances.filter(a=>(a.from===i||a.to===i)&&a.status==='accepted');
const delta=h.changes?.[i]??(h.scores?.[i]!=null&&scoreOld[i]!=null?h.scores[i]-scoreOld[i]:null);
const voters=(h.participantVotes||[]).filter(p=>p.team===i);
return '<article class="report-team"><div class="report-head"><strong>'+EMO[i]+' '+esc(name)+'</strong><span class="report-points">Влияние '+(h.scores?.[i]??'—')+' ('+signed(delta)+')</span></div><p><b>Решение:</b> '+esc(decision)+'</p>'+
'<p><b>Спецвозможности:</b> '+(arr.length?arr.map(a=>esc(ACTION_LABELS[a.type]||a.type)+(a.target!=null?' → '+esc(TEAMS[a.target]):'')).join('; '):'не использовались')+'</p>'+
'<p><b>Союзы:</b> '+(out.length?out.map(a=>esc(TEAMS[a.from===i?a.to:a.from])).join(', '):'нет подтверждённых')+'</p>'+
(voters.length?'<details><summary>Индивидуальные голоса ('+voters.length+')</summary>'+voters.map(p=>'<div class="report-voter">'+esc(p.name)+' — '+(p.choice==null?'не голосовал':esc(labels[i]&&p.choice===choices[i]?labels[i]:'вариант '+(p.choice+1)))+'</div>').join('')+'</details>':'')+
'</article>';
}).join('')+
'<p class="brief-foot">Отчёт отражает зафиксированные решения и действия. Скрытые дипломатические сообщения не публикуются; личные голоса раскрываются только после закрытия голосования. Изменение влияния может включать бонусы, штрафы и условия кризиса.</p></section>';
}
function historyPanel(){return '<section class="panel"><h3>Протокол решений</h3>'+(state.history.length?state.history.slice().reverse().map(h=>'<div class="history"><div class="number">РАУНД '+(h.round+1)+'</div><strong>'+esc(h.title)+'</strong><p class="muted">Решение: '+esc(h.choice)+'</p><p class="note">Итог: '+esc(h.regime)+'</p><p class="note">Доверие '+h.metrics[0]+' · Экономика '+h.metrics[1]+' · Стабильность '+h.metrics[2]+'</p></div>').join(''):'<p class="muted">История появится после первого кризиса.</p>')+'</section>'}
async function runSimulation(){try{const x=await api('simulate');const outcomes=Object.entries(x.outcomes).map(([k,v])=>k+': '+v+' / '+x.trials).join('\\n');const winners=x.wins.map((n,i)=>TEAMS[i]+': '+n).join('\\n');alert('Автотест '+x.trials+' случайных полных партий (случайные стратегии, не оптимальные):\\n\\nИсходы:\\n'+outcomes+'\\n\\nПобеды/разделённое лидерство:\\n'+winners+'\\n\\nСредние показатели: '+x.averages.join(' / '))}catch(e){toast(e.message)}}

function abilityAvailable(key){
if(!['negotiations','voting'].includes(state.phase))return false;
if((state.used||[]).includes(state.myTeam+':'+key)||(state.used||[]).includes(key))return false;
if((state.actions||[]).some(a=>a.round===state.round&&a.team===state.myTeam&&a.type===key))return false;
if(key==='veto')return (state.myTeam===2&&state.metrics[1]<20)||(state.myTeam===4&&state.metrics[2]<20);

}

async function applyPower(type,value=1){

args.target=Number(input.value);
}
await action('action',args);
}

function situationPanel(){

const brief=SITUATIONS[r]?.[me]||'Оцените политическую ситуацию с позиции вашей делегации.';
const visibleActions=(state.actions||[]).filter(a=>a.round===state.round&&a.public&&a.team!==me);
const pub=(state.messages||[]).filter(m=>m.round===state.round&&m.to===-1);
const allies=(state.alliances||[]).filter(a=>a.round===state.round&&a.status==='accepted');
const risks=(state.metrics||[]).map((v,i)=>v<40?['Доверие','Экономика','Стабильность'][i]+' в зоне риска':null).filter(Boolean);
return '<section class="panel situational"><div class="eyebrow">Политическая сводка · раунд '+(r+1)+'</div><h3>Ваша ситуация</h3><p>'+esc(brief)+'</p>'+
(risks.length?'<p class="risk-note">'+esc(risks.join(' · '))+'</p>':'')+
'<div class="brief-rule"></div><h3>Что происходит с другими элитами</h3><div class="brief-list">'+TEAMS.map((name,i)=>{
if(i===me)return '';
const related=allies.filter(a=>a.from===i||a.to===i);

return '<div class="brief-team"><strong>'+EMO[i]+' '+esc(name)+'</strong><span>Участников: '+(state.counts?.[i]||0)+' · Влияние: '+(state.scores?.[i]??20)+'</span>'+
(related.length?'<small>Подтверждённые союзы: '+related.length+'</small>':'')+
(acts.length?'<small>Открытые действия: '+esc(acts.join(', '))+'</small>':'')+
(msg?'<small>Публичное сообщение: «'+esc(msg.text)+'»</small>':'')+
(!related.length&&!acts.length&&!msg?'<small>Открытых действий пока нет</small>':'')+'</div>';
}).join('')+'</div><p class="brief-foot">Закрытые сообщения и чужие голоса не раскрываются до завершения голосования.</p></section>';
}

return header()+countryDashboard()+'<div class="player-head"><div class="identity">'+EMO[mine]+' <strong>'+esc(TEAMS[mine])+'</strong> · Раунд '+(state.round+1)+' из 8</div>'+button('Обновить','refresh()','small alt')+'</div><div class="stepper">'+steps.map((label,i)=>'<span class="'+(current===i?'on':'')+'">'+(i+1)+'. '+label+'</span>').join('')+'</div>'+(phase==='lobby'?'':'<div class="section"></div>'+scenario())+'<div class="taskcallout">'+message+'</div>'+playerTabs()+'<div class="tasklayout tabcontent">'+(playerTab==='task'?mainStudentTask():playerTab==='talk'?playerTalk():playerTools())+'</div><div class="mobile-tools">'+button('Моё задание',"switchPlayerTab('task')",'alt')+(phase==='negotiations'?button('Союзы и переговоры',"switchPlayerTab('talk')",'alt'):'')+'</div><div class="actions" style="margin-top:20px">'+button('Выйти','logout()','small alt')+'</div>';
}
function render(){if(!auth){welcome();return}if(!state){app.innerHTML=header()+'<p class="sub">Подключение к игровой комнате…</p>';return}app.innerHTML=auth.host?hostView():playerView();if(auth.host&&state){const footer=document.createElement('div');footer.id='teacher-qr-modal';footer.hidden=true;footer.innerHTML=qr();app.appendChild(footer);}}
if(auth){refresh()}else if(/^[A-Z0-9]{6}$/.test(roomFromURL))joinForm(roomFromURL);else welcome();
function updateTimer(){const el=document.querySelector('#timer');if(!el||!state||!DURATION[state.phase])return;const remaining=Math.max(0,DURATION[state.phase]-Math.floor((Date.now()-(state.phaseStarted||Date.now()))/1000));el.textContent='⏱ '+String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')+(remaining===0?' · Время вышло':'')}
setInterval(updateTimer,1000);
setInterval(()=>{if(auth&&!loading&&document.visibilityState==='visible')refresh()},2500);
</script></body></html>
