<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101c2a"><title>Политическое лидерство · Республика Арея</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap');
:root{font-family:Manrope,system-ui,sans-serif;background:#101c2a;color:#ecf1f4;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 92% 0%,#30455a 0,transparent 40%),#101c2a;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}h1,h2,h3,p{margin:0}h1,h2{font-family:'Playfair Display',Georgia,serif}h1{font-size:clamp(2rem,5vw,4rem)}h2{font-size:1.6rem}a{color:#dfc390}.shell{max-width:1200px;margin:auto;padding:22px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 0 24px;gap:14px;border-bottom:1px solid #344150;margin-bottom:28px}.brand{font-size:13px;letter-spacing:.2em;font-weight:800;color:#dfc390;text-transform:uppercase}.tag{font-size:11px;border:1px solid #596472;border-radius:99px;padding:7px 11px;color:#c7d2db;white-space:nowrap}.hero{padding:45px 0 25px;max-width:800px}.eyebrow{text-transform:uppercase;letter-spacing:.23em;color:#dfc390;font-weight:800;font-size:11px;margin-bottom:12px}.sub{color:#adbac7;line-height:1.7;margin:15px 0 25px}.cards,.stats,.teamgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{background:#172737d9;border:1px solid #354555;border-radius:16px;padding:22px;box-shadow:0 15px 45px #07101b22}.panel h3{font-size:15px;margin-bottom:10px}.muted{color:#a5b3bf;font-size:13px;line-height:1.6}.big{font-size:32px;font-weight:800}.number{font-size:12px;letter-spacing:.13em;color:#d9bb83}.metric{font-size:26px;font-weight:800;margin:8px 0}.bar{height:6px;background:#405062;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:#c4a971;transition:width .4s}.bar.warn span{background:#e18f78}.btn{border:1px solid #bda371;background:#c7a976;color:#142333;padding:12px 17px;border-radius:10px;font-weight:800;transition:all .18s;text-align:center}.btn:hover:not(:disabled){filter:brightness(1.09);transform:translateY(-1px)}.btn.alt{background:transparent;color:#e4edf4;border-color:#52677b}.btn.danger{background:#512e37;color:#fff;border-color:#a96a72}.btn.small{font-size:12px;padding:8px 11px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.field{width:100%;padding:14px;border-radius:10px;border:1px solid #536579;background:#0e1b29;color:white;outline:none;margin:7px 0 12px}.field:focus{border-color:#d3b780}.cols{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}.section{margin:26px 0 12px}.phase{display:inline-block;padding:6px 11px;background:#334758;border-radius:99px;color:#e2c68e;font-size:12px;font-weight:800}.choice{width:100%;text-align:left;padding:15px;border:1px solid #496075;background:#162739;color:#edf0f3;border-radius:11px;margin:7px 0;display:flex;align-items:center;gap:12px}.choice.selected{border-color:#d6b675;background:#344050}.choice strong{display:block;font-size:14px}.choice small{display:block;color:#a9b8c3;line-height:1.5;margin-top:4px}.team{padding:12px;border:1px solid #45576a;border-radius:10px;line-height:1.45;font-size:12px}.team strong{display:block;margin-bottom:5px}.team.active{border-color:#cfb27c;background:#3b3e3b}.history{border-left:2px solid #bba270;padding-left:14px;margin:15px 0}.qr{background:white;padding:12px;border-radius:10px;width:180px;height:180px;display:block;margin:15px auto}.joincode{font-size:30px;letter-spacing:.22em;font-weight:800;text-align:center;color:#e1c48e}.status{font-size:12px;color:#b9c7d1}.error{color:#ffc2b1;font-weight:700}.ok{color:#abddc4}.private{border:1px dashed #a98d61;border-radius:12px;padding:12px;color:#e7d7b3;font-size:12px}.footer{margin-top:55px;color:#8494a4;font-size:12px;text-align:center}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e4bf8e;color:#182735;border-radius:10px;padding:12px 18px;max-width:90vw;z-index:10;box-shadow:0 10px 40px #0007;font-weight:700}.badge{padding:4px 7px;background:#374a58;font-size:11px;border-radius:5px}.rank{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #34495a;padding:10px 0;gap:8px}.rank:last-child{border:0}.progress{font-size:13px;color:#bfc9cf}.note{font-size:12px;color:#93a5b3;margin-top:8px}.connect{max-width:850px;margin:30px auto}.print{display:none}@media(max-width:760px){.shell{padding:14px 13px 70px}.hero{padding:25px 0 14px}.cards,.stats,.teamgrid,.cols,.cards.two{grid-template-columns:1fr}.panel{padding:17px}.top{padding-bottom:16px;margin-bottom:15px}.joincode{font-size:24px}.mobile-hide{display:none}}@media print{body{background:#fff;color:#000}.top,.actions,.btn{display:none}.panel{color:#000;border:1px solid #aaa;background:white}.print{display:block}}
</style></head><body><div id="app" class="shell"></div><div id="toasts"></div>
<script>
const ENDPOINT='https://logzbhhftwvqsrqvmnik.supabase.co/functions/v1/political-leadership';
const TEAMS=['Правящая элита','Оппозиция','Бизнес-элита','Медиа и гражданское общество','Силовые структуры'];
const EMO=['🏛️','📣','💼','📰','🛡️'];
let auth=JSON.parse(sessionStorage.getItem('areya_auth')||'null'),state=null,loading=false,joinTeam=0;
const qs=new URLSearchParams(location.search),roomFromURL=(qs.get('room')||'').toUpperCase();
const app=document.querySelector('#app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){document.querySelector('#toasts').innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.querySelector('#toasts').innerHTML='',3500)}
async function api(op,args={}){const res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...auth,...args,op})});let data=await res.json();if(!res.ok)throw Error(data.error||'Ошибка сети');return data}
const header=()=>'<header class="top"><div class="brand">◆ Политическое лидерство</div><span class="tag">РЕСПУБЛИКА АРЕЯ · 2.0</span></header>';
const button=(text,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+text+'</button>';
function welcome(){app.innerHTML=header()+'<section class="hero"><div class="eyebrow">Деловая игра · Политические элиты</div><h1>Власть — это искусство решений</h1><p class="sub">Пять политических элит, восемь кризисов, переговоры, союзы и последствия. Управляйте Республикой Арея или измените её политический режим.</p></section><div class="cards two"><section class="panel"><h2>Я преподаватель</h2><p class="sub">Создайте игровую комнату, покажите QR-код аудитории и управляйте восемью раундами.</p>'+button('Создать новую игру','create()')+'</section><section class="panel"><h2>Я участник</h2><p class="sub">Введите код комнаты или откройте ссылку с QR-кода.</p><input class="field" id="joincode" maxlength="6" placeholder="Код комнаты" value="'+esc(roomFromURL)+'">'+button('Продолжить','joinForm()','alt')+'</section></div><div class="footer">Учебный политический симулятор · Сессии в реальном времени · До 30 участников</div>';}
async function create(){try{const d=await api('create');auth={code:d.code,token:d.token,host:true};save();render();}catch(e){toast(e.message)}}
function joinForm(){const code=(document.querySelector('#joincode')?.value||'').trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(code)){toast('Введите шестизначный код комнаты');return}history.replaceState({},'',location.pathname+'?room='+code);app.innerHTML=header()+'<div class="connect panel"><div class="eyebrow">Подключение к делегации</div><h2>Вступить в игру</h2><p class="sub">Каждый студент подключается со своего смартфона. В делегации максимум шесть участников.</p><label>Ваше имя</label><input id="name" class="field" maxlength="32" placeholder="Имя или псевдоним"><label>Выберите делегацию</label><select class="field" id="team">'+TEAMS.map((t,i)=>'<option value="'+i+'">'+EMO[i]+' '+t+'</option>').join('')+'</select><div class="actions">'+button('Присоединиться','join(\''+code+'\')')+button('Назад','welcome()','alt')+'</div></div>';}
async function join(code){const name=document.querySelector('#name')?.value?.trim(),team=Number(document.querySelector('#team')?.value);try{const d=await api('join',{code,name,team});auth={code:d.code,token:d.token,host:false};save();await refresh();}catch(e){toast(e.message)}}
function save(){sessionStorage.setItem('areya_auth',JSON.stringify(auth));history.replaceState({},'',location.pathname+'?room='+auth.code)}
function logout(){if(!confirm('Выйти из интерфейса? Игровая комната останется активной.'))return;auth=null;state=null;sessionStorage.removeItem('areya_auth');history.replaceState({},'',location.pathname);welcome();}
async function action(op,args={}){if(loading)return;loading=true;try{state=await api(op,args);render();}catch(e){toast(e.message)}finally{loading=false}}
async function refresh(){if(!auth)return;try{const s=await api('state');if(!state||JSON.stringify(s)!==JSON.stringify(state)){state=s;render();}}catch(e){if(e.message.includes('повторное подключение')){sessionStorage.removeItem('areya_auth');auth=null;welcome()}else toast(e.message)}}
const ph={lobby:'Подключение участников',scenario:'Политический кризис',negotiations:'Переговоры',voting:'Тайное голосование',results:'Итоги раунда'};
const DURATION={scenario:60,negotiations:180,voting:120,results:60};const stage={lobby:'Начать первый раунд',scenario:'Открыть переговоры',negotiations:'Начать голосование',voting:'Подвести итоги',results:'Следующий кризис'};
function meter(label,value){return '<div class="panel"><div class="muted">'+label+'</div><div class="metric">'+value+' / 100</div><div class="bar '+(value<30?'warn':'')+'"><span style="width:'+value+'%"></span></div></div>'}
function common(){return '<div class="stats">'+meter('Доверие граждан',state.metrics[0])+meter('Экономика',state.metrics[1])+meter('Политическая стабильность',state.metrics[2])+'</div>'}
function ranking(){return '<div class="panel"><h3>Политическое влияние</h3>'+TEAMS.map((t,i)=>'<div class="rank"><div><span>'+EMO[i]+' '+t+'</span><div class="note">'+state.counts[i]+' участников'+(state.government===i?' · Правительство':'')+'</div></div><strong>'+state.scores[i]+'</strong></div>').join('')+'</div>'}
function scenario(){const r=state.scenario;return '<section class="panel"><div class="eyebrow">Кризис '+(state.round+1)+' / 8</div><h2>'+esc(r.title)+'</h2><p class="sub">'+esc(r.story)+'</p><div class="phase">'+esc(ph[state.phase])+'</div> <span class="phase" id="timer">—</span></section>'}
function qr(){const url=location.origin+location.pathname+'?room='+stateCode();const src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(url);return '<div class="panel" style="text-align:center"><h3>Подключение по QR</h3><img class="qr" alt="QR-код игрового подключения" src="'+src+'" onerror="this.style.display=\'none\'"><div class="joincode">'+esc(stateCode())+'</div><p class="note">При отсутствии QR используйте код или ссылку</p><input class="field" readonly value="'+esc(url)+'" onclick="this.select()">'+button('Скопировать ссылку','copyLink()','small alt')+'</div>'}
function stateCode(){return auth?.code||''}
async function copyLink(){try{await navigator.clipboard.writeText(location.origin+location.pathname+'?room='+auth.code);toast('Ссылка скопирована')}catch(e){toast('Выделите и скопируйте ссылку выше')}}
function players(){return '<div class="panel"><h3>Состав делегаций</h3><div class="teamgrid">'+TEAMS.map((t,i)=>'<div class="team"><strong>'+EMO[i]+' '+esc(t)+' ('+state.counts[i]+'/6)</strong>'+state.players.filter(p=>p.team===i).map(p=>'<div>• '+esc(p.name)+'</div>').join('')+'</div>').join('')+'</div></div>'}
function hostView(){let phase=state.phase;const done=state.completed;return header()+'<div class="eyebrow">Кабинет ведущего · Комната '+auth.code+'</div><div class="actions">'+button('Обновить','refresh()','small alt')+button('Скачать протокол','exportCSV()','small alt')+button('Проверить баланс','runSimulation()','small alt')+button('Выйти','logout()','small alt')+button('Начать заново','reset()','small danger')+'</div><section class="section"><h1>'+ (done?'Игра завершена':'Политическая ситуация')+'</h1><p class="sub">'+(done?'Проведите обсуждение стратегий и решений участников.':'Управляйте фазами, пока участники принимают решения со смартфонов.')+'</p></section>'+common()+'<div class="section"></div><div class="cols"><div>'+ (phase!=='lobby'?scenario():qr())+'<div class="actions">'+(done?'':button(stage[phase]||'Продолжить',"action('phase')"))+'</div><p class="progress">Подключено '+state.players.length+' / 30 · Ответов в этом раунде: '+state.votesCount+' / '+state.players.length+'</p><div class="section"></div>'+players()+'<div class="section"></div>'+adjustmentUI()+'</div><div>'+ranking()+'<div class="section"></div>'+historyPanel()+'</div></div>'}
function chatUI(){const own=state.myTeam;const msgs=(state.messages||[]).filter(m=>m.round===state.round);return '<div class="panel"><h3>Дипломатические сообщения</h3><p class="muted">Публичные заявления и закрытая переписка. Закрытые сообщения видят только две делегации и ведущий.</p><div style="max-height:240px;overflow:auto;margin:12px 0">'+(msgs.length?msgs.map(m=>'<div class="team" style="margin-bottom:7px"><strong>'+esc(TEAMS[m.from])+' → '+(m.to===-1?'Все делегации':esc(TEAMS[m.to]))+'</strong>'+esc(m.text)+'</div>').join(''):'<p class="note">Сообщений пока нет.</p>')+'</div><select class="field" id="msgTarget"><option value="-1">Публичное обращение ко всем</option>'+TEAMS.map((t,i)=>i!==own?'<option value="'+i+'">'+esc(t)+'</option>':'').join('')+'</select><input class="field" id="msgText" maxlength="300" placeholder="Текст обращения (до 300 символов)">'+button('Отправить сообщение','sendMessage()','small')+'</div>'}
function sendMessage(){const text=document.querySelector('#msgText')?.value?.trim();const target=Number(document.querySelector('#msgTarget')?.value);if(!text||text.length<2)return toast('Напишите сообщение');action('message',{text,target})}
function adjustmentUI(){return '<div class="panel"><h3>Корректировка ведущего</h3><p class="muted">Изменение очков или показателей с сохранением в протоколе.</p><select class="field" id="adjustKind" onchange="adjustTargets()"><option value="metric">Показатель государства</option><option value="score">Очки делегации</option></select><select class="field" id="adjustTarget"><option value="0">Доверие</option><option value="1">Экономика</option><option value="2">Политическая стабильность</option></select><input class="field" type="number" id="adjustAmount" value="1" min="-20" max="20">'+button('Применить поправку','adjust()','small alt')+'</div>'}
function adjustTargets(){const k=document.querySelector('#adjustKind').value;document.querySelector('#adjustTarget').innerHTML=(k==='score'?TEAMS:['Доверие','Экономика','Политическая стабильность']).map((t,i)=>'<option value="'+i+'">'+esc(t)+'</option>').join('')}
function adjust(){const kind=document.querySelector('#adjustKind').value,metric=Number(document.querySelector('#adjustTarget').value),amount=Number(document.querySelector('#adjustAmount').value);if(!Number.isInteger(amount)||Math.abs(amount)>20)return toast('Допустимо целое изменение от −20 до +20');action('adjust',{kind,metric,amount})}
function historyPanel(){return '<section class="panel"><h3>Протокол решений</h3>'+(state.history.length?state.history.slice().reverse().map(h=>'<div class="history"><div class="number">РАУНД '+(h.round+1)+'</div><strong>'+esc(h.title)+'</strong><p class="muted">Решение: '+esc(h.choice)+'</p><p class="note">Итог: '+esc(h.regime)+'</p><p class="note">Доверие '+h.metrics[0]+' · Экономика '+h.metrics[1]+' · Стабильность '+h.metrics[2]+'</p></div>').join(''):'<p class="muted">История появится после первого кризиса.</p>')+'</section>'}
async function runSimulation(){try{const x=await api('simulate');const outcomes=Object.entries(x.outcomes).map(([k,v])=>k+': '+v+' / '+x.trials).join('\\n');const winners=x.wins.map((n,i)=>TEAMS[i]+': '+n).join('\\n');alert('Автотест '+x.trials+' случайных полных партий (случайные стратегии, не оптимальные):\\n\\nИсходы:\\n'+outcomes+'\\n\\nПобеды/разделённое лидерство:\\n'+winners+'\\n\\nСредние показатели: '+x.averages.join(' / '))}catch(e){toast(e.message)}}
function exportCSV(){if(!state?.history?.length){toast('Сначала завершите первый раунд');return}const rows=[['Раунд','Кризис','Решение','Доверие','Экономика','Стабильность','Исход'],...state.history.map(h=>[h.round+1,h.title,h.choice,...h.metrics,h.regime])];const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='areya-'+auth.code+'-protocol.csv';a.click();URL.revokeObjectURL(url)}
async function reset(){if(confirm('Перезапустить игру с теми же участниками?'))await action('reset')}
function voteUI(){const voted=state.voted;return '<div class="panel"><h3>Выберите стратегию делегации</h3><p class="muted">Ваш голос учитывается при определении позиции команды. До завершения голосования стратегии других групп скрыты.</p><div class="section"></div>'+state.scenario.options.map((x,i)=>'<button class="choice '+(state.myVote===i?'selected':'')+'" onclick="action(\'vote\',{value:'+i+'})"><span style="font-size:24px">'+(state.myVote===i?'◉':'○')+'</span><span><strong>'+esc(x[0])+'</strong><small>'+(state.myVote===i?'Ваш текущий выбор. Можно изменить до закрытия голосования.':'Проголосовать за этот курс')+'</small></span></button>').join('')+'<p class="note">'+(voted?'Ваш голос принят.':'Голос ещё не подан.')+' В комнате проголосовало '+state.votesCount+' человек.</p></div>'}
function allyUI(){let mine=state.myTeam,other=state.alliances.filter(a=>a.to===mine||a.from===mine);return '<div class="panel"><h3>Коалиционная дипломатия</h3><p class="muted">Договоритесь устно или через сообщение, затем подтвердите союз. Союз действует один раунд.</p><select class="field" id="target">'+TEAMS.map((t,i)=>i!==mine?'<option value="'+i+'">'+esc(t)+'</option>':'').join('')+'</select>'+button('Предложить союз',"action('alliance',{target:Number(document.querySelector('#target').value)})",'small')+'<div class="section"></div>'+ (other.length?other.map(a=>'<div class="team"><strong>'+esc(TEAMS[a.from])+' → '+esc(TEAMS[a.to])+'</strong><p class="note">'+(a.status==='accepted'?'Союз заключён':a.status==='rejected'?'Отклонён':'Ожидает подтверждения')+'</p>'+(a.to===mine&&a.status==='pending'?button('Принять',"action('accept',{id:'"+a.id+"',accept:true})",'small')+' '+button('Отклонить',"action('accept',{id:'"+a.id+"',accept:false})",'small alt'):'')+'</div>').join(''):'<p class="note">Предложений пока нет.</p>')+'</div>'}
const POWERS=[['emergency','endorse'],['referendum','no_confidence'],['investment','blockade','veto'],['investigation','endorse'],['coup','veto','block']];
const TITLES={emergency:'Чрезвычайное положение',endorse:'Публичная поддержка / критика',referendum:'Референдум',no_confidence:'Вотум недоверия',investment:'Политические инвестиции',blockade:'Экономическая блокада',veto:'Вето',investigation:'Расследование',coup:'Попытка переворота',block:'Блокирование решения'};
function powers(){let mine=state.myTeam;if(!state.teamLeader)return '<div class="panel"><h3>Политические инструменты</h3><p class="muted">Специальные полномочия применяет руководитель делегации — первый подключившийся студент. Ваш голос определяет позицию команды.</p></div>';return '<div class="panel"><h3>Политические инструменты</h3><p class="muted">Специальные действия влияют на итоги кризиса. Часть из них доступна только один раз за игру.</p>'+POWERS[mine].map(k=>'<button class="choice" onclick="power(\''+k+'\')"><span>✦</span><strong>'+TITLES[k]+(state.used.includes(k)?' · использовано':'')+'</strong></button>').join('')+'<p class="note">Действие от имени делегации может отправить любой её участник. Повторное применение в том же раунде заблокировано.</p></div>'}
async function power(type){if(['investment','blockade','investigation','endorse'].includes(type)){const x=prompt('Номер целевой делегации (1–5):\n'+TEAMS.map((t,i)=>(i+1)+'. '+t).join('\n'));if(!x)return;const target=Number(x)-1;const value=type==='endorse'&&confirm('Выбрать негативную оценку?')?-1:1;return action('action',{type,target,value})}if(confirm('Подтвердить: '+TITLES[type]+'?'))return action('action',{type})}
function playerView(){const mine=state.myTeam,done=state.completed;return header()+'<div class="eyebrow">Делегация '+EMO[mine]+' '+esc(TEAMS[mine])+'</div><div class="actions">'+button('Обновить','refresh()','small alt')+button('Выйти','logout()','small alt')+'</div><h1 style="margin-bottom:7px">'+(done?'Политический финал':'Ваша политическая роль')+'</h1><p class="sub">Личная миссия: '+esc(state.mission)+'. Влияние делегации: <strong>'+state.scores[mine]+' очков</strong>. '+(state.teamLeader?'Вы руководитель делегации.':'')+'</p>'+common()+'<div class="section"></div><div class="cols"><div>'+(state.phase==='lobby'?'<div class="panel"><h2>Ожидание старта</h2><p class="sub">Вы подключены к комнате '+auth.code+'. Дождитесь, когда преподаватель запустит игру.</p><span class="phase">Участников: '+state.players.length+'</span></div>':scenario())+'<div class="section"></div>'+(state.phase==='voting'?voteUI():state.phase==='negotiations'?allyUI()+'<div class="section"></div>'+chatUI():state.phase==='results'?'<div class="panel"><h3>Раунд завершён</h3><p class="sub">Смотрите результаты на проекторе. Ваши дальнейшие действия станут доступны в следующем раунде.</p></div>':'<div class="panel"><p class="muted">Следуйте указаниям ведущего. Действия откроются на соответствующем этапе.</p></div>'+(state.phase==='scenario'?'<div class="section"></div>'+chatUI():''))+'</div><div>'+ (['negotiations','voting'].includes(state.phase)?powers():ranking())+'<div class="section"></div>'+historyPanel()+'</div></div>'}
function render(){if(!auth){welcome();return}if(!state){app.innerHTML=header()+'<p class="sub">Подключение к игровой комнате…</p>';return}app.innerHTML=auth.host?hostView():playerView();}
if(auth){refresh()}else if(roomFromURL)joinForm();else welcome();
function updateTimer(){const el=document.querySelector('#timer');if(!el||!state||!DURATION[state.phase])return;const remaining=Math.max(0,DURATION[state.phase]-Math.floor((Date.now()-(state.phaseStarted||Date.now()))/1000));el.textContent='⏱ '+String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0')+(remaining===0?' · Время вышло':'')}
setInterval(updateTimer,1000);
setInterval(()=>{if(auth&&!loading&&document.visibilityState==='visible')refresh()},2500);
</script></body></html>
