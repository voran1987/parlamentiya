<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Политический код — сценарий ведущего</title><style>body{background:#091323;color:#eef5ff;font:16px system-ui;margin:0}main{max-width:1200px;margin:auto;padding:18px}h1{color:#f3c976}.card{background:#172940;border:1px solid #3b526d;border-radius:16px;padding:18px;margin:12px 0}.muted{color:#b6c7dc}iframe{width:100%;height:850px;border:0;background:#091323}button{background:#f3c976;border:0;border-radius:10px;padding:12px;font-weight:bold}ol{line-height:1.8}</style><main><h1>Политический код — кабинет ведущего</h1><p class="muted">Сценарий занятия расположен над действующей панелью игры. Ваш вход ведущего сохраняется в адресе комнаты.</p><div class="card" id="guide"><h2>Зал ожидания</h2><p>Подключите шесть делегаций, покажите QR-код и объясните правила. После подключения начинайте игру.</p></div><div class="card"><h2>Управление игрой</h2><iframe id="game" title="Кабинет политического симулятора" src="index.html"></iframe></div></main><script>
const guide=document.getElementById('guide'),frame=document.getElementById('game');
frame.src='index.html'+location.search;
const blocks=[
['Зал ожидания','Подключите команды по QR-коду и распределите шесть стран. Объясните правила и запустите игру.'],
['Раунд 1. Диагностика политической культуры','12–15 минут. Команды классифицируют политическую культуру по Алмонду и Вербе и режим по Линцу. Попросите минимум два факта из досье. После ответов раскройте результаты и оцените аргументацию.'],
['Раунд 2. Политические ориентации','10–12 минут. Команды анализируют когнитивные (знания), аффективные (доверие, эмоции) и оценочные (ощущение влияния) ориентации граждан. Сравните страны после раскрытия ответов.'],
['Раунд 3. Первый политический кризис','15 минут. У каждой страны собственный сценарий о доверии и участии. Команды выбирают меру реагирования и аргументируют последствия для легитимности, участия и стабильности.'],
['Раунд 4. Второй политический кризис','15 минут. Команды выбирают институциональный ответ на новый вызов. Обсудите обратную связь системы и факторы стресса по Истону.'],
['Раунд 5. Прогноз развития','12–15 минут. Команды определяют тип легитимности по Веберу и предлагают обоснованный сценарий на 10–15 лет, называя факторы устойчивости и риска.'],
['Итоги и дискуссия','10 минут. Сравните решения делегаций. Проверьте, как студенты применили теории Алмонда и Вербы, Линца, Вебера и Истона. Экспортируйте результаты CSV.']];
setInterval(()=>{try{let name=frame.contentDocument.querySelector('main h1')?.textContent||'';let titles=['Зал ожидания','Диагностика политической культуры','Политические ориентации','Кризис I','Кризис II','Прогноз развития','Игра завершена'];let i=titles.findIndex(x=>name.includes(x));if(i<0)return;guide.innerHTML='<h2>'+blocks[i][0]+'</h2><p>'+blocks[i][1]+'</p><p class="muted">После раскрытия ответов оцените аргументацию в панели ниже и нажмите «Следующий этап».</p>';}catch(e){}},2500);
</script></html>
