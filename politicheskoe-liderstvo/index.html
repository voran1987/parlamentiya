function metrics(m){return `<div class="grid">${metric('ДОВЕРИЕ ГРАЖДАН',m.trust)}${metric('ЭКОНОМИКА',m.economy)}${metric('СТАБИЛЬНОСТЬ',m.stability)}</div>`}
function rank(s){return `<div class="ranking">${[...ROLES].sort((a,b)=>s.scores[b.id]-s.scores[a.id]).map((r,i)=>`<div class="item"><span>${i+1}. ${r.icon} ${r.short}</span><strong>${s.scores[r.id]} очк.</strong></div>`).join('')}</div>`}
function steps(s){return `<div class="steps">${Object.entries(PHASES).filter(([k])=>!['lobby','finished'].includes(k)).map(([k,n])=>`<span class="${s.phase===k?'active':''}">${esc(n)}</span>`).join('')}</div>`}
function scenario(s){const sc=SCENARIOS[Math.min(s.round,7)];return `<div><div class="eyebrow">РАУНД ${s.round+1} ИЗ 8 · ${esc(PHASES[s.phase])}</div><span class="tag gold" id="gameTimer"></span><h2 class="title">${esc(sc.title)}</h2><p class="subtitle">${esc(sc.story)}</p></div>`}
function options(s,sel=selectedOption){return SCENARIOS[Math.min(s.round,7)].options.map((o,i)=>`<button class="option ${sel===o.id?'selected':''}" data-option="${o.id}"><span class="number">ВАРИАНТ ${String.fromCharCode(1040+i)}</span><br>${esc(o.title)}</button>`).join('')}
function counts(s){const c={};for(const b of Object.values(s.ballots||{})){c[b.role]??={a:0,b:0,c:0};c[b.role][b.option]++}return c}
function possibleChoice(s){const group=counts(s)[s.leader]||{a:0,b:0,c:0};return ['a','b','c'].sort((a,b)=>group[b]-group[a])[0]}
function showLobby(){const saved=session;return `<section class="hero"><div class="eyebrow">Стратегический симулятор политических элит</div><h1>Власть. Влияние.<br><span style="color:#d2b47b">Решение.</span></h1><p>Пять политических элит. Восемь кризисов. Один политический режим. Договаривайтесь, формируйте коалиции и определяйте будущее Республики Арея.</p></section><div class="split" style="max-width:860px;margin:auto"><div class="panel"><h2>🎓 Преподавателю</h2><p class="muted">Создайте комнату, выведите QR-код на проектор и управляйте политическими кризисами.</p><button class="primary" data-action="create">Создать игру</button></div><div class="panel"><h2>📱 Участнику</h2><label class="formlabel">Код комнаты</label><input id="roomCode" class="input" placeholder="Например, A92F10" maxlength="8" value="${esc(new URLSearchParams(location.search).get('room')||'')}"><label class="formlabel">Имя или псевдоним</label><input id="playerName" class="input" placeholder="Участник" maxlength="40"><label class="formlabel">Делегация</label><div class="grid5" style="grid-template-columns:repeat(2,1fr)">${ROLES.map(x=>`<button class="role ${selectedRole===x.id?'selected':''}" data-role="${x.id}"><span class="emoji">${x.icon}</span><strong>${esc(x.name)}</strong></button>`).join('')}</div><button class="primary" style="margin-top:15px;width:100%" data-action="join">Подключиться</button></div></div><div class="panel" style="max-width:860px;margin:16px auto"><div class="row"><div><strong>Режим работы</strong><p class="muted mini">${mode==='local'?'Локальная демонстрация: разные вкладки одного браузера.':'Облачный режим: телефоны подключаются через интернет к Supabase.'}</p></div><button class="secondary" data-action="switch">${mode==='local'?'Переключить на Supabase':'Переключить на демонстрацию'}</button></div></div>`}
function qr(code){const url=new URL(location.href);url.search='?room='+encodeURIComponent(code);return `<div class="qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&margin=4&data=${encodeURIComponent(url.toString())}" alt="QR-код подключения"></div><a href="${esc(url.toString())}" target="_blank" rel="noopener noreferrer" style="font-size:12px;overflow-wrap:anywhere">${esc(url.toString())}</a>`}
function hostView(d){const s=d.state,people=d.players;const sc=SCENARIOS[Math.min(s.round,7)];return `<div class="row"><div><div class="eyebrow">ПАНЕЛЬ ПРЕПОДАВАТЕЛЯ</div><h1 class="title">Управление игрой</h1></div><span class="tag gold">КОМНАТА ${esc(session.code)}</span></div>${s.phase==='lobby'?`<div class="layout"><div class="panel"><h2>Подключение участников</h2><div class="row"><div>${qr(session.code)}</div><div><div class="muted mini">КОД КОМНАТЫ</div><div class="code">${esc(session.code)}</div><p>На смартфонах откройте адрес по QR-коду, укажите имя и выберите делегацию.</p><p class="muted">Всего подключено: ${people.length} / 30</p></div></div><div class="hline"></div><h3>Состав делегаций</h3><div class="stack">${ROLES.map(r=>`<div class="row"><span>${r.icon} ${r.name}</span><span class="tag">${people.filter(p=>p.role===r.id).length} / 6</span></div>`).join('')}</div><div class="hline"></div><button class="primary" data-action="phase" data-phase="briefing" ${people.length<5?'disabled':''}>Начать игру</button><p class="muted mini">Для старта требуется минимум 5 студентов; по одному на делегацию.</p></div><div class="panel"><h3>Участники</h3>${people.map(p=>`<p class="mini">${role(p.role).icon} ${esc(p.name)} · ${role(p.role).short}</p>`).join('')||'<p class="muted">Пока никого нет</p>'}</div></div>`:`${metrics(s.metrics)}<div class="layout" style="margin-top:18px"><div><div class="panel">${scenario(s)}${steps(s)}${s.phase==='resolution'?`<div class="notice good"><strong>Итог:</strong> ${esc(sc.options.find(o=>o.id===s.decision)?.title||'')}</div>`:s.phase==='finished'?`<div class="notice good"><strong>Политический финал:</strong> ${esc(outcome(s))}</div>`:`<div class="notice">Секретные решения делегаций не раскрываются до завершения стадии голосования.</div>`}<div class="hline"></div>${s.phase==='briefing'?`<button class="primary" data-action="phase" data-phase="caucus">Начать обсуждение</button>`:''}${s.phase==='caucus'?`<button class="primary" data-action="phase" data-phase="negotiation">Открыть переговоры</button>`:''}${s.phase==='negotiation'?`<button class="primary" data-action="phase" data-phase="ballot">Закрыть переговоры и открыть финальное голосование</button>`:''}${s.phase==='ballot'?`<h3>Выберите итоговое решение государства</h3><p class="muted mini">По умолчанию выделено большинство голосов правящей делегации. Ведущий вправе учесть вето, референдум и политические переговоры.</p>${options(s)}<button class="primary" data-action="resolve">Зафиксировать решение и рассчитать последствия</button>`:''}${s.phase==='resolution'?`<button class="primary" data-action="next">${s.round===7?'Завершить игру':'Следующий раунд →'}</button>`:''}${s.phase==='finished'?`<button class="primary" data-action="export">Экспортировать протокол CSV</button><button class="ghost" data-action="reset">Новая партия</button>`:''}</div><div class="panel"><h3>История политических решений</h3>${history(s)}</div></div><div><div class="panel"><h3>Политическое влияние</h3>${rank(s)}</div><div class="panel"><h3>Подключение</h3><p class="muted">${people.length} игроков · ${new Set(people.map(p=>p.role)).size} делегаций</p><div class="code" style="font-size:23px">${esc(session.code)}</div><details><summary class="mini">Показать QR-код</summary>${qr(session.code)}</details><div class="hline"></div><h4>Поданные голоса</h4>${ROLES.map(r=>`<div class="row mini"><span>${r.icon} ${r.short}</span><span>${Object.values(s.ballots||{}).filter(b=>b.role===r.id).length}/${people.filter(p=>p.role===r.id).length}</span></div>`).join('')}<div class="hline"></div><p class="muted mini">${s.phase==='ballot'?'После закрытия голосования ведущий выбирает итоговый акт.':'Индивидуальные решения скрыты в ходе переговоров.'}</p></div><div class="panel"><h3>Коалиции</h3>${s.offers.filter(o=>o.status==='accepted').map(o=>`<div class="item mini">${role(o.from).short} + ${role(o.to).short}: ${o.option.toUpperCase()}</div>`).join('')||'<p class="muted mini">Нет подтверждённых союзов</p>'}</div><div class="panel"><h4>Специальные действия</h4>${ROLES.map(r=>`<div class="mini" style="padding:4px">${r.icon} ${r.short}: ${s.powers[r.id]?'использовано':'доступно'}</div>`).join('')}</div></div></div>`}<p class="footer">Дидактический симулятор. Последствия решений являются условной моделью, а не прогнозом реальной политики.</p>`}
function history(s){return (s.history||[]).length?`<div class="history">${[...s.history].reverse().map(h=>`<div class="item"><div class="number">РАУНД ${h.round} · ${esc(h.scenario)}</div><strong>${esc(h.option)}</strong><p class="mini muted">Доверие ${h.after.trust} · Экономика ${h.after.economy} · Стабильность ${h.after.stability}</p></div>`).join('')}</div>`:'<p class="muted">Пока нет завершённых раундов</p>'}
function playerView(d){const s=d.state,r=role(d.role),sc=SCENARIOS[Math.min(s.round,7)],myvotes=Object.entries(s.ballots||{}).filter(([id,b])=>b.role===r.id),mine=s.ballots?.[d.playerId]?.option,offerTo=s.offers.filter(o=>o.to===r.id&&o.status==='pending'),allies=s.offers.filter(o=>(o.to===r.id||o.from===r.id)&&o.status==='accepted');return `<div class="phone"><div class="row"><div><div class="eyebrow">ВАША ДЕЛЕГАЦИЯ</div><h1 class="title">${r.icon} ${r.name}</h1></div><span class="tag gold">${s.scores[r.id]} очков</span></div><div class="panel"><p class="muted mini">ПОЛИТИЧЕСКАЯ МИССИЯ</p><p>${esc(r.mission)}</p><div class="row"><span class="tag">Особое действие: ${esc(r.power)}</span><span class="tag ${s.powers[r.id]?'bad':'good'}">${s.powers[r.id]?'использовано':'доступно'}</span></div></div>${s.phase==='lobby'?`<div class="panel center"><div class="face">⌛</div><h2>Ожидание начала</h2><p class="muted">Преподаватель собирает делегации. Сейчас подключено ${d.players.length} студентов.</p></div>`:s.phase==='finished'?`<div class="panel"><h2>Игра завершена</h2><p class="notice good">${esc(outcome(s))}</p>${rank(s)}<h3>Протокол</h3>${history(s)}</div>`:`${metrics(s.metrics)}<div class="panel" style="margin-top:14px">${scenario(s)}${steps(s)}${s.phase==='resolution'?`<div class="notice good"><strong>Принятое решение:</strong> ${esc(sc.options.find(o=>o.id===s.decision)?.title||'')}</div><p class="muted">Ожидайте следующего раунда.</p>`:`<h3>Ваша стратегия</h3><p class="muted mini">Выберите вариант. Решение можно изменить, пока открыто голосование.</p>${options(s,mine||selectedOption)}<button class="primary" data-action="vote" ${s.phase==='briefing'?'disabled':''} style="width:100%">${mine?'Изменить свой голос':'Подать закрытый голос'}</button><p class="muted mini">Голосов в делегации: ${myvotes.length} / ${d.players.filter(p=>p.role===r.id).length}</p>`}</div>${s.phase==='negotiation'?`<div class="panel"><h3>🤝 Дипломатия и союзы</h3><p class="muted mini">Отправьте предложение другой элите: совместно поддержать конкретное решение.</p><label class="formlabel">Кому направить</label><select class="input" id="targetRole">${ROLES.filter(x=>x.id!==r.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label class="formlabel">Какой вариант поддержать</label><select class="input" id="offerOption">${sc.options.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join('')}</select><button class="secondary" data-action="offer">Предложить союз</button>${offerTo.length?`<h4>Входящие предложения</h4>${offerTo.map(o=>`<div class="card"><p class="mini"><strong>${role(o.from).name}</strong> предлагает вариант ${o.option.toUpperCase()}</p><button class="primary" data-action="respond" data-id="${o.id}" data-answer="accepted">Принять</button> <button class="ghost" data-action="respond" data-id="${o.id}" data-answer="rejected">Отклонить</button></div>`).join('')}`:''}${allies.length?`<h4>Подтверждённые соглашения</h4>${allies.map(o=>`<p class="mini">✓ ${role(o.from).short} — ${role(o.to).short} (вариант ${o.option.toUpperCase()})</p>`).join('')}`:''}</div>`:''}${['negotiation','ballot'].includes(s.phase)&&!s.powers[r.id]?`<div class="panel"><h3>⚡ Специальная возможность</h3><p class="muted mini">${esc(r.power)} — один раз за игру.</p>${['business','media'].includes(r.id)?`<select class="input" id="powerTarget">${ROLES.filter(x=>x.id!==r.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select>`:''}<button class="danger" data-action="power">Применить способность</button>${r.id==='security'?'<p class="muted mini">Переворот разрешён при стабильности ниже 35.</p>':''}</div>`:''}<div class="panel"><h3>Рейтинг элит</h3>${rank(s)}</div>`}<p class="footer">Каждый студент голосует индивидуально. Действия каждой делегации учитываются в общей политической системе.</p></div>`}
async function refresh(force=false){if(!session||polling)return;polling=true;try{const s=await snap();if(force||s.state.version!==lastVersion||!snapshot||JSON.stringify(s.players)!==JSON.stringify(snapshot.players)){snapshot=s;lastVersion=s.state.version;render()}$('status').textContent=(mode==='local'?'● Демо':'● Онлайн')+' · '+session.code}catch(e){$('status').textContent='● Ошибка соединения';if(force)notify(e.message)}finally{polling=false}}
function render(){saveSession();const app=$('app');if(!session){app.innerHTML=showLobby();return}app.innerHTML=snapshot?(snapshot.kind==='host'?hostView(snapshot):playerView(snapshot)):'<div class="hero"><h2>Подключение...</h2></div>';if(snapshot?.kind==='host'&&snapshot.state.phase==='ballot'&&selectedOption==='a'&&counts(snapshot.state)[snapshot.state.leader]){const leading=possibleChoice(snapshot.state);if(leading!=='a'){selectedOption=leading;app.querySelectorAll('[data-option]').forEach(b=>b.classList.toggle('selected',b.dataset.option===leading))}}}
function exportCSV(s){const rows=[['Раунд','Кризис','Решение','Доверие','Экономика','Стабильность'],...s.history.map(h=>[h.round,h.scenario,h.option,h.after.trust,h.after.economy,h.after.stability])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='areya-protokol-'+session.code+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action],[data-role],[data-option]');if(!el)return;if(el.dataset.role){selectedRole=el.dataset.role;document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('selected',b.dataset.role===selectedRole));return}if(el.dataset.option){selectedOption=el.dataset.option;document.querySelectorAll('[data-option]').forEach(b=>b.classList.toggle('selected',b.dataset.option===selectedOption));return}try{switch(el.dataset.action){case'switch':mode=mode==='local'?'cloud':'local';localStorage.setItem('pl_mode',mode);notify(mode==='local'?'Демонстрационный режим':'Облачный режим');render();break;case'create':session=await create();saveSession();await refresh(true);break;case'join':{const code=$('roomCode').value.trim().toUpperCase(),name=$('playerName').value.trim();if(!/^[A-Z0-9]{6,8}$/.test(code))throw Error('Введите код из 6 символов');if(name.length<2)throw Error('Введите имя (минимум 2 символа)');session=await join(code,name,selectedRole);saveSession();await refresh(true);break}case'phase':await perform('phase',{phase:el.dataset.phase});break;case'vote':await perform('ballot',{option:selectedOption});break;case'offer':await perform('offer',{target:$('targetRole').value,option:$('offerOption').value});break;case'respond':await perform('respond',{id:el.dataset.id,response:el.dataset.answer});break;case'power':await perform('power',{target:$('powerTarget')?.value||''});break;case'resolve':await perform('resolve',{option:selectedOption});break;case'next':await perform('next');break;case'export':exportCSV(snapshot.state);break;case'reset':if(confirm('Сбросить текущую партию и все результаты?'))await perform('reset');break;}}catch(err){notify(err.message)}});
$('leave').addEventListener('click',()=>{if(confirm('Выйти из комнаты на этом устройстве?')){session=null;snapshot=null;lastVersion=-1;saveSession();render()}});
window.addEventListener('storage',ev=>{if(mode==='local'&&session&&ev.key==='pl_touch_'+session.code)refresh(true)});
localChan=new BroadcastChannel('pl_local');localChan.onmessage=e=>{if(mode==='local'&&e.data.code===session?.code)refresh(true)};
render();if(session)refresh(true);setInterval(()=>{if(session&&document.visibilityState==='visible')refresh()},2300);

function updateTimer(){const el=$('gameTimer');if(!el||!snapshot)return;const end=snapshot.state.phaseEnd||0;if(!end){el.textContent='';return}const t=Math.max(0,Math.ceil((end-Date.now())/1000));el.textContent=t>0?`⏱ ${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`:'⏱ Время истекло';}
setInterval(updateTimer,500);

</script></body></html>
